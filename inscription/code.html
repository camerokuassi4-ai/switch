<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Inscription - Switch</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link rel="stylesheet" href="../assets/switch.css">
    <script src="../assets/switch.config.js"></script>

    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        @keyframes subtle-pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(123, 92, 250, 0.4);
            }

            70% {
                box-shadow: 0 0 0 6px rgba(123, 92, 250, 0);
            }

            100% {
                box-shadow: 0 0 0 0 rgba(123, 92, 250, 0);
            }
        }

        .input-focus-ring:focus-within {
            animation: subtle-pulse 1.5s infinite;
            border-color: #7B5CFA;
        }

        body {
            min-height: max(884px, 100dvh);
        }
    </style>
</head>

<body
    class="bg-background text-on-surface font-body-lg min-h-screen flex flex-col items-center justify-center p-container-margin antialiased selection:bg-primary-container selection:text-on-primary-container">

    <!-- Main Container -->
    <main
        class="w-full max-w-md bg-surface-container-lowest rounded-xl shadow-[0_10px_20px_-4px_rgba(0,0,0,0.04)] p-card-padding flex flex-col gap-stack-lg relative overflow-hidden">
        <!-- Decorative background elements -->
        <div
            class="absolute -top-20 -right-20 w-40 h-40 bg-primary-fixed opacity-50 rounded-full blur-3xl pointer-events-none">
        </div>
        <div
            class="absolute -bottom-20 -left-20 w-40 h-40 bg-surface-container-high opacity-50 rounded-full blur-3xl pointer-events-none">
        </div>

        <!-- Header Section (Flèche interne supprimée) -->
        <header class="text-center flex flex-col gap-stack-sm relative z-10 pt-stack-md">
            <div
                class="mx-auto w-16 h-16 bg-surface-container rounded-full flex items-center justify-center mb-2 shadow-sm">
                <span class="material-symbols-outlined text-primary text-[32px]">smartphone</span>
            </div>
            <h1
                class="font-display-lg-mobile text-display-lg-mobile md:font-display-lg md:text-display-lg text-on-surface">
                Bienvenue sur Switch</h1>
            <p class="font-body-lg text-body-lg text-on-surface-variant max-w-[280px] mx-auto">
                Saisissez votre numéro de téléphone pour commencer ou vous connecter.
            </p>
        </header>

        <!-- Form Section -->
        <form class="flex flex-col gap-stack-lg relative z-10 mt-stack-md" onsubmit="event.preventDefault();">
            <div class="flex flex-col gap-stack-sm">
                <label class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-wider ml-1"
                    for="phone-number">Numéro de téléphone</label>
                <!-- Phone Input Group -->
                <div
                    class="relative flex items-center bg-surface-container-lowest border border-surface-variant rounded-lg h-14 transition-colors duration-200 input-focus-ring overflow-hidden">
                    <!-- Country Code Selector -->
                    <div
                        class="flex items-center justify-center h-full px-4 bg-surface-container-low border-r border-surface-variant text-on-surface font-body-lg shrink-0 gap-2 cursor-pointer hover:bg-surface-container transition-colors">
                        <img alt="Flag of Benin" class="w-6 h-4 object-cover rounded-sm shadow-sm"
                            src="../assets/images/img_024.jpg" />
                        <span>+229</span>
                        <span
                            class="material-symbols-outlined text-on-surface-variant text-[18px]">arrow_drop_down</span>
                    </div>
                    <!-- Number Input -->
                    <input autocomplete="tel-national"
                        class="w-full h-full bg-transparent border-none text-on-surface font-headline-md focus:ring-0 placeholder:text-outline-variant px-4"
                        id="phone-number" name="phone-number" placeholder="01 23 45 67" required="" type="tel" />
                </div>
                <p class="font-body-sm text-body-sm text-outline mt-1 ml-1">
                    Un code de vérification vous sera envoyé par SMS.
                </p>
            </div>

            <!-- Submit Button -->
            <button onclick="window.location.href='../v_rification_otp/code.html'"
                class="w-full h-14 bg-primary text-on-primary font-headline-md rounded-full shadow-[0_4px_14px_0_rgba(94,59,220,0.39)] hover:shadow-[0_6px_20px_rgba(94,59,220,0.23)] hover:-translate-y-0.5 transition-all duration-200 flex items-center justify-center gap-2 mt-2 group active:scale-[0.98]"
                type="submit">
                <span>Suivant</span>
                <span
                    class="material-symbols-outlined group-hover:translate-x-1 transition-transform">arrow_forward</span>
            </button>
        </form>

        <!-- Terms Footer -->
        <footer class="mt-auto text-center relative z-10 pt-stack-md">
            <p class="font-body-sm text-body-sm text-on-surface-variant">
                En continuant, vous acceptez nos <a class="text-primary hover:underline font-semibold"
                    href="#">Conditions d'utilisation</a> et notre <a class="text-primary hover:underline font-semibold"
                    href="#">Politique de confidentialité</a>.
            </p>
        </footer>
    </main>

    <script>
        const phoneInput = document.getElementById('phone-number');
        const inputContainer = phoneInput.closest('.input-focus-ring');

        phoneInput.addEventListener('focus', () => {
            inputContainer.classList.add('border-primary');
            inputContainer.classList.remove('border-surface-variant');
        });

        phoneInput.addEventListener('blur', () => {
            inputContainer.classList.remove('border-primary');
            inputContainer.classList.add('border-surface-variant');
        });

        phoneInput.addEventListener('input', function (e) {
            let target = e.target;
            let val = target.value.replace(/\D/g, '');
            if (val.length > 0) {
                val = val.match(/.{1,2}/g).join(' ');
            }
            target.value = val.substring(0, 11);
        });
    </script>
    <script src="../assets/switch.forms.js"></script>
    <script src="../assets/switch.router.js"></script>
</body>

</html>
