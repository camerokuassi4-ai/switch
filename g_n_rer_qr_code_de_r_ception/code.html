<script>
        function switchTab(tab) {
            const indicator = document.getElementById('tab-indicator');
            const btnFixed = document.getElementById('btn-fixed');
            const btnDynamic = document.getElementById('btn-dynamic');
            const dynamicInput = document.getElementById('dynamic-input-area');

            if (tab === 'fixed') {
                indicator.style.transform = 'translateX(0)';
                btnFixed.classList.replace('text-on-surface-variant', 'text-primary');
                btnDynamic.classList.replace('text-primary', 'text-on-surface-variant');
                
                dynamicInput.classList.remove('opacity-100');
                dynamicInput.classList.add('opacity-0');
                setTimeout(() => {
                    dynamicInput.classList.add('hidden');
                }, 300);

            } else {
                // Assuming standard padding/margins for 50% width shift
                indicator.style.transform = 'translateX(100%)';
                btnDynamic.classList.replace('text-on-surface-variant', 'text-primary');
                btnFixed.classList.replace('text-primary', 'text-on-surface-variant');
                
                dynamicInput.classList.remove('hidden');
                // slight delay to allow display block to apply before opacity transition
                setTimeout(() => {
                    dynamicInput.classList.replace('opacity-0', 'opacity-100');
                }, 10);
            }
        }
    </script>
