<!DOCTYPE html>
<html class="light" lang="fr">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Création du Code PIN - Switch Bénin</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link rel="stylesheet" href="../assets/switch.css">
  <script src="../assets/switch.config.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800;900&display=swap');
    body {
      font-family: 'Hanken Grotesk', sans-serif;
      min-height: max(884px, 100dvh);
      background-color: #F8F9FD;
      color: #1C1A24;
      -webkit-font-smoothing: antialiased;
    }

    .pin-input {
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .pin-input:focus {
      border-color: #5E3BDC;
      box-shadow: 0 0 0 3px rgba(94, 59, 220, 0.18);
      background-color: #FFFFFF;
      outline: none;
    }
  </style>
</head>
<body class="min-h-screen pb-24 flex flex-col justify-between antialiased selection:bg-primary-fixed">

  <!-- Top App Bar -->
  <header class="w-full max-w-lg mx-auto px-container-margin pt-6 pb-2 flex items-center justify-between z-30">
    <button aria-label="Retour" onclick="window.history.back()" class="w-10 h-10 rounded-full flex items-center justify-center bg-white border border-outline-variant/40 shadow-sm hover:bg-surface-container transition-colors cursor-pointer text-on-surface">
      <span class="material-symbols-outlined text-xl">arrow_back</span>
    </button>
    
    <!-- Step 4/4 Progression Indicator (Complete) -->
    <div class="flex items-center gap-1">
      <span class="w-2 h-1.5 rounded-full bg-primary"></span>
      <span class="w-2 h-1.5 rounded-full bg-primary"></span>
      <span class="w-2 h-1.5 rounded-full bg-primary"></span>
      <span class="w-6 h-1.5 rounded-full bg-primary"></span>
    </div>
    <div class="w-10"></div>
  </header>

  <!-- Main Content Canvas -->
  <main class="w-full max-w-lg mx-auto px-container-margin flex flex-col items-center text-center gap-6 pt-2 flex-1 justify-center">
    
    <!-- Glowing Lock Icon Header -->
    <div class="relative w-20 h-20 flex items-center justify-center">
      <div class="absolute inset-0 bg-primary/20 rounded-full blur-xl animate-pulse"></div>
      <div class="w-16 h-16 rounded-2xl bg-white border border-primary/20 shadow-md flex items-center justify-center text-primary relative z-10">
        <span class="material-symbols-outlined text-3xl" style="font-variation-settings: 'FILL' 1;">lock</span>
      </div>
    </div>

    <!-- Title & Description -->
    <div class="space-y-1 max-w-xs">
      <h1 class="text-2xl sm:text-3xl font-extrabold text-on-surface tracking-tight">Code Secret PIN</h1>
      <p class="text-xs sm:text-sm text-on-surface-variant font-medium">
        Définissez votre code secret à 4 chiffres pour valider vos paiements et transferts.
      </p>
    </div>

    <!-- Form Container -->
    <form class="w-full max-w-sm flex flex-col gap-4 mt-1" onsubmit="event.preventDefault(); validatePins();">
      
      <!-- Card 1 : Saisir le nouveau Code PIN -->
      <div class="bg-white rounded-3xl p-5 border border-outline-variant/40 shadow-sm flex flex-col gap-3">
        <div class="flex items-center justify-between">
          <label class="text-xs font-black uppercase tracking-wider text-primary flex items-center gap-1.5">
            <span class="w-4 h-4 rounded-full bg-primary text-white text-[9px] flex items-center justify-center font-bold">1</span>
            <span>Nouveau Code PIN</span>
          </label>
          <button type="button" onclick="togglePinVisibility(1)" class="text-[11px] font-bold text-on-surface-variant hover:text-primary flex items-center gap-1 cursor-pointer">
            <span class="material-symbols-outlined text-sm" id="eye-icon-1">visibility</span>
            <span id="eye-text-1">Afficher</span>
          </button>
        </div>

        <div class="flex justify-center gap-3">
          <input aria-label="PIN 1 - Chiffre 1" class="pin-input w-12 h-14 sm:w-14 sm:h-16 text-center font-mono font-black text-2xl rounded-2xl bg-surface-container/50 border border-outline-variant/50 shadow-sm text-primary" id="p1-0" inputmode="numeric" maxlength="1" pattern="[0-9]*" type="password" autofocus/>
          <input aria-label="PIN 1 - Chiffre 2" class="pin-input w-12 h-14 sm:w-14 sm:h-16 text-center font-mono font-black text-2xl rounded-2xl bg-surface-container/50 border border-outline-variant/50 shadow-sm text-primary" id="p1-1" inputmode="numeric" maxlength="1" pattern="[0-9]*" type="password"/>
          <input aria-label="PIN 1 - Chiffre 3" class="pin-input w-12 h-14 sm:w-14 sm:h-16 text-center font-mono font-black text-2xl rounded-2xl bg-surface-container/50 border border-outline-variant/50 shadow-sm text-primary" id="p1-2" inputmode="numeric" maxlength="1" pattern="[0-9]*" type="password"/>
          <input aria-label="PIN 1 - Chiffre 4" class="pin-input w-12 h-14 sm:w-14 sm:h-16 text-center font-mono font-black text-2xl rounded-2xl bg-surface-container/50 border border-outline-variant/50 shadow-sm text-primary" id="p1-3" inputmode="numeric" maxlength="1" pattern="[0-9]*" type="password"/>
        </div>
      </div>

      <!-- Card 2 : Confirmer le Code PIN -->
      <div class="bg-white rounded-3xl p-5 border border-outline-variant/40 shadow-sm flex flex-col gap-3">
        <div class="flex items-center justify-between">
          <label class="text-xs font-black uppercase tracking-wider text-on-surface-variant flex items-center gap-1.5" id="label-confirm">
            <span class="w-4 h-4 rounded-full bg-surface-container text-on-surface-variant text-[9px] flex items-center justify-center font-bold" id="badge-confirm">2</span>
            <span>Confirmer le Code PIN</span>
          </label>
          <button type="button" onclick="togglePinVisibility(2)" class="text-[11px] font-bold text-on-surface-variant hover:text-primary flex items-center gap-1 cursor-pointer">
            <span class="material-symbols-outlined text-sm" id="eye-icon-2">visibility</span>
            <span id="eye-text-2">Afficher</span>
          </button>
        </div>

        <div class="flex justify-center gap-3">
          <input aria-label="PIN 2 - Chiffre 1" class="pin-input w-12 h-14 sm:w-14 sm:h-16 text-center font-mono font-black text-2xl rounded-2xl bg-surface-container/50 border border-outline-variant/50 shadow-sm text-primary" id="p2-0" inputmode="numeric" maxlength="1" pattern="[0-9]*" type="password"/>
          <input aria-label="PIN 2 - Chiffre 2" class="pin-input w-12 h-14 sm:w-14 sm:h-16 text-center font-mono font-black text-2xl rounded-2xl bg-surface-container/50 border border-outline-variant/50 shadow-sm text-primary" id="p2-1" inputmode="numeric" maxlength="1" pattern="[0-9]*" type="password"/>
          <input aria-label="PIN 2 - Chiffre 3" class="pin-input w-12 h-14 sm:w-14 sm:h-16 text-center font-mono font-black text-2xl rounded-2xl bg-surface-container/50 border border-outline-variant/50 shadow-sm text-primary" id="p2-2" inputmode="numeric" maxlength="1" pattern="[0-9]*" type="password"/>
          <input aria-label="PIN 2 - Chiffre 4" class="pin-input w-12 h-14 sm:w-14 sm:h-16 text-center font-mono font-black text-2xl rounded-2xl bg-surface-container/50 border border-outline-variant/50 shadow-sm text-primary" id="p2-3" inputmode="numeric" maxlength="1" pattern="[0-9]*" type="password"/>
        </div>
      </div>

      <!-- Live Match Feedback -->
      <div id="feedback-box" class="h-6 flex items-center justify-center">
        <p class="text-xs font-bold text-on-surface-variant" id="feedback-text">Saisissez les 4 chiffres de votre code secret</p>
      </div>

      <!-- Action Button -->
      <button type="submit" class="w-full bg-primary text-white py-4 px-6 rounded-full font-extrabold text-base shadow-lg hover:opacity-90 active:scale-[0.98] transition-all flex items-center justify-center gap-2 cursor-pointer mt-1">
        <span class="material-symbols-outlined text-xl">check_circle</span>
        <span>Valider mon code PIN</span>
      </button>
    </form>

  </main>

  <script>
    const p1 = [document.getElementById('p1-0'), document.getElementById('p1-1'), document.getElementById('p1-2'), document.getElementById('p1-3')];
    const p2 = [document.getElementById('p2-0'), document.getElementById('p2-1'), document.getElementById('p2-2'), document.getElementById('p2-3')];

    function setupInputRow(inputs, nextTarget) {
      inputs.forEach((inp, idx) => {
        inp.addEventListener('input', (e) => {
          e.target.value = e.target.value.replace(/[^0-9]/g, '');
          if (e.target.value.length === 1) {
            if (idx < inputs.length - 1) {
              inputs[idx + 1].focus();
            } else if (nextTarget) {
              nextTarget.focus();
            } else {
              inp.blur();
              validatePins();
            }
          }
          checkPinsLive();
        });

        inp.addEventListener('keydown', (e) => {
          if (e.key === 'Backspace' && e.target.value.length === 0 && idx > 0) {
            inputs[idx - 1].focus();
            inputs[idx - 1].value = '';
            checkPinsLive();
          }
        });
      });
    }

    setupInputRow(p1, p2[0]);
    setupInputRow(p2, null);

    let vis1 = false;
    let vis2 = false;

    function togglePinVisibility(group) {
      if (group === 1) {
        vis1 = !vis1;
        p1.forEach(inp => inp.type = vis1 ? 'text' : 'password');
        document.getElementById('eye-icon-1').textContent = vis1 ? 'visibility_off' : 'visibility';
        document.getElementById('eye-text-1').textContent = vis1 ? 'Masquer' : 'Afficher';
      } else {
        vis2 = !vis2;
        p2.forEach(inp => inp.type = vis2 ? 'text' : 'password');
        document.getElementById('eye-icon-2').textContent = vis2 ? 'visibility_off' : 'visibility';
        document.getElementById('eye-text-2').textContent = vis2 ? 'Masquer' : 'Afficher';
      }
    }

    function getPin(inputs) {
      return inputs.map(i => i.value).join('');
    }

    function checkPinsLive() {
      const code1 = getPin(p1);
      const code2 = getPin(p2);
      const fb = document.getElementById('feedback-text');

      if (code1.length === 4 && code2.length === 4) {
        if (code1 === code2) {
          fb.innerHTML = '<span class="text-green-600 font-extrabold flex items-center gap-1 justify-center"><span class="material-symbols-outlined text-sm">verified</span> Les deux codes correspondent parfaitement !</span>';
        } else {
          fb.innerHTML = '<span class="text-rose-500 font-extrabold flex items-center gap-1 justify-center"><span class="material-symbols-outlined text-sm">error</span> Les codes ne correspondent pas.</span>';
        }
      }
    }

    function validatePins() {
      const code1 = getPin(p1);
      const code2 = getPin(p2);

      if (code1.length < 4) {
        alert("Veuillez saisir votre code PIN à 4 chiffres.");
        p1[0].focus();
        return;
      }
      if (code2.length < 4) {
        alert("Veuillez confirmer votre code PIN.");
        p2[0].focus();
        return;
      }
      if (code1 !== code2) {
        alert("Les deux codes PIN ne correspondent pas. Veuillez les ressaisir.");
        p2.forEach(i => i.value = '');
        p2[0].focus();
        checkPinsLive();
        return;
      }

      // Initialisation explicite du Niveau 1 (Plafond 500 000 FCFA)
      localStorage.setItem('switch_kyc_level', '1');

      // Navigation directe vers l'écran d'accueil d'onboarding
      if (window.switchNavigate) {
        window.switchNavigate('../bienvenue_succes_onboarding/code.html');
      } else {
        window.location.href = '../bienvenue_succes_onboarding/code.html';
      }
    }
  </script>

  <script src="../assets/switch.router.js"></script>
</body>
</html>
