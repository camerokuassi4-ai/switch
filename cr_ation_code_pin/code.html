<!DOCTYPE html><html class="light" lang="fr"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Création du code PIN</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link rel="stylesheet" href="../assets/switch.css">
<script src="../assets/switch.config.js"></script>

<style>
        body {
            font-family: 'Hanken Grotesk', sans-serif;
            background-color: #F8F9FA;
        }
        .pin-dot {
            transition: all 0.3s ease;
        }
        .keypad-btn {
            transition: background-color 0.2s ease, transform 0.1s ease;
        }
        .keypad-btn:active {
            transform: scale(0.95);
            background-color: #ebe6f3; /* surface-container-high */
        }
    </style>
</head>
<body class="bg-surface-container-lowest min-h-screen flex flex-col items-center justify-between font-body-lg text-on-surface">
<!-- Top AppBar (Simulated, as per instructions for linear flows, we suppress the full shell, but keep a back button for context if needed, though this is a linear creation step. Let's keep it extremely clean.) -->
<header class="w-full px-container-margin py-stack-md flex justify-between items-center bg-transparent">
<button class="text-on-surface hover:bg-surface-container-high transition-colors p-2 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
</button>
<!-- Placeholder for symmetry if needed, or skip -->
<div class="w-10"></div>
</header>
<!-- Main Content Area -->
<main class="flex-grow flex flex-col items-center w-full max-w-md px-container-margin pt-stack-lg">
<div class="text-center mb-stack-lg w-full flex flex-col items-center gap-2">
  <span id="step-badge" class="text-xs font-bold text-primary bg-primary/10 px-3 py-1 rounded-full uppercase tracking-wider">Étape 1 sur 2</span>
  <h1 id="pin-title" class="font-display-lg-mobile text-display-lg-mobile md:font-display-lg md:text-display-lg text-on-surface font-bold transition-all">Créez votre code PIN</h1>
  <p id="pin-subtitle" class="font-body-lg text-body-lg text-on-surface-variant transition-all">Choisissez 4 chiffres secrets pour sécuriser vos paiements</p>
</div>

<!-- PIN Dots Display -->
<div id="dots-box" class="flex justify-center items-center gap-gutter mb-stack-lg h-24 transition-all">
<div class="pin-dot w-4 h-4 rounded-full border-2 border-outline-variant bg-transparent"></div>
<div class="pin-dot w-4 h-4 rounded-full border-2 border-outline-variant bg-transparent"></div>
<div class="pin-dot w-4 h-4 rounded-full border-2 border-outline-variant bg-transparent"></div>
<div class="pin-dot w-4 h-4 rounded-full border-2 border-outline-variant bg-transparent"></div>
</div>

<p id="error-msg" class="text-xs font-bold text-red-500 min-h-[20px] text-center"></p>
</main>

<!-- Custom Keypad -->
<div class="w-full max-w-md px-container-margin pb-stack-lg mt-auto">
<div class="grid grid-cols-3 gap-y-stack-sm gap-x-gutter">
<!-- Row 1 -->
<button onclick="enterPin('1')" class="keypad-btn flex justify-center items-center h-16 rounded-xl font-headline-md text-headline-md text-on-surface bg-transparent cursor-pointer">1</button>
<button onclick="enterPin('2')" class="keypad-btn flex justify-center items-center h-16 rounded-xl font-headline-md text-headline-md text-on-surface bg-transparent cursor-pointer">2</button>
<button onclick="enterPin('3')" class="keypad-btn flex justify-center items-center h-16 rounded-xl font-headline-md text-headline-md text-on-surface bg-transparent cursor-pointer">3</button>
<!-- Row 2 -->
<button onclick="enterPin('4')" class="keypad-btn flex justify-center items-center h-16 rounded-xl font-headline-md text-headline-md text-on-surface bg-transparent cursor-pointer">4</button>
<button onclick="enterPin('5')" class="keypad-btn flex justify-center items-center h-16 rounded-xl font-headline-md text-headline-md text-on-surface bg-transparent cursor-pointer">5</button>
<button onclick="enterPin('6')" class="keypad-btn flex justify-center items-center h-16 rounded-xl font-headline-md text-headline-md text-on-surface bg-transparent cursor-pointer">6</button>
<!-- Row 3 -->
<button onclick="enterPin('7')" class="keypad-btn flex justify-center items-center h-16 rounded-xl font-headline-md text-headline-md text-on-surface bg-transparent cursor-pointer">7</button>
<button onclick="enterPin('8')" class="keypad-btn flex justify-center items-center h-16 rounded-xl font-headline-md text-headline-md text-on-surface bg-transparent cursor-pointer">8</button>
<button onclick="enterPin('9')" class="keypad-btn flex justify-center items-center h-16 rounded-xl font-headline-md text-headline-md text-on-surface bg-transparent cursor-pointer">9</button>
<!-- Row 4 -->
<div class="flex justify-center items-center h-16"></div> <!-- Empty space -->
<button onclick="enterPin('0')" class="keypad-btn flex justify-center items-center h-16 rounded-xl font-headline-md text-headline-md text-on-surface bg-transparent cursor-pointer">0</button>
<button onclick="deletePin()" class="keypad-btn flex justify-center items-center h-16 rounded-xl text-on-surface-variant bg-transparent cursor-pointer">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">backspace</span>
</button>
</div>
</div>

<script>
    let firstPin = '';
    let confirmPin = '';
    let currentStep = 1; // 1: Enter, 2: Confirm
    const maxPinLength = 4;

    function updatePinDots() {
        const currentVal = (currentStep === 1) ? firstPin : confirmPin;
        const dots = document.querySelectorAll('.pin-dot');
        
        dots.forEach((dot, index) => {
            if (index < currentVal.length) {
                dot.className = 'pin-dot w-4 h-4 rounded-full bg-primary shadow-ambient';
            } else {
                dot.className = 'pin-dot w-4 h-4 rounded-full border-2 border-outline-variant bg-transparent';
            }
        });

        if (currentVal.length === maxPinLength) {
            if (currentStep === 1) {
                // Pass to step 2: Confirmation
                setTimeout(() => {
                    currentStep = 2;
                    confirmPin = '';
                    document.getElementById('step-badge').textContent = 'Étape 2 sur 2';
                    document.getElementById('pin-title').textContent = 'Confirmez votre code PIN';
                    document.getElementById('pin-subtitle').textContent = 'Ressaisissez le même code à 4 chiffres';
                    document.getElementById('error-msg').textContent = '';
                    updatePinDots();
                }, 200);
            } else if (currentStep === 2) {
                // Verify match
                if (firstPin === confirmPin) {
                    document.getElementById('error-msg').innerHTML = '<span class="text-green-600">✅ Code PIN validé avec succès !</span>';
                    dots.forEach(d => d.className = 'pin-dot w-4 h-4 rounded-full bg-green-500 shadow-ambient');
                    
                    setTimeout(() => {
                        if (window.switchNavigate) {
                            window.switchNavigate('../kyc_verification_identite/code.html');
                        } else {
                            window.location.href = '../kyc_verification_identite/code.html';
                        }
                    }, 400);
                } else {
                    // Mismatch
                    document.getElementById('error-msg').textContent = '⚠️ Les codes ne correspondent pas. Recommençons.';
                    if (navigator.vibrate) navigator.vibrate([50, 50, 50]);
                    
                    setTimeout(() => {
                        currentStep = 1;
                        firstPin = '';
                        confirmPin = '';
                        document.getElementById('step-badge').textContent = 'Étape 1 sur 2';
                        document.getElementById('pin-title').textContent = 'Créez votre code PIN';
                        document.getElementById('pin-subtitle').textContent = 'Choisissez 4 chiffres secrets pour sécuriser vos paiements';
                        updatePinDots();
                    }, 1200);
                }
            }
        }
    }

    window.enterPin = function(num) {
        if (currentStep === 1) {
            if (firstPin.length < maxPinLength) {
                firstPin += num;
                updatePinDots();
                if (navigator.vibrate) navigator.vibrate(10);
            }
        } else {
            if (confirmPin.length < maxPinLength) {
                confirmPin += num;
                updatePinDots();
                if (navigator.vibrate) navigator.vibrate(10);
            }
        }
    };

    window.deletePin = function() {
        if (currentStep === 1) {
            if (firstPin.length > 0) {
                firstPin = firstPin.slice(0, -1);
                updatePinDots();
                if (navigator.vibrate) navigator.vibrate(10);
            }
        } else {
            if (confirmPin.length > 0) {
                confirmPin = confirmPin.slice(0, -1);
                updatePinDots();
                if (navigator.vibrate) navigator.vibrate(10);
            }
        }
    };

    updatePinDots();
</script>

<script src="../assets/switch.forms.js"></script>
<script src="../assets/switch.router.js"></script>
</body></html>
