<!DOCTYPE html>
<html lang="fr" class="light">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Transfert Mobile Money - Switch Bénin</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link rel="stylesheet" href="../assets/switch.css">
  <script src="../assets/switch.config.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800;900&display=swap');
    body { font-family: 'Hanken Grotesk', sans-serif; min-height: max(884px, 100dvh); background-color: #F8F9FD; color: #1C1A24; }
    .shadow-level-1 { box-shadow: 0px 10px 20px rgba(0, 0, 0, 0.04); }
  </style>
</head>
<body class="bg-[#F8F9FD] text-on-surface antialiased min-h-screen relative pb-32 flex flex-col justify-between">
  
  <!-- Top App Bar -->
  <header class="w-full max-w-xl mx-auto px-container-margin pt-5 pb-3 flex items-center justify-between z-30 sticky top-0 bg-[#F8F9FD]/90 backdrop-blur-md">
    <button aria-label="Retour" onclick="window.history.back()" class="w-10 h-10 rounded-full flex items-center justify-center bg-white border border-outline-variant/40 shadow-sm hover:bg-surface-container transition-colors cursor-pointer text-on-surface">
      <span class="material-symbols-outlined text-xl">arrow_back</span>
    </button>
    <div class="text-center">
      <h1 class="text-base sm:text-lg font-extrabold text-on-surface">Transfert Mobile Money</h1>
      <p class="text-xs text-on-surface-variant font-medium">MTN MoMo, Moov Money & Celtiis</p>
    </div>
    <div class="w-10"></div>
  </header>

  <!-- Main Content Canvas -->
  <main class="w-full max-w-xl mx-auto px-container-margin flex flex-col gap-5 pt-1 flex-1">
    
    <!-- Balance Header Pill -->
    <div class="bg-white rounded-3xl p-4 border border-outline-variant/40 shadow-sm flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-2xl bg-primary/10 text-primary flex items-center justify-center font-bold">
          <span class="material-symbols-outlined text-xl">account_balance_wallet</span>
        </div>
        <div>
          <span class="text-[10px] uppercase font-bold text-on-surface-variant">Solde disponible</span>
          <p class="text-sm font-extrabold font-mono text-primary" id="disp-momo-balance">125 000 FCFA</p>
        </div>
      </div>
      <span class="text-xs bg-emerald-50 text-emerald-700 font-bold px-2.5 py-1 rounded-full border border-emerald-200">Instantané</span>
    </div>

    <!-- Operator Selection -->
    <section class="flex flex-col gap-2">
      <h3 class="text-xs font-black text-on-surface uppercase tracking-wider pl-1">Sélectionnez l'Opérateur</h3>
      <div class="grid grid-cols-3 gap-3">
        <!-- MTN Option -->
        <button type="button" onclick="selectOperator('MTN MoMo')" id="op-btn-mtn" class="relative flex flex-col items-center justify-center p-4 rounded-2xl bg-white border-2 border-primary shadow-sm transition-all cursor-pointer">
          <div class="w-12 h-12 rounded-full overflow-hidden mb-2 bg-amber-300 flex items-center justify-center font-black text-xs text-slate-900 shadow-xs">
            MTN
          </div>
          <span class="text-xs font-bold text-on-surface">MTN MoMo</span>
        </button>

        <!-- Moov Option -->
        <button type="button" onclick="selectOperator('Moov Money')" id="op-btn-moov" class="relative flex flex-col items-center justify-center p-4 rounded-2xl bg-white border border-outline-variant hover:border-primary shadow-sm transition-all cursor-pointer opacity-70">
          <div class="w-12 h-12 rounded-full overflow-hidden mb-2 bg-blue-600 flex items-center justify-center font-black text-xs text-white shadow-xs">
            MOOV
          </div>
          <span class="text-xs font-bold text-on-surface">Moov Money</span>
        </button>

        <!-- Celtiis Option -->
        <button type="button" onclick="selectOperator('Celtiis Cash')" id="op-btn-celtiis" class="relative flex flex-col items-center justify-center p-4 rounded-2xl bg-white border border-outline-variant hover:border-primary shadow-sm transition-all cursor-pointer opacity-70">
          <div class="w-12 h-12 rounded-full overflow-hidden mb-2 bg-emerald-600 flex items-center justify-center font-black text-xs text-white shadow-xs">
            CELTIIS
          </div>
          <span class="text-xs font-bold text-on-surface">Celtiis Cash</span>
        </button>
      </div>
    </section>

    <!-- Input Form -->
    <form onsubmit="handleTransferSubmit(event)" class="bg-white p-5 rounded-3xl shadow-sm border border-outline-variant/40 flex flex-col gap-4">
      <!-- Phone Number Input -->
      <div class="flex flex-col gap-1.5">
        <label class="text-xs font-bold text-on-surface-variant uppercase" for="phone">Numéro du Bénéficiaire</label>
        <div class="flex items-center rounded-2xl border border-outline-variant bg-surface-container-low focus-within:border-primary focus-within:bg-white transition-all overflow-hidden">
          <div class="pl-4 pr-3 py-3.5 bg-surface-container text-on-surface-variant font-bold text-sm flex items-center gap-1.5 border-r border-outline-variant">
            <span>🇧🇯</span>
            <span class="font-mono text-xs">+229</span>
          </div>
          <input class="flex-1 bg-transparent border-none py-3 px-4 text-base font-mono font-bold text-on-surface focus:ring-0 outline-none" id="phone" placeholder="97 00 00 00" type="tel" required value="97 55 44 33"/>
        </div>
      </div>

      <!-- Amount Input -->
      <div class="flex flex-col gap-1.5">
        <div class="flex justify-between items-center">
          <label class="text-xs font-bold text-on-surface-variant uppercase" for="amount">Montant du Transfert</label>
          <span class="text-[11px] text-gray-500 font-medium">Frais : <b id="disp-fee" class="text-primary font-mono">100 FCFA (1%)</b></span>
        </div>
        <div class="relative flex items-center rounded-2xl border border-outline-variant bg-surface-container-low focus-within:border-primary focus-within:bg-white transition-all">
          <input class="w-full bg-transparent border-none py-3.5 pl-4 pr-16 text-2xl font-black font-mono text-primary focus:ring-0 outline-none" id="amount" placeholder="10 000" type="number" min="500" step="500" value="10000" oninput="updateFee()"/>
          <span class="absolute right-4 font-bold text-xs text-on-surface-variant pointer-events-none">FCFA</span>
        </div>
      </div>

      <!-- Note / Motif -->
      <div class="flex flex-col gap-1.5">
        <label class="text-xs font-bold text-on-surface-variant uppercase" for="motif">Motif (Optionnel)</label>
        <input class="w-full bg-surface-container-low border border-outline-variant rounded-2xl py-3 px-4 text-xs font-semibold text-on-surface focus:ring-0 focus:border-primary outline-none" id="motif" placeholder="Ex: Remboursement déjeuner, Dépannage..." type="text"/>
      </div>

      <!-- Action Button -->
      <button type="submit" class="w-full bg-primary text-white py-4 rounded-full font-bold text-base shadow-lg hover:opacity-90 active:scale-[0.98] transition-all flex items-center justify-center gap-2 mt-2 cursor-pointer">
        <span>Envoyer vers <span id="btn-op-label">MTN MoMo</span></span>
        <span class="material-symbols-outlined text-xl">send</span>
      </button>
    </form>
  </main>

  <script>
    let selectedOp = 'MTN MoMo';

    document.addEventListener('DOMContentLoaded', () => {
      if (window.SwitchEngine) {
        const bal = window.SwitchEngine.getMainBalance();
        const balEl = document.getElementById('disp-momo-balance');
        if (balEl) balEl.textContent = bal.toLocaleString('fr-FR') + ' FCFA';
      }
      updateFee();
    });

    function selectOperator(op) {
      selectedOp = op;
      ['MTN MoMo', 'Moov Money', 'Celtiis Cash'].forEach(name => {
        let id = 'op-btn-mtn';
        if (name === 'Moov Money') id = 'op-btn-moov';
        if (name === 'Celtiis Cash') id = 'op-btn-celtiis';
        const el = document.getElementById(id);
        if (name === op) {
          if (el) el.className = 'relative flex flex-col items-center justify-center p-4 rounded-2xl bg-white border-2 border-primary shadow-sm transition-all cursor-pointer opacity-100';
        } else {
          if (el) el.className = 'relative flex flex-col items-center justify-center p-4 rounded-2xl bg-white border border-outline-variant hover:border-primary shadow-sm transition-all cursor-pointer opacity-60';
        }
      });
      document.getElementById('btn-op-label').textContent = op;
    }

    function updateFee() {
      const amt = parseInt(document.getElementById('amount').value || '0');
      const fee = Math.max(50, Math.round(amt * 0.01));
      const feeEl = document.getElementById('disp-fee');
      if (feeEl) feeEl.textContent = fee.toLocaleString('fr-FR') + ' FCFA (1%)';
    }

    function handleTransferSubmit(e) {
      e.preventDefault();
      const phone = document.getElementById('phone').value.trim();
      const amt = parseInt(document.getElementById('amount').value || '0');
      const motif = document.getElementById('motif').value.trim() || `Transfert Mobile Money ${selectedOp}`;
      const fee = Math.max(50, Math.round(amt * 0.01));
      const total = amt + fee;

      if (!phone) {
        alert("Veuillez saisir un numéro de téléphone valide.");
        return;
      }
      if (amt < 500) {
        alert("Le montant minimum de transfert est de 500 FCFA.");
        return;
      }

      if (window.SwitchEngine) {
        const mainBal = window.SwitchEngine.getMainBalance();
        if (mainBal < total) {
          alert("Solde insuffisant dans votre Compte Switch (" + mainBal.toLocaleString('fr-FR') + " FCFA disponible, " + total.toLocaleString('fr-FR') + " FCFA requis avec frais).");
          return;
        }

        const tx = window.SwitchEngine.addTransaction({
          title: `Transfert ${selectedOp} (${phone})`,
          category: "transfer",
          amount: -total,
          fee: fee,
          recipient: `${phone} (${selectedOp})`,
          note: motif,
          icon: "send_to_mobile",
          iconBg: "bg-blue-50 text-blue-700"
        });

        localStorage.setItem('switch_last_tx_id', tx.id);
        localStorage.setItem('switch_last_tx_amount', amt.toString());
        localStorage.setItem('switch_last_tx_recipient', `${phone} (${selectedOp})`);
      }

      alert(`✅ Transfert de ${amt.toLocaleString('fr-FR')} FCFA envoyé avec succès vers ${selectedOp} (+229 ${phone}) !`);
      if (window.switchNavigate) {
        window.switchNavigate('../confirmation_de_succ_s/code.html');
      } else {
        window.location.href = '../confirmation_de_succ_s/code.html';
      }
    }
  </script>

  <script src="../assets/switch.router.js"></script>
</body>
</html>
