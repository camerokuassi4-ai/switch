<!DOCTYPE html>
<html lang="fr" class="light">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Déposer des fonds - Switch Bénin</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link rel="stylesheet" href="../assets/switch.css">
  <script src="../assets/switch.config.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800;900&display=swap');
    body {
      font-family: 'Hanken Grotesk', sans-serif;
      min-height: max(884px, 100dvh);
      background-color: #F8F9FD;
      color: #1C1A24;
      -webkit-font-smoothing: antialiased;
    }
  </style>
</head>
<body class="min-h-screen pb-32 flex flex-col antialiased selection:bg-primary-fixed">

  <!-- Top Navigation Header -->
  <header class="flex justify-between items-center px-container-margin py-stack-md w-full max-w-lg mx-auto sticky top-0 z-10 bg-[#F8F9FD]/90 backdrop-blur-md">
    <div class="flex items-center gap-3">
      <button aria-label="Retour" onclick="window.history.back()" class="w-10 h-10 flex items-center justify-center rounded-full bg-white border border-outline-variant/40 shadow-sm hover:bg-surface-container transition-colors cursor-pointer text-on-surface">
        <span class="material-symbols-outlined text-xl">arrow_back</span>
      </button>
      <div>
        <h1 class="text-lg sm:text-xl font-extrabold text-on-surface">Déposer des fonds</h1>
        <p class="text-xs text-on-surface-variant">Recharger votre solde principal Switch</p>
      </div>
    </div>
    <span class="text-xs font-black uppercase text-emerald-800 bg-emerald-100 px-3 py-1 rounded-full">0% en Agence</span>
  </header>

  <!-- Main Content -->
  <main class="px-container-margin pt-stack-sm flex flex-col gap-5 max-w-lg mx-auto w-full">
    
    <!-- Source Selection Section -->
    <section class="flex flex-col gap-3">
      <h2 class="text-xs font-black text-on-surface uppercase tracking-wider px-1">Méthode de rechargement</h2>
      
      <div class="grid grid-cols-2 gap-3">
        <!-- 1. Agence / Kiosque Switch (0% GRATUIT) -->
        <button type="button" onclick="selectDepositSource('agent')" id="btn-dep-agent" class="relative bg-white rounded-3xl p-4.5 flex flex-col items-center justify-center gap-2 border-2 border-primary transition-all shadow-sm focus:outline-none cursor-pointer">
          <div class="absolute top-2.5 right-2.5 w-5 h-5 bg-primary rounded-full flex items-center justify-center text-white" id="check-agent">
            <span class="material-symbols-outlined text-[13px] font-bold">check</span>
          </div>
          <div class="w-12 h-12 rounded-2xl bg-emerald-50 text-emerald-700 flex items-center justify-center font-bold">
            <span class="material-symbols-outlined text-2xl">storefront</span>
          </div>
          <span class="text-xs font-bold text-primary">Agence Switch</span>
          <span class="text-[10px] text-emerald-700 font-extrabold bg-emerald-100 px-2 py-0.5 rounded-full">0% Frais (Gratuit)</span>
        </button>

        <!-- 2. MTN MoMo -->
        <button type="button" onclick="selectDepositSource('mtn')" id="btn-dep-mtn" class="relative bg-white rounded-3xl p-4.5 flex flex-col items-center justify-center gap-2 border border-outline-variant/40 hover:border-primary transition-all shadow-sm focus:outline-none cursor-pointer opacity-75">
          <div class="w-12 h-12 rounded-2xl bg-[#FFCC00] flex items-center justify-center font-black text-black text-sm">
            MTN
          </div>
          <span class="text-xs font-bold text-on-surface">MTN MoMo</span>
          <span class="text-[10px] text-on-surface-variant font-medium">Instantané</span>
        </button>

        <!-- 3. Moov Money -->
        <button type="button" onclick="selectDepositSource('moov')" id="btn-dep-moov" class="relative bg-white rounded-3xl p-4.5 flex flex-col items-center justify-center gap-2 border border-outline-variant/40 hover:border-primary transition-all shadow-sm focus:outline-none cursor-pointer opacity-75">
          <div class="w-12 h-12 rounded-2xl bg-[#005A9C] flex items-center justify-center font-black text-white text-sm">
            Moov
          </div>
          <span class="text-xs font-bold text-on-surface">Moov Money</span>
          <span class="text-[10px] text-on-surface-variant font-medium">Instantané</span>
        </button>

        <!-- 4. Celtiis / Carte Bancaire -->
        <button type="button" onclick="selectDepositSource('celtiis')" id="btn-dep-celtiis" class="relative bg-white rounded-3xl p-4.5 flex flex-col items-center justify-center gap-2 border border-outline-variant/40 hover:border-primary transition-all shadow-sm focus:outline-none cursor-pointer opacity-75">
          <div class="w-12 h-12 rounded-2xl bg-black text-white flex items-center justify-center font-black text-xs">
            Celtiis
          </div>
          <span class="text-xs font-bold text-on-surface">Celtiis / Carte</span>
          <span class="text-[10px] text-on-surface-variant font-medium">Instantané</span>
        </button>
      </div>

      <!-- Nearest Agent Locator Box -->
      <div id="dep-agent-box" class="mt-1 p-4 rounded-3xl bg-emerald-50 border border-emerald-200 flex items-center justify-between">
        <div class="flex items-center gap-3">
          <span class="material-symbols-outlined text-emerald-700 text-2xl">location_on</span>
          <div>
            <h4 class="font-bold text-xs text-emerald-900">Kiosque le plus proche : Haie Vive (250m)</h4>
            <p class="text-[11px] text-emerald-700">Dépôt en espèces sans file d'attente • Ouvert 7j/7</p>
          </div>
        </div>
        <button type="button" onclick="window.switchNavigate ? window.switchNavigate('../carte_agents_guichets/code.html') : window.location.href='../carte_agents_guichets/code.html'" class="text-xs text-emerald-800 font-extrabold underline cursor-pointer">
          Carte GPS
        </button>
      </div>

      <!-- Phone Number Field (Appears when mobile money is selected) -->
      <div id="dep-phone-box" class="mt-2 flex flex-col gap-1 hidden">
        <label class="text-xs font-bold text-on-surface-variant" for="dep-phone">Numéro Mobile Money (+229)</label>
        <div class="relative flex items-center">
          <span class="absolute left-4 font-mono font-bold text-sm text-on-surface-variant">+229</span>
          <input type="tel" id="dep-phone" value="97 12 34 56" class="w-full bg-white border border-outline-variant rounded-2xl py-3 pl-16 pr-4 font-mono font-bold text-sm text-on-surface focus:outline-none focus:border-primary"/>
        </div>
      </div>
    </section>

    <!-- Amount Input Section -->
    <section class="flex flex-col gap-3">
      <h2 class="text-xs font-black text-on-surface uppercase tracking-wider px-1">Montant à déposer</h2>
      <div class="bg-white rounded-3xl border border-outline-variant/40 p-6 flex flex-col items-center justify-center shadow-sm">
        <div class="flex items-baseline justify-center gap-2">
          <input type="text" id="dep-amount" value="50 000" class="bg-transparent border-none text-center font-black text-3xl sm:text-4xl text-on-surface w-36 focus:ring-0 p-0 outline-none"/>
          <span class="font-bold text-lg text-on-surface-variant">FCFA</span>
        </div>
        <p class="text-xs text-emerald-700 font-bold mt-2" id="dep-fee-text">Frais de dépôt en Agence Switch : 0 FCFA (GRATUIT)</p>
      </div>

      <!-- Quick Chips -->
      <div class="flex gap-2 overflow-x-auto pb-1 scrollbar-hide">
        <button type="button" onclick="setDepAmount('10 000')" class="px-4 py-2 rounded-full bg-white border border-outline-variant/40 text-xs font-bold text-on-surface hover:bg-primary/5 cursor-pointer">10 000</button>
        <button type="button" onclick="setDepAmount('25 000')" class="px-4 py-2 rounded-full bg-white border border-outline-variant/40 text-xs font-bold text-on-surface hover:bg-primary/5 cursor-pointer">25 000</button>
        <button type="button" onclick="setDepAmount('50 000')" class="px-4 py-2 rounded-full bg-primary text-white text-xs font-bold shadow-sm cursor-pointer">50 000</button>
        <button type="button" onclick="setDepAmount('100 000')" class="px-4 py-2 rounded-full bg-white border border-outline-variant/40 text-xs font-bold text-on-surface hover:bg-primary/5 cursor-pointer">100 000</button>
      </div>
    </section>

    <!-- Action Button -->
    <div class="pt-4">
      <button type="button" onclick="submitDepositFlow()" class="w-full bg-primary text-white py-4 rounded-3xl font-bold text-base shadow-lg hover:opacity-90 active:scale-[0.98] transition-all flex items-center justify-center gap-2 cursor-pointer">
        <span id="dep-submit-label">Générer le code de dépôt gratuit en agence</span>
        <span class="material-symbols-outlined text-xl">arrow_forward</span>
      </button>
    </div>
  </main>

  <script>
    let selectedDepositSource = 'agent';

    function selectDepositSource(src) {
      selectedDepositSource = src;
      const sources = ['agent', 'mtn', 'moov', 'celtiis'];
      sources.forEach(s => {
        const btn = document.getElementById('btn-dep-' + s);
        if (btn) btn.className = 'relative bg-white rounded-3xl p-4.5 flex flex-col items-center justify-center gap-2 border border-outline-variant/40 hover:border-primary transition-all shadow-sm focus:outline-none cursor-pointer opacity-75';
      });

      const activeBtn = document.getElementById('btn-dep-' + src);
      if (activeBtn) activeBtn.className = 'relative bg-white rounded-3xl p-4.5 flex flex-col items-center justify-center gap-2 border-2 border-primary transition-all shadow-sm focus:outline-none cursor-pointer';

      const agentBox = document.getElementById('dep-agent-box');
      const phoneBox = document.getElementById('dep-phone-box');
      const feeText = document.getElementById('dep-fee-text');
      const submitLabel = document.getElementById('dep-submit-label');

      if (src === 'agent') {
        if (agentBox) agentBox.classList.remove('hidden');
        if (phoneBox) phoneBox.classList.add('hidden');
        if (feeText) feeText.textContent = 'Frais de dépôt en Agence Switch : 0 FCFA (GRATUIT)';
        if (submitLabel) submitLabel.textContent = 'Générer le code de dépôt gratuit en agence';
      } else {
        if (agentBox) agentBox.classList.add('hidden');
        if (phoneBox) phoneBox.classList.remove('hidden');
        if (feeText) feeText.textContent = 'Frais Mobile Money : Sans frais de réseau';
        if (submitLabel) submitLabel.textContent = 'Confirmer la recharge Mobile Money';
      }
    }

    function setDepAmount(amt) {
      document.getElementById('dep-amount').value = amt;
    }

    function submitDepositFlow() {
      const rawAmt = document.getElementById('dep-amount').value || '50 000';
      const amt = parseInt(rawAmt.replace(/\s+/g, '')) || 50000;
      const phone = document.getElementById('dep-phone') ? document.getElementById('dep-phone').value : '97 12 34 56';
      
      localStorage.setItem('switch_pending_deposit_amount', amt.toString());
      localStorage.setItem('switch_pending_deposit_source', selectedDepositSource);

      if (selectedDepositSource === 'agent') {
        if (window.switchNavigate) {
          window.switchNavigate('../code_depot_especes_agent/code.html');
        } else {
          window.location.href = '../code_depot_especes_agent/code.html';
        }
      } else {
        const opName = selectedDepositSource === 'mtn' ? 'MTN MoMo' : (selectedDepositSource === 'moov' ? 'Moov Money' : 'Celtiis Cash');
        if (window.SwitchEngine) {
          window.SwitchEngine.addTransaction({
            title: "Dépôt " + opName,
            category: "deposit",
            amount: amt,
            fee: 0,
            recipient: "Mon Compte Principal (+229 " + phone + ")",
            note: "Recharge instantanée via " + opName,
            icon: "add_circle",
            iconBg: "bg-emerald-50 text-emerald-700"
          });
        }
        if (window.switchNavigate) {
          window.switchNavigate('../confirmation_de_succ_s/code.html');
        } else {
          window.location.href = '../confirmation_de_succ_s/code.html';
        }
      }
    }
  </script>

  <script src="../assets/switch.router.js"></script>
</body>
</html>
