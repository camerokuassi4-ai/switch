<!DOCTYPE html>
<html class="light" lang="fr">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Scanner & Payer QR - Switch Bénin</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link rel="stylesheet" href="../assets/switch.css">
  <script src="../assets/switch.config.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800;900&display=swap');
    body {
      font-family: 'Hanken Grotesk', sans-serif;
      min-height: max(884px, 100dvh);
      background-color: #0F0E17;
      color: #FFFFFF;
    }

    .corner {
      width: 28px;
      height: 28px;
      border-color: #7B5CFA;
      border-style: solid;
      position: absolute;
    }
    .corner-tl { top: -2px; left: -2px; border-width: 4px 0 0 4px; border-top-left-radius: 16px; }
    .corner-tr { top: -2px; right: -2px; border-width: 4px 4px 0 0; border-top-right-radius: 16px; }
    .corner-bl { bottom: -2px; left: -2px; border-width: 0 0 4px 4px; border-bottom-left-radius: 16px; }
    .corner-br { bottom: -2px; right: -2px; border-width: 0 4px 4px 0; border-bottom-right-radius: 16px; }
    
    .scan-laser {
      width: 100%;
      height: 3px;
      background: linear-gradient(90deg, rgba(123, 92, 250, 0) 0%, #7B5CFA 50%, rgba(123, 92, 250, 0) 100%);
      position: absolute;
      top: 0;
      box-shadow: 0 0 16px 3px rgba(123, 92, 250, 0.8);
      animation: scanLaser 2.2s infinite ease-in-out;
    }
    
    @keyframes scanLaser {
      0% { top: 4%; opacity: 0; }
      15% { opacity: 1; }
      85% { opacity: 1; }
      100% { top: 94%; opacity: 0; }
    }

    .glass-dark {
      background: rgba(28, 26, 36, 0.75);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.12);
    }
  </style>
</head>
<body class="h-screen w-screen overflow-hidden relative flex flex-col justify-between antialiased selection:bg-primary selection:text-white">

  <!-- Camera Viewport Simulation Background -->
  <div id="camera-bg" class="absolute inset-0 z-0 transition-opacity duration-300">
    <img alt="Camera Viewport" class="w-full h-full object-cover brightness-75 contrast-105" src="../assets/images/img_043.jpg"/>
    <!-- Dark Vignette Overlay -->
    <div class="absolute inset-0 bg-gradient-to-t from-black/90 via-black/40 to-black/80"></div>
  </div>

  <!-- Top Action Header -->
  <header class="relative z-30 w-full max-w-xl mx-auto px-container-margin pt-6 flex items-center justify-between">
    <button aria-label="Fermer" onclick="window.history.back()" class="w-11 h-11 rounded-full glass-dark flex items-center justify-center text-white hover:bg-white/20 transition-all cursor-pointer">
      <span class="material-symbols-outlined text-xl">close</span>
    </button>

    <!-- 2-Mode Segmented Control (Scanner vs Mon QR) -->
    <div class="flex items-center bg-black/60 backdrop-blur-md p-1 rounded-full border border-white/15">
      <button type="button" onclick="setMode('scan')" id="tab-scan" class="px-4 py-1.5 rounded-full text-xs font-extrabold bg-primary text-white shadow-md transition-all cursor-pointer">
        Scanner QR
      </button>
      <button type="button" onclick="setMode('myqr')" id="tab-myqr" class="px-4 py-1.5 rounded-full text-xs font-extrabold text-white/70 hover:text-white transition-all cursor-pointer">
        Mon QR Code
      </button>
    </div>

    <!-- Torch Toggle -->
    <button id="torch-btn" onclick="toggleTorch()" class="w-11 h-11 rounded-full glass-dark flex items-center justify-center text-white hover:bg-white/20 transition-all cursor-pointer" title="Lampe torche">
      <span class="material-symbols-outlined text-xl" id="torch-icon">flashlight_on</span>
    </button>
  </header>

  <!-- MODE 1 : SCANNER CAMERA VIEW -->
  <main id="view-scan" class="relative z-20 flex-1 flex flex-col items-center justify-center px-container-margin gap-5">
    <!-- Instructions -->
    <div class="text-center max-w-xs">
      <h1 class="text-xl sm:text-2xl font-black text-white drop-shadow-md">Scannez pour payer</h1>
      <p class="text-xs text-white/70 mt-1">Placez le QR Code Switch ou Marchand au centre</p>
    </div>

    <!-- Scanner Reticle Frame -->
    <div onclick="simulateScanSuccess()" class="relative w-64 h-64 sm:w-72 sm:h-72 rounded-3xl bg-white/5 border border-white/20 backdrop-blur-[2px] overflow-hidden cursor-pointer group shadow-2xl">
      <!-- 4 Glowing Corners -->
      <div class="corner corner-tl"></div>
      <div class="corner corner-tr"></div>
      <div class="corner corner-bl"></div>
      <div class="corner corner-br"></div>

      <!-- Animated Laser Line -->
      <div class="scan-laser"></div>

      <!-- Center Aim Cross -->
      <div class="absolute inset-0 flex items-center justify-center opacity-30 pointer-events-none">
        <span class="material-symbols-outlined text-4xl text-primary">add</span>
      </div>

      <div class="absolute inset-0 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity bg-black/60 text-white font-bold text-xs">
        Appuyez pour tester le scan
      </div>
    </div>

    <!-- Bottom Secondary Actions : Galerie & Saisie ID -->
    <div class="flex items-center gap-3">
      <!-- Import Image Button -->
      <button onclick="simulateGalleryImport()" class="glass-dark px-4 py-2.5 rounded-full text-xs font-bold text-white flex items-center gap-2 hover:bg-white/20 transition-all cursor-pointer">
        <span class="material-symbols-outlined text-base">image</span>
        <span>Importer image</span>
      </button>

      <!-- Enter ID Manually Button -->
      <button onclick="promptManualId()" class="glass-dark px-4 py-2.5 rounded-full text-xs font-bold text-white flex items-center gap-2 hover:bg-white/20 transition-all cursor-pointer">
        <span class="material-symbols-outlined text-base">dialpad</span>
        <span>Saisie manuelle ID</span>
      </button>
    </div>
  </main>

  <!-- MODE 2 : MON QR CODE PERSONNEL (RECEVOIR) -->
  <main id="view-myqr" class="relative z-20 flex-1 flex flex-col items-center justify-center px-container-margin gap-5 hidden">
    <!-- QR Card Container -->
    <div class="w-full max-w-xs bg-white text-gray-900 rounded-[32px] p-6 shadow-2xl flex flex-col items-center text-center gap-4">
      
      <!-- User Info Header -->
      <div class="flex items-center gap-3">
        <div class="w-12 h-12 rounded-full overflow-hidden border-2 border-primary/30 shrink-0">
          <img alt="Adele Doe" class="w-full h-full object-cover" src="../assets/images/img_046.jpg"/>
        </div>
        <div class="text-left">
          <h3 class="font-extrabold text-base text-gray-900 leading-tight">Adele Doe</h3>
          <p class="text-xs text-primary font-mono font-bold">+229 97 12 34 56</p>
        </div>
      </div>

      <!-- Large QR Code Visual -->
      <div class="w-48 h-48 bg-gray-100 p-3 rounded-2xl border border-gray-200 flex items-center justify-center shadow-inner relative">
        <span class="material-symbols-outlined text-9xl text-black">qr_code_2</span>
        <div class="absolute w-8 h-8 rounded-full bg-primary text-white flex items-center justify-center font-black text-xs shadow-md border-2 border-white">
          S
        </div>
      </div>

      <div class="space-y-1">
        <span class="text-xs font-bold text-gray-500 uppercase tracking-wider">Scannez pour me transférer</span>
        <p class="text-[11px] text-gray-400">Paiement instantané et sans frais sur Switch</p>
      </div>

      <!-- Share WhatsApp & Download Buttons -->
      <div class="grid grid-cols-2 gap-2 w-full pt-1">
        <button onclick="shareMyQrWhatsApp()" class="py-2.5 px-3 rounded-xl bg-[#25D366] text-white text-xs font-bold flex items-center justify-center gap-1.5 shadow-sm hover:opacity-90 cursor-pointer">
          <span class="material-symbols-outlined text-sm">share</span>
          <span>WhatsApp</span>
        </button>
        <button onclick="downloadMyQr()" class="py-2.5 px-3 rounded-xl bg-gray-100 text-gray-800 text-xs font-bold flex items-center justify-center gap-1.5 hover:bg-gray-200 cursor-pointer">
          <span class="material-symbols-outlined text-sm text-primary">download</span>
          <span>Enregistrer</span>
        </button>
      </div>
    </div>
  </main>

  <!-- Bottom Bar Helper info -->
  <footer class="relative z-30 w-full max-w-xl mx-auto px-container-margin pb-6 text-center">
    <button onclick="simulateScanSuccess()" class="w-full max-w-xs mx-auto py-3.5 rounded-full bg-primary text-white font-bold text-sm shadow-xl hover:opacity-90 active:scale-95 transition-all flex items-center justify-center gap-2 cursor-pointer">
      <span class="material-symbols-outlined text-xl">qr_code_scanner</span>
      <span>Simuler détection du QR</span>
    </button>
  </footer>

  <script>
    let torchOn = false;
    let currentMode = 'scan';

    function setMode(mode) {
      currentMode = mode;
      const tabScan = document.getElementById('tab-scan');
      const tabMyQr = document.getElementById('tab-myqr');
      const viewScan = document.getElementById('view-scan');
      const viewMyQr = document.getElementById('view-myqr');
      const cameraBg = document.getElementById('camera-bg');

      if (mode === 'scan') {
        tabScan.className = 'px-4 py-1.5 rounded-full text-xs font-extrabold bg-primary text-white shadow-md transition-all cursor-pointer';
        tabMyQr.className = 'px-4 py-1.5 rounded-full text-xs font-extrabold text-white/70 hover:text-white transition-all cursor-pointer';
        viewScan.classList.remove('hidden');
        viewMyQr.classList.add('hidden');
        cameraBg.style.opacity = '1';
      } else {
        tabScan.className = 'px-4 py-1.5 rounded-full text-xs font-extrabold text-white/70 hover:text-white transition-all cursor-pointer';
        tabMyQr.className = 'px-4 py-1.5 rounded-full text-xs font-extrabold bg-primary text-white shadow-md transition-all cursor-pointer';
        viewScan.classList.add('hidden');
        viewMyQr.classList.remove('hidden');
        cameraBg.style.opacity = '0.3';
      }
    }

    function toggleTorch() {
      torchOn = !torchOn;
      const btn = document.getElementById('torch-btn');
      const icon = document.getElementById('torch-icon');
      if (torchOn) {
        btn.className = 'w-11 h-11 rounded-full bg-amber-400 text-black flex items-center justify-center transition-all cursor-pointer shadow-lg';
        icon.textContent = 'flashlight_off';
      } else {
        btn.className = 'w-11 h-11 rounded-full glass-dark flex items-center justify-center text-white hover:bg-white/20 transition-all cursor-pointer';
        icon.textContent = 'flashlight_on';
      }
    }

    function simulateGalleryImport() {
      alert("Image sélectionnée depuis votre galerie ! Détection du QR Code Switch...");
      simulateScanSuccess();
    }

    function promptManualId() {
      const code = prompt("Saisissez l'Identifiant Marchand ou Numéro Switch :", "SW-MCH-8820");
      if (code) {
        simulateScanSuccess();
      }
    }

    function shareMyQrWhatsApp() {
      const msg = encodeURIComponent("📲 Scannez mon QR Code Switch (+229 97 12 34 56) pour m'envoyer de l'argent instantanément et sans frais !");
      window.open("https://wa.me/?text=" + msg, "_blank");
    }

    function downloadMyQr() {
      alert("Votre QR Code Switch personnel a été enregistré dans votre galerie photo !");
    }

    function simulateScanSuccess() {
      if (navigator.vibrate) navigator.vibrate(100);
      if (window.switchNavigate) {
        window.switchNavigate('../confirmation_paiement_qr/code.html');
      } else {
        window.location.href = '../confirmation_paiement_qr/code.html';
      }
    }
  </script>

  <script src="../assets/switch.router.js"></script>
</body>
</html>
