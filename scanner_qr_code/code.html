<!DOCTYPE html>

<html class="light" lang="fr"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Scanner QR</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link rel="stylesheet" href="../assets/switch.css">
<script src="../assets/switch.config.js"></script>

<style>
        .scanner-overlay {
            background: rgba(28, 26, 36, 0.7);
        }
        .scanner-frame {
            box-shadow: 0 0 0 4000px rgba(28, 26, 36, 0.7);
        }
        .corner {
            width: 32px;
            height: 32px;
            border-color: #5e3bdc;
            border-style: solid;
            position: absolute;
        }
        .corner-tl { top: 0; left: 0; border-width: 4px 0 0 4px; border-top-left-radius: 16px; }
        .corner-tr { top: 0; right: 0; border-width: 4px 4px 0 0; border-top-right-radius: 16px; }
        .corner-bl { bottom: 0; left: 0; border-width: 0 0 4px 4px; border-bottom-left-radius: 16px; }
        .corner-br { bottom: 0; right: 0; border-width: 0 4px 4px 0; border-bottom-right-radius: 16px; }
        
        .scan-line {
            width: 100%;
            height: 2px;
            background: #7758f6;
            position: absolute;
            top: 0;
            box-shadow: 0 0 15px 2px rgba(119, 88, 246, 0.5);
            animation: scan 2.5s infinite linear;
        }
        
        @keyframes scan {
            0% { top: 0; opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { top: 100%; opacity: 0; }
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-surface antialiased h-screen w-screen overflow-hidden relative font-body-sm selection:bg-primary-container selection:text-on-primary-container">
<!-- Camera Viewport Simulation -->
<div class="absolute inset-0 z-0">
<img alt="A POV shot through a smartphone camera lens looking at a slightly blurred modern cafe counter with a prominent QR code stand on the wooden surface. The lighting is bright and natural, indicating daytime. The aesthetic is clean and modern." class="w-full h-full object-cover grayscale-[20%]" src="../assets/images/img_043.jpg"/>
</div>
<!-- Top Action Bar -->
<header class="absolute top-0 left-0 w-full z-20 flex justify-between items-center px-container-margin py-stack-lg pt-12">
<button class="w-12 h-12 rounded-full bg-surface/20 backdrop-blur-md flex items-center justify-center text-white active:scale-95 transition-transform border border-white/10">
<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
<div class="flex gap-gutter">
<button class="w-12 h-12 rounded-full bg-surface/20 backdrop-blur-md flex items-center justify-center text-white active:scale-95 transition-transform border border-white/10 hover:bg-surface/30">
<span class="material-symbols-outlined" data-icon="flashlight_on">flashlight_on</span>
</button>
<button class="w-12 h-12 rounded-full bg-surface/20 backdrop-blur-md flex items-center justify-center text-white active:scale-95 transition-transform border border-white/10 hover:bg-surface/30">
<span class="material-symbols-outlined" data-icon="image">image</span>
</button>
</div>
</header>
<!-- Main Scanner Area -->
<main class="absolute inset-0 z-10 flex flex-col items-center justify-center pt-20">
<!-- Text Instruction -->
<div class="mb-stack-lg text-center px-container-margin">
<h1 class="font-headline-md text-headline-md text-white drop-shadow-md">
                Scannez un code QR Switch pour payer
            </h1>
</div>
<!-- Scanner Frame -->
<div class="relative w-64 h-64 md:w-80 md:h-80 scanner-frame rounded-2xl bg-transparent overflow-hidden">
<!-- Corners -->
<div class="corner corner-tl"></div>
<div class="corner corner-tr"></div>
<div class="corner corner-bl"></div>
<div class="corner corner-br"></div>
<!-- Animated Scan Line -->
<div class="scan-line"></div>
</div>
<!-- Fallback Action -->
<div class="mt-stack-lg">
<button class="px-6 py-3 rounded-full bg-surface/20 backdrop-blur-md text-white font-label-caps text-label-caps border border-white/10 active:scale-95 transition-transform hover:bg-surface/30">
                SAISIR LE CODE
            </button>
</div>
</main>
<!-- Bottom Navigation Bar (Shared Component Injection - Modified for QR focus) -->

<script>
        // Simple JS for visual interaction
        document.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('touchstart', () => {
                if(btn.querySelector('.material-symbols-outlined')) {
                    btn.querySelector('.material-symbols-outlined').style.fontVariationSettings = "'FILL' 1";
                }
            });
            btn.addEventListener('touchend', () => {
                 if(btn.querySelector('.material-symbols-outlined')) {
                    btn.querySelector('.material-symbols-outlined').style.fontVariationSettings = "'FILL' 0";
                }
            });
        });
    </script>
<script src="../assets/switch.router.js"></script>
</body></html>
