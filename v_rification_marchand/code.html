<!DOCTYPE html>

<html class="light" lang="fr"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Vérification Marchand</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link rel="stylesheet" href="../assets/switch.css">
<script src="../assets/switch.config.js"></script>

<style>
        body { font-family: 'Hanken Grotesk', sans-serif; }
        
        .otp-input:focus {
            box-shadow: 0 0 0 4px rgba(119, 88, 246, 0.15);
        }
        
        .mesh-bg {
            background-image: 
                radial-gradient(at 0% 0%, hsla(253,100%,94%,1) 0, transparent 50%), 
                radial-gradient(at 50% 0%, hsla(225,100%,98%,1) 0, transparent 50%), 
                radial-gradient(at 100% 0%, hsla(277,100%,94%,1) 0, transparent 50%);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-surface min-h-screen flex flex-col mesh-bg relative overflow-hidden">
<header class="flex items-center px-container-margin py-4 w-full relative z-10">
<button class="w-10 h-10 flex items-center justify-center rounded-full bg-surface-container-low hover:bg-surface-container transition-colors text-on-surface">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
</header>
<main class="flex-1 flex flex-col px-container-margin pt-stack-lg pb-card-padding relative z-10 w-full max-w-md mx-auto">
<div class="flex flex-col items-center text-center mb-stack-lg">
<div class="w-20 h-20 bg-surface-container rounded-full flex items-center justify-center mb-stack-md shadow-sm">
<span class="material-symbols-outlined text-primary text-[40px]" data-icon="lock_open">lock_open</span>
</div>
<h1 class="font-display-lg-mobile text-display-lg-mobile text-on-surface mb-stack-sm">Vérification</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">
                Entrez le code à 4 chiffres envoyé au<br/>
<span class="font-headline-md text-headline-md text-on-surface mt-1 block">+229 97 ** ** 45</span>
</p>
</div>
<div class="flex justify-between gap-stack-sm mb-stack-lg w-full max-w-[280px] mx-auto">
<input class="otp-input w-16 h-16 bg-surface-container-lowest border border-outline-variant rounded-xl text-center font-display-lg-mobile text-display-lg-mobile text-on-surface focus:outline-none focus:border-primary transition-all shadow-[0_4px_10px_rgba(0,0,0,0.02)]" inputmode="numeric" maxlength="1" type="text" value="4"/>
<input class="otp-input w-16 h-16 bg-surface-container-lowest border border-outline-variant rounded-xl text-center font-display-lg-mobile text-display-lg-mobile text-on-surface focus:outline-none focus:border-primary transition-all shadow-[0_4px_10px_rgba(0,0,0,0.02)]" inputmode="numeric" maxlength="1" type="text" value="8"/>
<input class="otp-input w-16 h-16 bg-surface-container-lowest border border-outline-variant rounded-xl text-center font-display-lg-mobile text-display-lg-mobile text-on-surface focus:outline-none focus:border-primary transition-all shadow-[0_4px_10px_rgba(0,0,0,0.02)]" inputmode="numeric" maxlength="1" placeholder="•" type="text"/>
<input class="otp-input w-16 h-16 bg-surface-container-lowest border border-outline-variant rounded-xl text-center font-display-lg-mobile text-display-lg-mobile text-on-surface focus:outline-none focus:border-primary transition-all shadow-[0_4px_10px_rgba(0,0,0,0.02)]" inputmode="numeric" maxlength="1" placeholder="•" type="text"/>
</div>
<div class="text-center mb-auto">
<p class="font-body-lg text-body-lg text-on-surface-variant">
                Vous n'avez pas reçu le code ?
            </p>
<button class="font-headline-md text-headline-md text-primary mt-2 hover:opacity-80 transition-opacity">
                Renvoyer le code (0:59)
            </button>
</div>
<div class="mt-stack-lg w-full">
<button class="w-full bg-primary text-on-primary font-headline-md text-headline-md py-4 rounded-full shadow-[0_10px_20px_rgba(123,92,250,0.2)] hover:opacity-90 active:scale-[0.98] transition-all flex justify-center items-center gap-2">
                Confirmer
            </button>
</div>
</main>
<script>
        const inputs = document.querySelectorAll('.otp-input');
        inputs.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                if (e.target.value.length === 1 && index < inputs.length - 1) {
                    inputs[index + 1].focus();
                }
            });
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && e.target.value.length === 0 && index > 0) {
                    inputs[index - 1].focus();
                }
            });
        });
    </script>
<script src="../assets/switch.forms.js"></script>
<script src="../assets/switch.router.js"></script>
</body></html>
