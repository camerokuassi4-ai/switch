<!DOCTYPE html>

<html lang="fr"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Transfert Contact</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link rel="stylesheet" href="../assets/switch.css">
<script src="../assets/switch.config.js"></script>

<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background min-h-screen text-on-background pb-32">
<!-- TopAppBar -->
<header class="docked full-width top-0 bg-transparent flex justify-between items-center px-container-margin py-stack-md w-full">
<div class="flex items-center gap-gutter">
<button class="w-10 h-10 rounded-full overflow-hidden hover:bg-surface-container-high transition-colors flex items-center justify-center">
<img alt="User Profile" class="w-full h-full object-cover" data-alt="A close-up portrait of a young Beninese woman with a warm smile, wearing modern casual attire. Soft, even lighting creates a friendly and accessible mood. The image is framed as a circular avatar against a clean, light-mode background with subtle purple accents." src="../assets/images/img_052.jpg"/>
</button>
<h1 class="font-headline-md text-headline-md text-on-surface font-bold">Bonjour, Adele</h1>
</div>
<button class="w-10 h-10 rounded-full hover:bg-surface-container-high transition-colors flex items-center justify-center text-primary active:scale-95 transition-transform">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">search</span>
</button>
</header>
<!-- Main Content -->
<main class="px-container-margin py-stack-lg max-w-md mx-auto">
<h2 class="font-display-lg-mobile text-display-lg-mobile md:font-display-lg md:text-display-lg mb-stack-md">Transfert</h2>
<!-- Search Bar -->
<div class="relative mb-stack-lg group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline-variant group-focus-within:text-primary transition-colors">search</span>
<input class="w-full bg-surface-container-lowest border border-surface-variant rounded-xl py-3 pl-12 pr-4 font-body-lg text-body-lg text-on-surface placeholder:text-outline-variant focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all shadow-sm" placeholder="Rechercher un contact..." type="text"/>
</div>
<!-- Recent Contacts -->
<div class="mb-stack-lg">
<h3 class="font-headline-md text-headline-md mb-stack-sm">Récents</h3>
<div class="space-y-stack-sm">
<!-- Contact 1 -->
<button onclick="selectContact('Koffi Kouamé', '+229 97 00 00 01', '../assets/images/img_053.jpg')" class="w-full flex items-center justify-between p-3.5 bg-surface-container-lowest rounded-2xl hover:bg-surface-container transition-colors shadow-sm border border-outline-variant cursor-pointer">
<div class="flex items-center gap-3">
<div class="w-12 h-12 rounded-full overflow-hidden flex-shrink-0">
<img alt="Contact Avatar" class="w-full h-full object-cover" src="../assets/images/img_053.jpg"/>
</div>
<div class="text-left">
<div class="text-sm font-bold text-on-surface">Koffi Kouamé</div>
<div class="text-xs text-on-surface-variant">+229 97 00 00 01</div>
</div>
</div>
<span class="text-xs text-primary font-semibold">Choisir</span>
</button>
<!-- Contact 2 -->
<button onclick="selectContact('Marie Dansou', '+229 61 00 00 02', '../assets/images/img_041.jpg')" class="w-full flex items-center justify-between p-3.5 bg-surface-container-lowest rounded-2xl hover:bg-surface-container transition-colors shadow-sm border border-outline-variant cursor-pointer">
<div class="flex items-center gap-3">
<div class="w-12 h-12 rounded-full overflow-hidden flex-shrink-0 bg-primary-container text-primary flex items-center justify-center font-bold text-base">
MD
</div>
<div class="text-left">
<div class="text-sm font-bold text-on-surface">Marie Dansou</div>
<div class="text-xs text-on-surface-variant">+229 61 00 00 02</div>
</div>
</div>
<span class="text-xs text-primary font-semibold">Choisir</span>
</button>
</div>
</div>
<!-- Selected Contact & Amount -->
<div class="bg-surface-container-lowest rounded-3xl p-6 shadow-sm border border-outline-variant mb-6 relative overflow-hidden flex flex-col gap-4">
<div class="flex flex-col items-center text-center">
<div class="w-16 h-16 rounded-full overflow-hidden mb-2 border-2 border-primary/20">
<img id="selected-avatar" alt="Selected Contact Avatar" class="w-full h-full object-cover" src="../assets/images/img_054.jpg"/>
</div>
<div class="text-base font-bold text-on-surface" id="selected-name">Maman</div>
<div class="text-xs text-on-surface-variant" id="selected-phone">+229 95 00 00 00</div>
</div>

<div class="text-center">
<input id="transfer-amt" class="w-full text-center bg-transparent border-none text-3xl sm:text-4xl font-mono font-black text-primary focus:ring-0 p-0 mb-1" placeholder="0" type="number" value="5000"/>
<div class="text-xs font-bold text-on-surface-variant uppercase">FCFA</div>
</div>

<!-- Quick Amount Chips -->
<div class="grid grid-cols-4 gap-2">
  <button type="button" onclick="document.getElementById('transfer-amt').value=1000" class="py-1.5 rounded-xl bg-surface-container text-xs font-bold text-on-surface hover:bg-primary-container">1 000</button>
  <button type="button" onclick="document.getElementById('transfer-amt').value=2000" class="py-1.5 rounded-xl bg-surface-container text-xs font-bold text-on-surface hover:bg-primary-container">2 000</button>
  <button type="button" onclick="document.getElementById('transfer-amt').value=5000" class="py-1.5 rounded-xl bg-surface-container text-xs font-bold text-on-surface hover:bg-primary-container">5 000</button>
  <button type="button" onclick="document.getElementById('transfer-amt').value=10000" class="py-1.5 rounded-xl bg-surface-container text-xs font-bold text-on-surface hover:bg-primary-container">10 000</button>
</div>

<div class="bg-surface-container rounded-2xl p-3 flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-green-600 text-sm" style="font-variation-settings: 'FILL' 1;">bolt</span>
<span class="text-xs text-green-700 font-semibold">Transfert instantané • Frais : 0 FCFA</span>
</div>

<button onclick="submitTransfer()" class="w-full bg-primary text-on-primary font-bold py-4 rounded-full shadow-lg hover:opacity-90 active:scale-[0.98] transition-all flex items-center justify-center gap-2 text-base cursor-pointer">
<span>Envoyer maintenant</span>
<span class="material-symbols-outlined text-xl">arrow_forward</span>
</button>
</div>
</main>

<script>
  function selectContact(name, phone, avatar) {
    document.getElementById('selected-name').textContent = name;
    document.getElementById('selected-phone').textContent = phone;
    document.getElementById('selected-avatar').src = avatar;
  }

  function submitTransfer() {
    const amt = document.getElementById('transfer-amt').value;
    if (!amt || parseInt(amt) <= 0) {
      alert('Veuillez saisir un montant.');
      return;
    }
    if (window.switchNavigate) {
      window.switchNavigate('../confirmation_de_succ_s/code.html');
    } else {
      window.location.href = '../confirmation_de_succ_s/code.html';
    }
  }
</script>

<script src="../assets/switch.router.js"></script>
</body></html>
