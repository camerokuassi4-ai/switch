<!DOCTYPE html>
<html class="light" lang="fr">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
  <title>Connexion - Switch Bénin</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link rel="stylesheet" href="../assets/switch.css">
  <script src="../assets/switch.config.js"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            primary: '#5E3BDC',
            'primary-hover': '#4D2EC2',
            'primary-container': '#EADDFF',
            'on-primary': '#FFFFFF',
            surface: '#FFFFFF',
            'on-surface': '#1C1A24',
            'on-surface-variant': '#5D5A68',
            'surface-container': '#F3EEFF',
            'outline': '#79747E',
            'outline-variant': '#CAC4D0',
          },
          spacing: {
            'container-margin': '16px',
          }
        }
      }
    };
  </script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800;900&display=swap');
    body {
      font-family: 'Hanken Grotesk', sans-serif;
      min-height: 100vh !important;
      min-height: 100dvh !important;
      background-color: #F8F9FD !important;
      color: #1C1A24 !important;
      -webkit-font-smoothing: antialiased;
      padding-bottom: 24px !important;
    }

    .pin-input {
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .pin-input:focus {
      border-color: #5E3BDC;
      box-shadow: 0 0 0 3px rgba(94, 59, 220, 0.25);
      background-color: #FFFFFF;
      outline: none;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between antialiased">

  <!-- Top App Bar -->
  <header class="w-full max-w-lg mx-auto px-container-margin pt-6 pb-2 flex items-center justify-between z-30">
    <a href="../accueil_splash_mis_jour/code.html" class="w-10 h-10 rounded-full flex items-center justify-center bg-purple-100/70 border border-purple-200 text-[#5E3BDC] shadow-sm hover:bg-purple-100 transition-colors">
      <span class="material-symbols-outlined text-xl">arrow_back</span>
    </a>
    <div class="text-center">
      <span class="text-xs font-black uppercase text-[#5E3BDC] tracking-wider">Switch Bénin</span>
    </div>
    <div class="w-10"></div>
  </header>

  <!-- Main Content Canvas -->
  <main class="w-full max-w-lg mx-auto px-container-margin flex flex-col items-center text-center gap-3 pt-2 flex-1 justify-center">
    
    <!-- Logo & Welcome -->
    <div class="flex flex-col items-center gap-2 mb-1">
      <div class="w-14 h-14 rounded-2xl bg-white p-2 shadow-md border border-purple-100 flex items-center justify-center">
        <img src="../assets/images/img_003.jpg" alt="Logo Switch" class="w-full h-full object-contain rounded-xl"/>
      </div>
      <div class="space-y-1 max-w-xs">
        <h1 class="text-2xl sm:text-3xl font-black text-[#1C1A24] tracking-tight">Bon retour ! 👋</h1>
        <p class="text-xs sm:text-sm text-[#5D5A68] font-medium leading-relaxed">
          Connectez-vous pour gérer vos transferts et comptes Switch.
        </p>
      </div>
    </div>

    <!-- Login Form -->
    <form class="w-full max-w-sm flex flex-col gap-4 mt-2" onsubmit="event.preventDefault(); handleLogin();">
      
      <!-- 1. Phone Number Input Field -->
      <div class="bg-white rounded-3xl p-4.5 border border-outline-variant/40 shadow-sm flex flex-col gap-2 text-left">
        <label class="text-xs font-black uppercase tracking-wider text-on-surface-variant" for="login-phone">Numéro de Téléphone</label>
        <div class="flex items-center gap-2 bg-surface-container/60 rounded-2xl px-4 py-3 border border-outline-variant/50 focus-within:border-primary focus-within:bg-white transition-all">
          <div class="flex items-center gap-1.5 shrink-0 border-r border-outline-variant/50 pr-2.5">
            <span class="text-base">🇧🇯</span>
            <span class="text-xs font-black text-on-surface font-mono">+229</span>
          </div>
          <input type="tel" id="login-phone" value="" placeholder="01 97 12 34 56" maxlength="14" class="w-full bg-transparent border-none p-0 text-sm font-bold font-mono text-on-surface focus:ring-0 outline-none" oninput="formatLoginPhone(this)" onfocus="if(!this.value) this.value='01 ';"/>
        </div>
        <p class="text-[10px] text-gray-400 pl-1">Format 10 chiffres commençant par <b>01</b>.</p>
      </div>

      <!-- 2. 4-Digit Secret PIN Boxes -->
      <div class="bg-white rounded-3xl p-5 border border-outline-variant/40 shadow-sm flex flex-col gap-3">
        <div class="flex items-center justify-between">
          <label class="text-xs font-black uppercase tracking-wider text-on-surface-variant">Code PIN Secret (4 Chiffres)</label>
          <button type="button" onclick="togglePinEye()" class="text-[11px] font-bold text-on-surface-variant hover:text-primary flex items-center gap-1 cursor-pointer">
            <span class="material-symbols-outlined text-sm" id="eye-icon">visibility</span>
            <span id="eye-text">Afficher</span>
          </button>
        </div>

        <div class="flex justify-center gap-3 pt-1">
          <input aria-label="PIN Chiffre 1" class="pin-input w-12 h-14 text-center font-mono font-black text-2xl rounded-2xl bg-surface-container/50 border border-outline-variant/50 shadow-sm text-primary" id="pin-0" inputmode="numeric" maxlength="1" pattern="[0-9]*" type="password" autofocus/>
          <input aria-label="PIN Chiffre 2" class="pin-input w-12 h-14 text-center font-mono font-black text-2xl rounded-2xl bg-surface-container/50 border border-outline-variant/50 shadow-sm text-primary" id="pin-1" inputmode="numeric" maxlength="1" pattern="[0-9]*" type="password"/>
          <input aria-label="PIN Chiffre 3" class="pin-input w-12 h-14 text-center font-mono font-black text-2xl rounded-2xl bg-surface-container/50 border border-outline-variant/50 shadow-sm text-primary" id="pin-2" inputmode="numeric" maxlength="1" pattern="[0-9]*" type="password"/>
          <input aria-label="PIN Chiffre 4" class="pin-input w-12 h-14 text-center font-mono font-black text-2xl rounded-2xl bg-surface-container/50 border border-outline-variant/50 shadow-sm text-primary" id="pin-3" inputmode="numeric" maxlength="1" pattern="[0-9]*" type="password"/>
        </div>

        <div class="flex justify-end pt-1">
          <a href="../reinitialisation_code_pin/code.html" class="text-xs font-bold text-primary hover:underline">
            Code PIN oublié ?
          </a>
        </div>
      </div>

      <!-- 3. Primary Action Button -->
      <button type="submit" class="w-full bg-primary text-white py-4 rounded-full font-bold text-base shadow-lg hover:opacity-90 active:scale-[0.98] transition-all flex items-center justify-center gap-2 cursor-pointer mt-1">
        <span>Se connecter</span>
        <span class="material-symbols-outlined text-xl">login</span>
      </button>

      <!-- 4. Biometric Quick Login Button -->
      <button type="button" onclick="triggerBiometrics()" class="w-full bg-white border border-outline-variant/50 hover:bg-surface-container py-3.5 rounded-full font-bold text-xs shadow-sm flex items-center justify-center gap-2 cursor-pointer text-on-surface transition-all">
        <span class="material-symbols-outlined text-xl text-primary">fingerprint</span>
        <span>Connexion rapide par Empreinte / Face ID</span>
      </button>

      <!-- 5. Register Link -->
      <div class="pt-2 text-center">
        <p class="text-xs text-on-surface-variant font-medium">
          Nouveau sur Switch Bénin ? 
          <a href="../choix_type_compte/code.html" class="text-primary font-black hover:underline ml-1">
            Créer un compte
          </a>
        </p>
      </div>

    </form>

  </main>

  <script>
    const pinInputs = [
      document.getElementById('pin-0'),
      document.getElementById('pin-1'),
      document.getElementById('pin-2'),
      document.getElementById('pin-3')
    ];

    pinInputs.forEach((inp, idx) => {
      inp.addEventListener('input', (e) => {
        e.target.value = e.target.value.replace(/[^0-9]/g, '');
        if (e.target.value.length === 1) {
          if (idx < pinInputs.length - 1) {
            pinInputs[idx + 1].focus();
          } else {
            inp.blur();
            handleLogin();
          }
        }
      });

      inp.addEventListener('keydown', (e) => {
        if (e.key === 'Backspace' && e.target.value.length === 0 && idx > 0) {
          pinInputs[idx - 1].focus();
          pinInputs[idx - 1].value = '';
        }
      });
    });

    let isPinVisible = false;
    function togglePinEye() {
      isPinVisible = !isPinVisible;
      pinInputs.forEach(i => i.type = isPinVisible ? 'text' : 'password');
      document.getElementById('eye-icon').textContent = isPinVisible ? 'visibility_off' : 'visibility';
      document.getElementById('eye-text').textContent = isPinVisible ? 'Masquer' : 'Afficher';
    }

    function formatLoginPhone(el) {
      let raw = el.value.replace(/\D/g, '');
      if (raw.length > 10) raw = raw.substring(0, 10);
      
      let formatted = '';
      for (let i = 0; i < raw.length; i++) {
        if (i > 0 && i % 2 === 0) formatted += ' ';
        formatted += raw[i];
      }
      el.value = formatted;
    }

    // Préremplissage si utilisateur déjà existant en mémoire ou compte test
    document.addEventListener('DOMContentLoaded', () => {
      const savedPhone = localStorage.getItem('switch_user_phone_raw') || localStorage.getItem('switch_account_number') || localStorage.getItem('switch_user_phone') || '01 90 75 17 86';
      const phoneInp = document.getElementById('login-phone');
      if (phoneInp && !phoneInp.value) {
        let digits = savedPhone.replace(/\D/g, '');
        if (digits.startsWith('229')) digits = digits.slice(3);
        if (digits.length >= 10) {
          phoneInp.value = digits.slice(0,2) + ' ' + digits.slice(2,4) + ' ' + digits.slice(4,6) + ' ' + digits.slice(6,8) + ' ' + digits.slice(8,10);
        } else {
          phoneInp.value = '01 90 75 17 86';
        }
      }
    });

    function handleLogin() {
      const pin = pinInputs.map(i => i.value).join('');
      const phoneInput = document.getElementById('login-phone').value.trim();
      const phoneDigits = phoneInput.replace(/\D/g, '');

      if (!phoneDigits || phoneDigits.length !== 10 || !phoneDigits.startsWith('01')) {
        alert("Veuillez saisir un numéro de téléphone béninois valide à 10 chiffres commençant par 01 (ex: 01 97 12 34 56).");
        document.getElementById('login-phone').focus();
        return;
      }
      if (pin.length < 4) {
        alert("Veuillez saisir les 4 chiffres de votre code PIN.");
        pinInputs[0].focus();
        return;
      }

      if (window.switchNavigate) {
        window.switchNavigate('../tableau_de_bord_mis_jour/code.html');
      } else {
        window.location.href = '../tableau_de_bord_mis_jour/code.html';
      }
    }

    function triggerBiometrics() {
      if (navigator.vibrate) navigator.vibrate([40, 30, 80]);
      alert("🤳 Authentification Biométrique réussie (Face ID / Empreinte digitale reconnue) !");
      if (window.switchNavigate) {
        window.switchNavigate('../tableau_de_bord_mis_jour/code.html');
      } else {
        window.location.href = '../tableau_de_bord_mis_jour/code.html';
      }
    }
  </script>

  <script src="../assets/switch.router.js"></script>
</body>
</html>
