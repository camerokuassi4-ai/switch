<!DOCTYPE html>

<html lang="fr"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Connexion - Switch</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link rel="stylesheet" href="../assets/switch.css">
<script src="../assets/switch.config.js"></script>

<style>
        body {
            background-color: #fdf8ff; /* Fallback */
            -webkit-tap-highlight-color: transparent;
        }
        .pin-dot {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background-color: #e6e0ee;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }
        .pin-dot.filled {
            background-color: #5e3bdc;
            transform: scale(1.1);
        }
        .keypad-btn {
            transition: background-color 0.1s ease, transform 0.1s ease;
        }
        .keypad-btn:active {
            background-color: #e6e0ee;
            transform: scale(0.95);
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col items-center justify-center font-body-lg">
<div class="w-full max-w-md px-container-margin py-stack-lg flex flex-col min-h-screen">
<!-- Header / Logo -->
<header class="flex flex-col items-center pt-8 pb-12">
<img alt="Switch Logo" class="w-20 h-20 rounded-2xl shadow-sm mb-6 object-cover" src="../assets/images/img_009.jpg"/>
<h1 class="font-display-lg-mobile text-display-lg-mobile text-on-surface text-center">Bon retour !</h1>
</header>
<!-- Main Content -->
<main class="flex-grow flex flex-col">
<!-- Phone Input Field -->
<div class="mb-8">
<div class="flex items-center bg-surface-container-lowest border border-outline-variant rounded-xl px-4 py-3 shadow-sm focus-within:border-primary focus-within:ring-2 focus-within:ring-primary/20 transition-all">
<span class="text-on-surface-variant font-headline-md text-headline-md mr-3 border-r border-outline-variant pr-3">+229</span>
<input aria-label="Numéro de téléphone" class="w-full bg-transparent border-none p-0 focus:ring-0 font-headline-md text-headline-md text-on-surface outline-none" id="phone" readonly="" type="tel" value="97 00 00 00"/>
</div>
</div>
<!-- PIN Display -->
<div class="flex flex-col items-center mb-auto">
<div class="flex gap-4 mb-4 justify-center" id="pin-display">
<div class="pin-dot"></div>
<div class="pin-dot"></div>
<div class="pin-dot"></div>
<div class="pin-dot"></div>
</div>
<a class="font-body-sm text-body-sm text-primary hover:underline font-bold" href="../reinitialisation_code_pin/code.html">PIN oublié ?</a>
</div>
<!-- Custom Keypad -->
<div class="mt-8 mb-8">
<div class="grid grid-cols-3 gap-y-6 gap-x-4 max-w-[280px] mx-auto">
<button class="keypad-btn font-headline-md text-headline-md text-on-surface h-16 w-16 rounded-full mx-auto flex items-center justify-center bg-surface-container-lowest shadow-[0_4px_10px_rgba(0,0,0,0.03)]" onclick="enterPin('1')">1</button>
<button class="keypad-btn font-headline-md text-headline-md text-on-surface h-16 w-16 rounded-full mx-auto flex items-center justify-center bg-surface-container-lowest shadow-[0_4px_10px_rgba(0,0,0,0.03)]" onclick="enterPin('2')">2</button>
<button class="keypad-btn font-headline-md text-headline-md text-on-surface h-16 w-16 rounded-full mx-auto flex items-center justify-center bg-surface-container-lowest shadow-[0_4px_10px_rgba(0,0,0,0.03)]" onclick="enterPin('3')">3</button>
<button class="keypad-btn font-headline-md text-headline-md text-on-surface h-16 w-16 rounded-full mx-auto flex items-center justify-center bg-surface-container-lowest shadow-[0_4px_10px_rgba(0,0,0,0.03)]" onclick="enterPin('4')">4</button>
<button class="keypad-btn font-headline-md text-headline-md text-on-surface h-16 w-16 rounded-full mx-auto flex items-center justify-center bg-surface-container-lowest shadow-[0_4px_10px_rgba(0,0,0,0.03)]" onclick="enterPin('5')">5</button>
<button class="keypad-btn font-headline-md text-headline-md text-on-surface h-16 w-16 rounded-full mx-auto flex items-center justify-center bg-surface-container-lowest shadow-[0_4px_10px_rgba(0,0,0,0.03)]" onclick="enterPin('6')">6</button>
<button class="keypad-btn font-headline-md text-headline-md text-on-surface h-16 w-16 rounded-full mx-auto flex items-center justify-center bg-surface-container-lowest shadow-[0_4px_10px_rgba(0,0,0,0.03)]" onclick="enterPin('7')">7</button>
<button class="keypad-btn font-headline-md text-headline-md text-on-surface h-16 w-16 rounded-full mx-auto flex items-center justify-center bg-surface-container-lowest shadow-[0_4px_10px_rgba(0,0,0,0.03)]" onclick="enterPin('8')">8</button>
<button class="keypad-btn font-headline-md text-headline-md text-on-surface h-16 w-16 rounded-full mx-auto flex items-center justify-center bg-surface-container-lowest shadow-[0_4px_10px_rgba(0,0,0,0.03)]" onclick="enterPin('9')">9</button>
<div></div> <!-- Empty grid cell for alignment -->
<button class="keypad-btn font-headline-md text-headline-md text-on-surface h-16 w-16 rounded-full mx-auto flex items-center justify-center bg-surface-container-lowest shadow-[0_4px_10px_rgba(0,0,0,0.03)]" onclick="enterPin('0')">0</button>
<button aria-label="Supprimer" class="keypad-btn text-on-surface-variant h-16 w-16 rounded-full mx-auto flex items-center justify-center" onclick="deletePin()">
<span class="material-symbols-outlined" style="font-size: 28px;">backspace</span>
</button>
</div>
</div>
<!-- Login Button -->
<button class="w-full bg-primary text-on-primary font-headline-md text-headline-md py-4 rounded-xl shadow-[0_10px_20px_rgba(94,59,220,0.2)] opacity-50 cursor-not-allowed transition-all duration-300" disabled="" id="login-btn">
                Se connecter
            </button>
</main>
</div>
<script>
        let currentPin = '';
        const maxPinLength = 4;
        const dots = document.querySelectorAll('.pin-dot');
        const loginBtn = document.getElementById('login-btn');

        function updateDots() {
            dots.forEach((dot, index) => {
                if (index < currentPin.length) {
                    dot.classList.add('filled');
                } else {
                    dot.classList.remove('filled');
                }
            });

            if (currentPin.length === maxPinLength) {
                loginBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                loginBtn.classList.add('hover:bg-on-primary-fixed-variant', 'active:scale-95');
                loginBtn.removeAttribute('disabled');
                // Navigation automatique après validation PIN complète
                window.location.href = '../tableau_de_bord_mis_jour/code.html';
            } else {
                loginBtn.classList.add('opacity-50', 'cursor-not-allowed');
                loginBtn.classList.remove('hover:bg-on-primary-fixed-variant', 'active:scale-95');
                loginBtn.setAttribute('disabled', 'true');
            }
        }

        window.enterPin = function(num) {
            if (currentPin.length < maxPinLength) {
                currentPin += num;
                updateDots();
                
                // Haptic feedback simulation if supported (mostly mobile)
                if (navigator.vibrate) {
                    navigator.vibrate(10);
                }
            }
        };

        window.deletePin = function() {
            if (currentPin.length > 0) {
                currentPin = currentPin.slice(0, -1);
                updateDots();
                
                if (navigator.vibrate) {
                    navigator.vibrate(10);
                }
            }
        };
    </script>
<script src="../assets/switch.forms.js"></script>
<script src="../assets/switch.router.js"></script>
</body></html>
