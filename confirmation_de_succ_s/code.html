<!DOCTYPE html>

<html lang="fr"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Opération Réussie</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link rel="stylesheet" href="../assets/switch.css">
<script src="../assets/switch.config.js"></script>

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        
        /* Fluid Silk Animation for the Success Circle */
        @keyframes morph {
            0% { border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%; }
            50% { border-radius: 30% 60% 70% 40% / 50% 60% 30% 60%; }
            100% { border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%; }
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .fluid-silk-circle {
            animation: morph 8s ease-in-out infinite, float 6s ease-in-out infinite;
            background: linear-gradient(135deg, #7758f6 0%, #5e3bdc 100%);
            box-shadow: 0 20px 40px -10px rgba(94, 59, 220, 0.4);
        }

        /* Ambient Background Glow */
        .ambient-glow {
            position: absolute;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(119, 88, 246, 0.15) 0%, rgba(253, 248, 255, 0) 70%);
            top: -50px;
            left: -50px;
            z-index: 0;
            pointer-events: none;
        }

        /* Entry Animations */
        @keyframes slideUpFade {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .animate-in {
            opacity: 1 !important;
            transform: none !important;
            animation: none !important;
        }
        
        .delay-100, .delay-200, .delay-300 { animation-delay: 0s !important; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen flex flex-col relative overflow-hidden font-body-sm selection:bg-primary selection:text-on-primary">
<!-- Ambient Background Lighting -->
<div class="ambient-glow"></div>
<div class="ambient-glow" style="top: auto; bottom: -100px; right: -100px; left: auto;"></div>
<main class="flex-1 flex flex-col items-center justify-center p-container-margin relative z-10 w-full max-w-md mx-auto h-full min-h-screen">
<!-- Top Spacer for vertical centering bias -->
<div class="flex-1"></div>
<!-- Success Graphic Area -->
<div class="flex flex-col items-center w-full animate-in">
<!-- Fluid Circle with Check -->
<div class="relative w-32 h-32 flex items-center justify-center mb-stack-lg">
<!-- Inner glow ring -->
<div class="absolute inset-0 bg-primary-fixed rounded-full blur-xl opacity-60"></div>
<!-- The fluid silk shape -->
<div class="fluid-silk-circle absolute inset-0 w-full h-full"></div>
<!-- Check Icon -->
<span class="material-symbols-outlined text-on-primary text-[64px] relative z-10 drop-shadow-md" data-weight="fill">
                    check
                </span>
</div>
<!-- Headline -->
<h1 class="font-display-lg-mobile text-display-lg-mobile text-on-background text-center mb-stack-sm tracking-tight">
                Opération réussie !
            </h1>
<p class="font-body-lg text-body-lg text-on-surface-variant text-center mb-stack-lg">
                Votre transaction a été traitée avec succès.
            </p>
</div>
<!-- Transaction Amount Card (Glassmorphism inspired) -->
<div class="w-full bg-surface-container-lowest rounded-xl p-card-padding shadow-[0_10px_30px_-10px_rgba(0,0,0,0.05)] border border-surface-container-highest animate-in delay-100 flex flex-col items-center justify-center relative overflow-hidden">
<!-- Subtle decorative background pattern inside card -->
<div class="absolute top-0 right-0 w-32 h-32 bg-[radial-gradient(ellipse_at_top_right,_var(--tw-gradient-stops))] from-primary-fixed-dim/30 to-transparent rounded-bl-full pointer-events-none"></div>
<span class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-wider mb-2 relative z-10">
                Montant Transféré
            </span>
<div class="flex items-baseline gap-1 relative z-10">
<span class="font-display-lg-mobile text-display-lg-mobile text-primary font-black">
                    50 000
                </span>
<span class="font-headline-md text-headline-md text-primary font-bold">
                    FCFA
                </span>
</div>
<!-- Small details divider -->
<div class="w-12 h-[2px] bg-surface-container-high rounded-full mt-4 mb-4"></div>
<!-- Minor details -->
<div class="w-full flex justify-between items-center text-on-surface-variant font-body-sm relative z-10">
<span>Réf: #TRX-94827A</span>
<span>Aujourd'hui, 14:32</span>
</div>
</div>
<!-- Bottom Spacer -->
<div class="flex-1"></div>
<!-- Action Area -->
<div class="w-full w-full pb-stack-lg pt-stack-md animate-in delay-200">
<button class="w-full h-14 bg-primary text-on-primary rounded-full font-label-caps text-label-caps flex items-center justify-center gap-2 hover:bg-primary-container transition-all active:scale-[0.98] shadow-lg shadow-primary/25">
<span class="material-symbols-outlined text-[20px]">
                    home
                </span>
                RETOUR À L'ACCUEIL
            </button>
</div>
</main>
<script src="../assets/switch.router.js"></script>
</body></html>
