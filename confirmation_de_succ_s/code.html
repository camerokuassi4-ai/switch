        .material-symbols-outlined {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        
        /* Fluid Silk Animation for the Success Circle */
        @keyframes morph {
            0% { border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%; }
            50% { border-radius: 30% 60% 70% 40% / 50% 60% 30% 60%; }
            100% { border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%; }
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .fluid-silk-circle {
            animation: morph 8s ease-in-out infinite, float 6s ease-in-out infinite;
            background: linear-gradient(135deg, #7758f6 0%, #5e3bdc 100%);
            box-shadow: 0 20px 40px -10px rgba(94, 59, 220, 0.4);

        /* Ambient Background Glow */
        .ambient-glow {
            position: absolute;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(119, 88, 246, 0.15) 0%, rgba(253, 248, 255, 0) 70%);
            top: -50px;
            left: -50px;
            z-index: 0;
            pointer-events: none;
        }

        /* Entry Animations */
        @keyframes slideUpFade {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .animate-in {
            opacity: 1 !important;
            transform: none !important;
            animation: none !important;
        }
        
        .delay-100, .delay-200, .delay-300 { animation-delay: 0s !important; }

<canvas id="confetti-canvas" class="fixed inset-0 pointer-events-none z-50"></canvas>

<script>
  (function burstConfetti() {
    const canvas = document.getElementById('confetti-canvas');
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const colors = ['#7B5CFA', '#5E3BDC', '#22C55E', '#F59E0B', '#3B82F6', '#EC4899'];
    const particles = [];

    for (let i = 0; i < 70; i++) {
      particles.push({
        x: canvas.width / 2,
        y: canvas.height * 0.35,
        w: Math.random() * 8 + 4,
        h: Math.random() * 6 + 4,
        color: colors[Math.floor(Math.random() * colors.length)],
        vx: (Math.random() - 0.5) * 12,
        vy: (Math.random() - 0.7) * 12,
        rotation: Math.random() * 360,
        rSpeed: (Math.random() - 0.5) * 8,
        opacity: 1
      });
    }

    let frame = 0;
    function animate() {
      if (frame > 90) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        return;
      }
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(p => {
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.25; // gravity
        p.rotation += p.rSpeed;
        p.opacity = Math.max(0, 1 - (frame / 90));

        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate((p.rotation * Math.PI) / 180);
        ctx.globalAlpha = p.opacity;
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
        ctx.restore();
      });
      frame++;
      requestAnimationFrame(animate);
    }
    animate();
  })();
</script>
