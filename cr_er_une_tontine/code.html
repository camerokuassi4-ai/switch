<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Créer une Tontine</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link rel="stylesheet" href="../assets/switch.css">
<script src="../assets/switch.config.js"></script>

<style>
        body {
            background-color: #fdf8ff; /* background */
            color: #1c1a24; /* on-background */
        }
        
        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.05);
        }

        .segment-active {
            background-color: #7758f6; /* primary-container */
            color: #fffbff; /* on-primary-container */
            box-shadow: 0 4px 12px rgba(119, 88, 246, 0.2);
        }
        
        .segment-inactive {
            background-color: transparent;
            color: #484555; /* on-surface-variant */
        }
        
        .input-glow:focus-within {
            box-shadow: 0 0 0 4px rgba(119, 88, 246, 0.1);
            border-color: #5e3bdc; /* primary */
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="antialiased min-h-screen flex flex-col items-center">
<!-- TopAppBar -->
<header class="w-full flex justify-between items-center px-container-margin py-stack-md bg-transparent fixed top-0 z-40 backdrop-blur-sm md:max-w-md">
<!-- Close action implies transactional focus, so navigation shell is suppressed -->
<button aria-label="Retour" class="w-10 h-10 rounded-full bg-surface-container-high flex items-center justify-center text-on-surface hover:bg-surface-variant transition-colors">
<span class="material-symbols-outlined text-[24px]">arrow_back</span>
</button>
<div class="font-headline-md text-headline-md text-on-surface font-bold">
            Nouvelle Tontine
        </div>
<div class="w-10 h-10"></div> <!-- Spacer for centering -->
</header>
<!-- Main Content Canvas -->
<main class="w-full max-w-md flex-1 px-container-margin pt-24 pb-32 flex flex-col gap-stack-lg">
<!-- Hero Graphic / Inspiration -->
<div class="w-full rounded-2xl overflow-hidden h-40 relative shadow-sm" style="background: linear-gradient(135deg, #e6deff 0%, #cabeff 100%);">
<div class="absolute inset-0 bg-cover bg-center mix-blend-overlay opacity-50" data-alt="A subtle, abstract geometric pattern representing community and connection. Soft intersecting circles and soft glowing nodes over a light purple background. Modern, clean, and optimistic fintech aesthetic emphasizing trust and collective savings." style="background-image: url('../assets/images/img_010.jpg')"></div>
<div class="absolute inset-0 flex items-center justify-center flex-col p-4 text-center">
<span class="material-symbols-outlined text-[48px] text-primary mb-2" style="font-variation-settings: 'FILL' 1;">groups</span>
<p class="font-body-sm text-body-sm text-on-primary-fixed-variant font-medium">Épargnez ensemble, atteignez vos buts plus vite.</p>
</div>
</div>
<form class="flex flex-col gap-stack-lg" onsubmit="event.preventDefault();">
<!-- Group Details Section -->
<section class="flex flex-col gap-stack-md">
<h2 class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-wider pl-1">Détails du groupe</h2>
<div class="glass-card rounded-2xl p-card-padding flex flex-col gap-stack-md">
<!-- Group Name -->
<div class="flex flex-col gap-stack-sm">
<label class="font-body-sm text-body-sm text-on-surface font-medium" for="groupName">Nom de la tontine</label>
<div class="relative flex items-center border border-outline-variant rounded-xl bg-surface-container-lowest input-glow transition-all">
<span class="material-symbols-outlined absolute left-3 text-on-surface-variant text-[20px]">edit</span>
<input class="w-full pl-10 pr-4 py-3 rounded-xl bg-transparent border-none focus:ring-0 font-body-lg text-body-lg text-on-surface placeholder:text-outline" id="groupName" placeholder="Ex: Projet Vacances Cotonou" type="text"/>
</div>
</div>
<!-- Contribution Amount -->
<div class="flex flex-col gap-stack-sm">
<label class="font-body-sm text-body-sm text-on-surface font-medium" for="amount">Montant par personne</label>
<div class="relative flex items-center border border-outline-variant rounded-xl bg-surface-container-lowest input-glow transition-all">
<span class="material-symbols-outlined absolute left-3 text-on-surface-variant text-[20px]">payments</span>
<input class="w-full pl-10 pr-16 py-3 rounded-xl bg-transparent border-none focus:ring-0 font-headline-md text-headline-md text-on-surface text-right font-bold placeholder:text-outline placeholder:font-normal" id="amount" placeholder="10 000" type="number"/>
<span class="absolute right-4 font-body-lg text-body-lg text-on-surface-variant">FCFA</span>
</div>
</div>
</div>
</section>
<!-- Frequency Section -->
<section class="flex flex-col gap-stack-md">
<h2 class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-wider pl-1">Fréquence de cotisation</h2>
<div class="glass-card rounded-2xl p-2 flex bg-surface-container-high/50">
<!-- Segmented Control -->
<button class="flex-1 py-2.5 rounded-xl text-center transition-all duration-200 segment-active font-body-sm text-body-sm font-medium" onclick="toggleFrequency(this)" type="button">
                        Hebdomadaire
                    </button>
<button class="flex-1 py-2.5 rounded-xl text-center transition-all duration-200 segment-inactive font-body-sm text-body-sm font-medium hover:bg-surface-variant" onclick="toggleFrequency(this)" type="button">
                        Mensuel
                    </button>
</div>
<p class="font-body-sm text-body-sm text-on-surface-variant text-center px-4">Le cycle sera défini une fois tous les membres inscrits.</p>
</section>
<!-- Invite Section -->
<section class="flex flex-col gap-stack-md">
<h2 class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-wider pl-1">Inviter des membres</h2>
<div class="glass-card rounded-2xl p-card-padding flex flex-col gap-stack-md">
<button class="w-full flex items-center justify-between p-4 rounded-xl border border-outline-variant hover:bg-surface-container-low transition-colors group" type="button">
<div class="flex items-center gap-4">
<div class="w-10 h-10 rounded-full bg-primary-fixed flex items-center justify-center text-on-primary-fixed-variant group-hover:scale-110 transition-transform">
<span class="material-symbols-outlined">contacts</span>
</div>
<div class="flex flex-col text-left">
<span class="font-body-lg text-body-lg text-on-surface font-medium">Depuis les contacts</span>
<span class="font-body-sm text-body-sm text-on-surface-variant">Sélectionnez dans votre carnet</span>
</div>
</div>
<span class="material-symbols-outlined text-on-surface-variant">chevron_right</span>
</button>
<div class="relative flex items-center py-2">
<div class="flex-grow border-t border-outline-variant"></div>
<span class="flex-shrink-0 mx-4 font-body-sm text-body-sm text-on-surface-variant">OU</span>
<div class="flex-grow border-t border-outline-variant"></div>
</div>
<button class="w-full flex items-center justify-between p-4 rounded-xl bg-surface-container-low border border-dashed border-outline hover:border-primary transition-colors group" type="button">
<div class="flex items-center gap-4">
<div class="w-10 h-10 rounded-full bg-surface-container flex items-center justify-center text-on-surface-variant group-hover:text-primary transition-colors">
<span class="material-symbols-outlined">link</span>
</div>
<div class="flex flex-col text-left">
<span class="font-body-lg text-body-lg text-on-surface font-medium">Partager le lien</span>
<span class="font-body-sm text-body-sm text-on-surface-variant">tontine.app/join/x7...</span>
</div>
</div>
<span class="material-symbols-outlined text-on-surface-variant group-hover:text-primary transition-colors">content_copy</span>
</button>
</div>
</section>
</form>
</main>
<!-- Floating Action Button / CTA -->
<div class="fixed bottom-0 left-0 right-0 p-container-margin bg-gradient-to-t from-background via-background to-transparent pb-8 md:max-w-md md:mx-auto z-40">
<button class="w-full bg-primary hover:bg-surface-tint text-on-primary font-headline-md text-headline-md font-bold py-4 rounded-full shadow-lg hover:shadow-xl transition-all transform hover:-translate-y-1 active:scale-95 flex justify-center items-center gap-2" type="submit">
            Créer le groupe
            <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</div>
<script>
        function toggleFrequency(clickedBtn) {
            const buttons = clickedBtn.parentElement.querySelectorAll('button');
            buttons.forEach(btn => {
                if (btn === clickedBtn) {
                    btn.classList.remove('segment-inactive', 'hover:bg-surface-variant');
                    btn.classList.add('segment-active');
                } else {
                    btn.classList.remove('segment-active');
                    btn.classList.add('segment-inactive', 'hover:bg-surface-variant');
                }
            });
        }
    </script>
<script src="../assets/switch.forms.js"></script>
<script src="../assets/switch.router.js"></script>
</body></html>
