# =============================================================================
# MODÈLE DE CONFIGURATION REVERSE PROXY NGINX — BÊTA PUBLIQUE SWITCH BÉNIN
# Fichier : reverse-proxy.example.conf
# =============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name TO_BE_PROVIDED_BY_OWNER;

    # Redirection HTTP vers HTTPS obligatoire
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name TO_BE_PROVIDED_BY_OWNER;

    # Certificats TLS / SSL
    ssl_certificate /etc/ssl/certs/TO_BE_CONFIGURED.crt;
    ssl_certificate_key /etc/ssl/private/TO_BE_CONFIGURED.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Sécurité & En-têtes HTTP
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Blocage strict des répertoires et fichiers internes
    location ~* ^/(scratch|backups|scripts|\.git|\.env|package(-lock)?\.json|server\.(js|py)) {
        return 403;
    }

    # Proxy Pass vers le serveur Node.js interne
    location / {
        proxy_pass http://127.0.0.1:4148;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
