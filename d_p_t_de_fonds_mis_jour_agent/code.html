<!DOCTYPE html>

<html lang="fr"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Déposer des fonds</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link rel="stylesheet" href="../assets/switch.css">
<script src="../assets/switch.config.js"></script>

<style>
        body {
            background-color: #fdf8ff; /* background */
            color: #1c1a24; /* on-surface */
            -webkit-font-smoothing: antialiased;
        }
        
        .shadow-30px-y-15px-opacity-15 {
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.15);
        }

        .ambient-shadow-level-1 {
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.04);
        }

        /* Custom styles for the input focus state */
        .input-focus-ring:focus-within {
            border-color: #5e3bdc; /* primary */
            box-shadow: 0 0 0 4px rgba(94, 59, 220, 0.1);
        }
        
        /* Grid layout for sources */
        .source-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
        }
    </style>
</head>
<body class="min-h-screen pb-40">
<!-- Top Navigation (Contextual, Back button implied for 'Top-up' flow but keeping simple header) -->
<header class="flex justify-between items-center px-container-margin py-stack-md w-full bg-transparent top-0 sticky z-10">
<button aria-label="Retour" class="w-10 h-10 flex items-center justify-center rounded-full bg-surface-container-high hover:bg-surface-variant transition-colors">
<span class="material-symbols-outlined text-on-surface">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md text-on-surface font-bold">Déposer des fonds</h1>
<div class="w-10 h-10"></div> <!-- Spacer for centering -->
</header>
<main class="px-container-margin pt-stack-md flex flex-col gap-stack-lg max-w-lg mx-auto">
<!-- Source Selection Section -->
<section>
<h2 class="font-body-lg text-body-lg font-semibold text-on-surface mb-stack-md">Sélectionner la source</h2>
<div class="source-grid">
<!-- Agent Switch Option -->
<button class="bg-surface-container-lowest ambient-shadow-level-1 rounded-xl p-card-padding flex flex-col items-center justify-center gap-3 border-2 border-transparent hover:border-surface-variant transition-transform active:scale-95">
<div class="w-16 h-16 rounded-full bg-surface-container flex items-center justify-center mb-2">
<span class="material-symbols-outlined text-primary" style="font-size: 32px;">storefront</span>
</div>
<span class="font-body-sm text-body-sm text-on-surface font-semibold text-center">Via un Agent Switch</span>
</button>
<!-- MTN MoMo Option (Selected State) -->
<button class="relative bg-surface-container-lowest ambient-shadow-level-1 rounded-xl p-card-padding flex flex-col items-center justify-center gap-3 border-2 border-primary transition-transform active:scale-95">
<div class="absolute top-3 right-3 text-primary">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
<!-- Placeholder for MTN MoMo Logo -->
<div class="w-16 h-16 rounded-full bg-yellow-400 flex items-center justify-center mb-2 overflow-hidden">
<span class="font-headline-md text-black font-bold">MTN</span>
</div>
<span class="font-body-sm text-body-sm text-on-surface font-semibold text-center">MTN MoMo</span>
</button>
<!-- Moov Money Option -->
<button class="bg-surface-container-lowest ambient-shadow-level-1 rounded-xl p-card-padding flex flex-col items-center justify-center gap-3 border-2 border-transparent hover:border-surface-variant transition-transform active:scale-95">
<!-- Placeholder for Moov Money Logo -->
<div class="w-16 h-16 rounded-full bg-blue-600 flex items-center justify-center mb-2 overflow-hidden">
<span class="font-headline-md text-white font-bold">Moov</span>
</div>
<span class="font-body-sm text-body-sm text-on-surface font-semibold text-center">Moov Money</span>
</button>
<!-- Celtiis Cash Option -->
<button class="bg-surface-container-lowest ambient-shadow-level-1 rounded-xl p-card-padding flex flex-col items-center justify-center gap-3 border-2 border-transparent hover:border-surface-variant transition-transform active:scale-95">
<!-- Placeholder for Celtiis Cash Logo -->
<div class="w-16 h-16 rounded-full bg-green-500 flex items-center justify-center mb-2 overflow-hidden">
<span class="font-headline-md text-white font-bold">Celtiis</span>
</div>
<span class="font-body-sm text-body-sm text-on-surface font-semibold text-center">Celtiis Cash</span>
</button>
<!-- Bank Card Option -->
<button class="bg-surface-container-lowest ambient-shadow-level-1 rounded-xl p-card-padding flex flex-col items-center justify-center gap-3 border-2 border-transparent hover:border-surface-variant transition-transform active:scale-95">
<div class="w-16 h-16 rounded-full bg-surface-container flex items-center justify-center mb-2">
<span class="material-symbols-outlined text-primary" style="font-size: 32px;">credit_card</span>
</div>
<span class="font-body-sm text-body-sm text-on-surface font-semibold text-center">Carte bancaire</span>
</button>
</div>
</section>
<!-- Amount Input Section -->
<section class="mt-stack-sm">
<h2 class="font-body-lg text-body-lg font-semibold text-on-surface mb-stack-sm">Montant à déposer</h2>
<div class="input-focus-ring bg-surface-container-lowest ambient-shadow-level-1 rounded-xl border border-outline-variant flex items-center p-4 transition-all duration-200">
<span class="font-headline-md text-headline-md text-on-surface-variant mr-2">FCFA</span>
<input class="flex-1 bg-transparent border-none outline-none font-display-lg-mobile text-display-lg-mobile text-on-surface p-0 placeholder:text-surface-variant appearance-none" placeholder="0" style="-moz-appearance: textfield;" type="number"/>
</div>
<div class="flex justify-between items-center mt-2 px-1">
<span class="font-body-sm text-body-sm text-on-surface-variant">Min: 500 FCFA</span>
<span class="font-body-sm text-body-sm text-on-surface-variant">Max: 1 000 000 FCFA</span>
</div>
</section>
<!-- Action Button -->
<section class="mt-auto pt-stack-lg pb-stack-md">
<button onclick="window.location.href='../confirmation_de_l_op_ration_code/code.html'"
        class="w-full bg-primary hover:bg-surface-tint text-on-primary rounded-xl py-4 flex items-center justify-center font-body-lg text-body-lg font-bold transition-transform active:scale-95 shadow-md">
    Continuer
    <span class="material-symbols-outlined ml-2">arrow_forward</span>
</button>
</section>
</main>
<!-- Suppressed BottomNavBar - Transactional Screen -->
<!-- The BottomNavBar is intentionally excluded here because this is a transactional flow (Top-up/Deposit), 
         which represents a linear, focused task where a 'Close' or 'Back' action implies temporary departure 
         from the main navigation flow. -->
<script>
        // Simple input formatting script (optional UX enhancement)
        document.querySelector('input[type="number"]').addEventListener('input', function (e) {
            // This is a basic example. In a real app, you'd want more robust formatting for currency.
            if(this.value.length > 10) {
                this.value = this.value.slice(0, 10);
            }
        });
    </script>
<script src="../assets/switch.forms.js"></script>
<script src="../assets/switch.router.js"></script>
</body></html>
