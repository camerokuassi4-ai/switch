<!DOCTYPE html>
<html class="light" lang="fr">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Mode Hors-Ligne & Relais USSD - Switch</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link rel="stylesheet" href="../assets/switch.css">
  <script src="../assets/switch.config.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700;900&display=swap');
    body { font-family: 'Hanken Grotesk', sans-serif; min-height: max(884px, 100dvh); }
    .soft-shadow { box-shadow: 0px 10px 25px rgba(0, 0, 0, 0.05); }
  </style>
</head>
<body class="bg-background text-on-background min-h-screen pb-32 flex flex-col antialiased">
  <!-- TopAppBar -->
  <header class="flex items-center justify-between px-container-margin py-stack-md w-full max-w-xl mx-auto pt-6">
    <div class="flex items-center gap-3">
      <button aria-label="Retour" class="p-2 -ml-2 rounded-full hover:bg-surface-container-high transition-colors flex items-center justify-center text-on-surface cursor-pointer">
        <span class="material-symbols-outlined">arrow_back</span>
      </button>
      <div>
        <h1 class="text-xl font-bold text-on-surface">Mode Hors-Ligne</h1>
        <p class="text-xs text-on-surface-variant">Passerelle USSD sans connexion internet</p>
      </div>
    </div>
    <div class="w-10 h-10 rounded-full bg-amber-500/10 text-amber-600 flex items-center justify-center font-bold">
      <span class="material-symbols-outlined text-2xl" style="font-variation-settings: 'FILL' 1;">signal_wifi_off</span>
    </div>
  </header>

  <!-- Main Content -->
  <main class="px-container-margin max-w-xl mx-auto w-full pt-2 flex flex-col gap-6">
    <!-- Status Banner -->
    <div class="bg-amber-50 border border-amber-200 rounded-3xl p-5 flex items-center gap-3.5 text-xs text-amber-900">
      <span class="material-symbols-outlined text-amber-600 text-2xl shrink-0">info</span>
      <p>Pas de connexion Internet 3G/4G ? Vous pouvez continuer à envoyer de l'argent et retirer des fonds grâce aux <b>codes courts USSD Switch</b>.</p>
    </div>

    <!-- USSD Code Generator Form -->
    <div class="bg-surface-container-lowest rounded-3xl p-6 soft-shadow border border-outline-variant flex flex-col gap-5">
      <!-- Choix Opérateur SIM -->
      <div class="flex flex-col gap-2">
        <label class="text-xs font-bold text-on-surface-variant uppercase">Votre carte SIM active</label>
        <div class="grid grid-cols-2 gap-2">
          <button type="button" onclick="selectSim('mtn')" id="sim-mtn" class="py-3 rounded-2xl border-2 border-yellow-400 bg-yellow-50/60 font-bold text-xs flex items-center justify-center gap-2">
            <span class="w-2.5 h-2.5 rounded-full bg-yellow-500"></span>
            MTN Bénin (*880#)
          </button>
          <button type="button" onclick="selectSim('moov')" id="sim-moov" class="py-3 rounded-2xl border border-outline-variant bg-surface-container font-bold text-xs text-on-surface flex items-center justify-center gap-2 opacity-70">
            <span class="w-2.5 h-2.5 rounded-full bg-blue-500"></span>
            Moov Africa (*155#)
          </button>
        </div>
      </div>

      <!-- Opération Souhaitée -->
      <div class="flex flex-col gap-2">
        <label class="text-xs font-bold text-on-surface-variant uppercase">Type d'opération</label>
        <select id="ussd-type" onchange="generateUssdCode()" class="w-full bg-surface-container border border-outline-variant rounded-2xl px-4 py-3 text-sm font-semibold focus:outline-none focus:border-primary">
          <option value="transfer">Transfert d'argent</option>
          <option value="withdraw">Retrait chez un Agent</option>
          <option value="sbee">Achat Recharge SBEE</option>
        </select>
      </div>

      <!-- Numéro Destinataire / Montant -->
      <div class="grid grid-cols-2 gap-3">
        <div class="flex flex-col gap-1.5">
          <label class="text-xs font-bold text-on-surface-variant uppercase">Numéro (8 ch.)</label>
          <input type="tel" id="ussd-phone" value="97123456" class="w-full bg-surface-container border border-outline-variant rounded-xl px-3 py-2.5 text-sm font-mono font-bold" oninput="generateUssdCode()"/>
        </div>
        <div class="flex flex-col gap-1.5">
          <label class="text-xs font-bold text-on-surface-variant uppercase">Montant (FCFA)</label>
          <input type="number" id="ussd-amt" value="5000" class="w-full bg-surface-container border border-outline-variant rounded-xl px-3 py-2.5 text-sm font-mono font-bold" oninput="generateUssdCode()"/>
        </div>
      </div>

      <!-- Generated USSD Code Box -->
      <div class="bg-surface-container rounded-2xl p-4 border border-outline-variant flex flex-col gap-1 text-center">
        <span class="text-[11px] font-bold text-on-surface-variant uppercase">Code USSD Direct à composer</span>
        <div class="text-2xl font-black font-mono text-primary tracking-wider select-all py-1" id="ussd-syntax">
          *880*1*97123456*5000#
        </div>
      </div>

      <!-- Execute Call Button -->
      <a id="btn-ussd-call" href="tel:*880*1*97123456*5000%23" class="w-full bg-primary text-on-primary font-bold py-4 rounded-full shadow-lg hover:opacity-90 active:scale-[0.98] transition-all flex items-center justify-center gap-2 text-base no-underline cursor-pointer">
        <span class="material-symbols-outlined text-xl">call</span>
        <span>Lancer l'appel USSD direct</span>
      </a>
    </div>
  </main>

  <script>
    let currentSim = 'mtn';
    function selectSim(sim) {
      currentSim = sim;
      if (sim === 'mtn') {
        document.getElementById('sim-mtn').className = 'py-3 rounded-2xl border-2 border-yellow-400 bg-yellow-50/60 font-bold text-xs flex items-center justify-center gap-2';
        document.getElementById('sim-moov').className = 'py-3 rounded-2xl border border-outline-variant bg-surface-container font-bold text-xs text-on-surface flex items-center justify-center gap-2 opacity-70';
      } else {
        document.getElementById('sim-moov').className = 'py-3 rounded-2xl border-2 border-blue-500 bg-blue-50/60 font-bold text-xs flex items-center justify-center gap-2';
        document.getElementById('sim-mtn').className = 'py-3 rounded-2xl border border-outline-variant bg-surface-container font-bold text-xs text-on-surface flex items-center justify-center gap-2 opacity-70';
      }
      generateUssdCode();
    }

    function generateUssdCode() {
      const type = document.getElementById('ussd-type').value;
      const phone = document.getElementById('ussd-phone').value || '97000000';
      const amt = document.getElementById('ussd-amt').value || '1000';
      const prefix = currentSim === 'mtn' ? '*880*' : '*155*';
      
      let syntax = '';
      if (type === 'transfer') {
        syntax = prefix + '1*' + phone + '*' + amt + '#';
      } else if (type === 'withdraw') {
        syntax = prefix + '2*' + phone + '*' + amt + '#';
      } else {
        syntax = prefix + '3*1*' + phone + '*' + amt + '#';
      }

      document.getElementById('ussd-syntax').textContent = syntax;
      document.getElementById('btn-ussd-call').href = 'tel:' + encodeURIComponent(syntax);
    }
  </script>

  <script src="../assets/switch.router.js"></script>
</body>
</html>
