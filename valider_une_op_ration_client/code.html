<!DOCTYPE html>

<html class="light" lang="fr"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Valider une opération</title>
<!-- Google Fonts & Icons -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>

<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link rel="stylesheet" href="../assets/switch.css">
<script src="../assets/switch.config.js"></script>
<!-- Tailwind Config -->

<style>
        body { font-family: 'Hanken Grotesk', sans-serif; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        .icon-fill { font-variation-settings: 'FILL' 1; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface min-h-screen flex flex-col pb-32">
<!-- TopAppBar -->
<header class="w-full top-0 sticky bg-surface flex items-center justify-between px-gutter py-4 max-w-7xl mx-auto z-40">
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-full overflow-hidden border-2 border-primary/20">
<img alt="Agent Profile Picture" class="w-full h-full object-cover" data-alt="A professional headshot of a West African financial agent looking friendly and confident, brightly lit against a neutral background." src="../assets/images/img_055.jpg"/>
</div>
<h1 class="font-headline-md text-headline-md font-bold text-primary">Espace Agent</h1>
</div>
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-variant transition-colors text-on-surface-variant">
<span class="material-symbols-outlined">notifications</span>
</button>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow w-full max-w-md mx-auto px-4 flex flex-col items-center pt-2 gap-stack-lg">
<!-- Header Section -->
<div class="text-center w-full flex flex-col items-center gap-2">
<h2 class="font-display-lg-mobile text-display-lg-mobile text-on-surface">Valider une opération</h2>
<p class="font-body-lg text-body-lg text-on-surface-variant">Saisissez le code client à 6 chiffres</p>
</div>
<!-- Secondary Action: Scan QR -->
<button class="flex items-center gap-2 px-6 py-2 rounded-full bg-surface-container hover:bg-surface-container-high transition-colors text-primary font-headline-sm text-headline-sm border border-outline-variant/30">
<span class="material-symbols-outlined">qr_code_scanner</span>
            Scanner un QR Code
        </button>
<!-- 6-Digit OTP Input -->
<div class="flex justify-center gap-otp-gap w-full">
<!-- Filled State Mockup -->
<div class="w-[48px] h-[56px] border border-outline-variant rounded-lg flex items-center justify-center font-otp-display text-otp-display text-on-surface bg-surface-container-lowest">7</div>
<div class="w-[48px] h-[56px] border border-outline-variant rounded-lg flex items-center justify-center font-otp-display text-otp-display text-on-surface bg-surface-container-lowest">4</div>
<div class="w-[48px] h-[56px] border border-outline-variant rounded-lg flex items-center justify-center font-otp-display text-otp-display text-on-surface bg-surface-container-lowest">2</div>
<div class="w-[48px] h-[56px] border border-outline-variant rounded-lg flex items-center justify-center font-otp-display text-otp-display text-on-surface bg-surface-container-lowest">9</div>
<div class="w-[48px] h-[56px] border border-outline-variant rounded-lg flex items-center justify-center font-otp-display text-otp-display text-on-surface bg-surface-container-lowest">1</div>
<!-- Active State Mockup -->
<div class="w-[48px] h-[56px] border-2 border-primary rounded-lg flex items-center justify-center font-otp-display text-otp-display text-on-surface bg-surface-container-lowest shadow-[0_0_12px_rgba(94,59,220,0.15)] relative">
<span class="w-[2px] h-6 bg-primary animate-pulse absolute"></span>
</div>
</div>
<!-- Transaction Summary (Mocked visible after entry) -->
<div class="w-full bg-surface-container-lowest rounded-xl p-card-padding shadow-md shadow-black/5 border border-outline-variant/30 flex flex-col gap-4 animate-[fadeIn_0.3s_ease-out]">
<div class="flex justify-between items-start">
<div class="flex items-center gap-2">
<div class="w-10 h-10 rounded-full bg-error-container text-error flex items-center justify-center">
<span class="material-symbols-outlined icon-fill">arrow_downward</span>
</div>
<div>
<p class="font-body-sm text-body-sm text-on-surface-variant">Type d'opération</p>
<p class="font-headline-sm text-headline-sm text-on-surface">Retrait Espèces</p>
</div>
</div>
<div class="px-3 py-1 rounded-full bg-surface-container-high border border-outline-variant/50">
<span class="font-label-caps text-label-caps text-on-surface-variant">En attente</span>
</div>
</div>
<div class="h-px w-full bg-outline-variant/30"></div>
<div class="flex justify-between items-center">
<p class="font-body-lg text-body-lg text-on-surface-variant">Client</p>
<div class="flex items-center gap-1">
<span class="font-headline-sm text-headline-sm text-on-surface">Koffi M.</span>
<span class="material-symbols-outlined text-[18px] text-liquidity-high icon-fill" title="Identité vérifiée">verified</span>
</div>
</div>
<div class="flex justify-between items-center">
<p class="font-body-lg text-body-lg text-on-surface-variant">Montant</p>
<p class="font-display-lg-mobile text-display-lg-mobile text-on-surface">10 000 <span class="font-headline-sm text-headline-sm text-on-surface-variant">FCFA</span></p>
</div>
<!-- Primary Action -->
<button class="w-full mt-2 bg-primary text-on-primary py-4 rounded-full font-headline-sm text-headline-sm flex justify-center items-center gap-2 hover:bg-primary/90 transition-colors shadow-lg shadow-primary/20 active:scale-95 duration-150">
<span class="material-symbols-outlined">check_circle</span>
                Confirmer l'opération
            </button>
</div>
<!-- Numeric Keypad -->
<div class="w-full grid grid-cols-3 gap-y-4 gap-x-6 mt-auto px-4 pb-6">
<button class="h-16 rounded-2xl bg-surface-container-lowest border border-outline-variant/20 shadow-sm flex flex-col items-center justify-center font-display-lg-mobile text-display-lg-mobile text-on-surface active:bg-surface-variant active:scale-95 transition-all">1</button>
<button class="h-16 rounded-2xl bg-surface-container-lowest border border-outline-variant/20 shadow-sm flex flex-col items-center justify-center font-display-lg-mobile text-display-lg-mobile text-on-surface active:bg-surface-variant active:scale-95 transition-all">2<span class="font-label-caps text-label-caps text-on-surface-variant/50 -mt-1">ABC</span></button>
<button class="h-16 rounded-2xl bg-surface-container-lowest border border-outline-variant/20 shadow-sm flex flex-col items-center justify-center font-display-lg-mobile text-display-lg-mobile text-on-surface active:bg-surface-variant active:scale-95 transition-all">3<span class="font-label-caps text-label-caps text-on-surface-variant/50 -mt-1">DEF</span></button>
<button class="h-16 rounded-2xl bg-surface-container-lowest border border-outline-variant/20 shadow-sm flex flex-col items-center justify-center font-display-lg-mobile text-display-lg-mobile text-on-surface active:bg-surface-variant active:scale-95 transition-all">4<span class="font-label-caps text-label-caps text-on-surface-variant/50 -mt-1">GHI</span></button>
<button class="h-16 rounded-2xl bg-surface-container-lowest border border-outline-variant/20 shadow-sm flex flex-col items-center justify-center font-display-lg-mobile text-display-lg-mobile text-on-surface active:bg-surface-variant active:scale-95 transition-all">5<span class="font-label-caps text-label-caps text-on-surface-variant/50 -mt-1">JKL</span></button>
<button class="h-16 rounded-2xl bg-surface-container-lowest border border-outline-variant/20 shadow-sm flex flex-col items-center justify-center font-display-lg-mobile text-display-lg-mobile text-on-surface active:bg-surface-variant active:scale-95 transition-all">6<span class="font-label-caps text-label-caps text-on-surface-variant/50 -mt-1">MNO</span></button>
<button class="h-16 rounded-2xl bg-surface-container-lowest border border-outline-variant/20 shadow-sm flex flex-col items-center justify-center font-display-lg-mobile text-display-lg-mobile text-on-surface active:bg-surface-variant active:scale-95 transition-all">7<span class="font-label-caps text-label-caps text-on-surface-variant/50 -mt-1">PQRS</span></button>
<button class="h-16 rounded-2xl bg-surface-container-lowest border border-outline-variant/20 shadow-sm flex flex-col items-center justify-center font-display-lg-mobile text-display-lg-mobile text-on-surface active:bg-surface-variant active:scale-95 transition-all">8<span class="font-label-caps text-label-caps text-on-surface-variant/50 -mt-1">TUV</span></button>
<button class="h-16 rounded-2xl bg-surface-container-lowest border border-outline-variant/20 shadow-sm flex flex-col items-center justify-center font-display-lg-mobile text-display-lg-mobile text-on-surface active:bg-surface-variant active:scale-95 transition-all">9<span class="font-label-caps text-label-caps text-on-surface-variant/50 -mt-1">WXYZ</span></button>
<div></div>
<button class="h-16 rounded-2xl bg-surface-container-lowest border border-outline-variant/20 shadow-sm flex items-center justify-center font-display-lg-mobile text-display-lg-mobile text-on-surface active:bg-surface-variant active:scale-95 transition-all">0</button>
<button class="h-16 rounded-2xl flex items-center justify-center text-on-surface-variant active:bg-surface-variant active:scale-95 transition-all">
<span class="material-symbols-outlined text-[32px]">backspace</span>
</button>
</div>
</main>
<!-- BottomNavBar (Scanner Active) -->

<style>
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
<script src="../assets/switch.forms.js"></script>
<script src="../assets/switch.router.js"></script>
</body></html>
