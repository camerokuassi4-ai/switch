<!DOCTYPE html>
<html class="light" lang="fr">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Créer une Carte Virtuelle - Switch Bénin</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link rel="stylesheet" href="../assets/switch.css">
  <script src="../assets/switch.config.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700;900&display=swap');
    body { font-family: 'Hanken Grotesk', sans-serif; min-height: max(884px, 100dvh); }
    .card-preview-purple { background: linear-gradient(135deg, #7B5CFA 0%, #5E3BDC 50%, #2A1175 100%); }
    .card-preview-black { background: linear-gradient(135deg, #2A2A2E 0%, #17161A 50%, #000000 100%); }
    .card-preview-gold { background: linear-gradient(135deg, #D4AF37 0%, #AA7C11 50%, #5B4002 100%); }
    .card-preview-emerald { background: linear-gradient(135deg, #10B981 0%, #059669 50%, #064E3B 100%); }
  </style>
</head>
<body class="bg-background text-on-background min-h-screen pb-32 flex flex-col antialiased">
  <!-- TopAppBar -->
  <header class="flex items-center justify-between px-container-margin py-stack-md w-full max-w-xl mx-auto pt-6">
    <div class="flex items-center gap-3">
      <button aria-label="Retour" onclick="window.history.back()" class="p-2 -ml-2 rounded-full hover:bg-surface-container-high transition-colors flex items-center justify-center text-on-surface cursor-pointer">
        <span class="material-symbols-outlined">arrow_back</span>
      </button>
      <div>
        <h1 class="text-xl font-bold text-on-surface">Nouvelle Carte Virtuelle</h1>
        <p class="text-xs text-on-surface-variant">Visa Internationale sécurisée 3D-Secure</p>
      </div>
    </div>
    <span class="text-xs font-bold text-primary bg-primary/10 px-3 py-1 rounded-full">Instantané</span>
  </header>

  <!-- Main Content -->
  <main class="px-container-margin max-w-xl mx-auto w-full pt-2 flex flex-col gap-6">

    <!-- Live Card Visual Preview -->
    <div id="card-preview" class="card-preview-purple rounded-3xl p-6 text-white shadow-2xl flex flex-col justify-between min-h-[210px] relative overflow-hidden transition-all duration-300">
      <div class="flex justify-between items-start">
        <div>
          <span class="text-[11px] font-bold text-white/80 uppercase tracking-wider block" id="preview-label">Achats en ligne</span>
          <span class="text-xs font-semibold text-white/90" id="preview-type">Carte Multi-usage</span>
        </div>
        <span class="material-symbols-outlined text-3xl opacity-90">contactless</span>
      </div>

      <div class="my-2">
        <span class="text-xl sm:text-2xl font-mono font-bold tracking-widest block">4289 •••• •••• 7719</span>
        <div class="flex gap-4 mt-2 text-xs text-white/80">
          <span>EXP: <b>08/28</b></span>
          <span>CVV: <b>•••</b></span>
        </div>
      </div>

      <div class="flex justify-between items-end">
        <span class="text-xs font-bold uppercase tracking-wider text-white">ADELE DOE</span>
        <span class="text-xl font-black italic tracking-wider">VISA</span>
      </div>
    </div>

    <!-- Step 1: Type de Carte -->
    <div class="bg-surface-container-lowest rounded-3xl p-5 border border-outline-variant flex flex-col gap-3">
      <label class="text-xs font-bold text-on-surface-variant uppercase">1. Usage de la carte</label>
      
      <div class="grid grid-cols-2 gap-3">
        <button type="button" onclick="selectCardType('standard')" id="type-standard" class="p-3.5 rounded-2xl border-2 border-primary bg-primary/5 text-left flex flex-col gap-1 cursor-pointer transition-all">
          <span class="text-xs font-bold text-primary flex items-center gap-1">
            <span class="material-symbols-outlined text-sm">credit_card</span>
            <span>Multi-usage</span>
          </span>
          <p class="text-[10px] text-on-surface-variant">Abonnements (Netflix, Spotify) et achats fréquents.</p>
        </button>

        <button type="button" onclick="selectCardType('ephemeral')" id="type-ephemeral" class="p-3.5 rounded-2xl border border-outline-variant bg-surface-container text-left flex flex-col gap-1 cursor-pointer transition-all opacity-70">
          <span class="text-xs font-bold text-on-surface flex items-center gap-1">
            <span class="material-symbols-outlined text-sm">bolt</span>
            <span>Éphémère</span>
          </span>
          <p class="text-[10px] text-on-surface-variant">Usage unique. Se détruit après le paiement.</p>
        </button>
      </div>
    </div>

    <!-- Step 2: Nom & Thème Visuel -->
    <div class="bg-surface-container-lowest rounded-3xl p-5 border border-outline-variant flex flex-col gap-4">
      <label class="text-xs font-bold text-on-surface-variant uppercase">2. Personnalisation & Thème</label>

      <div class="flex flex-col gap-1.5">
        <label class="text-xs text-on-surface-variant font-bold" for="card-label-input">Nom de la carte</label>
        <input type="text" id="card-label-input" oninput="updateCardLabel(this.value)" value="Achats en ligne" placeholder="Ex: Voyages, Netflix, Pubs Facebook" class="w-full bg-surface-container border border-outline-variant rounded-2xl px-4 py-3 text-sm font-bold focus:outline-none focus:border-primary"/>
      </div>

      <div class="flex flex-col gap-2">
        <span class="text-xs text-on-surface-variant font-bold">Couleur de la carte</span>
        <div class="flex gap-3">
          <button type="button" onclick="setTheme('purple')" class="w-10 h-10 rounded-full card-preview-purple border-2 border-white shadow-md cursor-pointer hover:scale-110 transition-transform"></button>
          <button type="button" onclick="setTheme('black')" class="w-10 h-10 rounded-full card-preview-black border-2 border-white shadow-md cursor-pointer hover:scale-110 transition-transform"></button>
          <button type="button" onclick="setTheme('gold')" class="w-10 h-10 rounded-full card-preview-gold border-2 border-white shadow-md cursor-pointer hover:scale-110 transition-transform"></button>
          <button type="button" onclick="setTheme('emerald')" class="w-10 h-10 rounded-full card-preview-emerald border-2 border-white shadow-md cursor-pointer hover:scale-110 transition-transform"></button>
        </div>
      </div>
    </div>

    <!-- Step 3: Montant de recharge initiale -->
    <div class="bg-surface-container-lowest rounded-3xl p-5 border border-outline-variant flex flex-col gap-3">
      <label class="text-xs font-bold text-on-surface-variant uppercase">3. Dépôt initial sur la carte</label>
      <div class="flex items-center justify-between p-3.5 bg-surface-container rounded-2xl">
        <span class="text-xs font-bold text-on-surface">Montant à créditer :</span>
        <div class="flex items-center gap-1">
          <input type="number" id="init-amount" value="5000" class="w-24 bg-transparent border-none text-right font-mono font-black text-sm text-primary focus:ring-0 p-0"/>
          <span class="text-xs font-bold text-on-surface-variant">FCFA</span>
        </div>
      </div>
      <p class="text-[11px] text-on-surface-variant">Frais de création : <b>1 000 FCFA</b> débités de votre solde principal.</p>
    </div>

    <!-- Submit Button -->
    <button onclick="createCardSubmit()" class="w-full bg-primary text-on-primary font-bold py-4 rounded-full shadow-lg hover:opacity-90 active:scale-[0.98] transition-all flex items-center justify-center gap-2 text-base cursor-pointer">
      <span class="material-symbols-outlined text-xl">credit_card</span>
      <span>Créer ma Carte Virtuelle (1 000 F)</span>
    </button>
  </main>

  <script>
    let currentTheme = 'purple';
    let currentType = 'standard';

    function selectCardType(type) {
      currentType = type;
      const bStd = document.getElementById('type-standard');
      const bEph = document.getElementById('type-ephemeral');
      const pType = document.getElementById('preview-type');

      if (type === 'standard') {
        bStd.className = 'p-3.5 rounded-2xl border-2 border-primary bg-primary/5 text-left flex flex-col gap-1 cursor-pointer transition-all';
        bEph.className = 'p-3.5 rounded-2xl border border-outline-variant bg-surface-container text-left flex flex-col gap-1 cursor-pointer transition-all opacity-70';
        pType.textContent = 'Carte Multi-usage';
      } else {
        bStd.className = 'p-3.5 rounded-2xl border border-outline-variant bg-surface-container text-left flex flex-col gap-1 cursor-pointer transition-all opacity-70';
        bEph.className = 'p-3.5 rounded-2xl border-2 border-primary bg-primary/5 text-left flex flex-col gap-1 cursor-pointer transition-all';
        pType.textContent = 'Carte Éphémère (Usage unique)';
      }
    }

    function updateCardLabel(val) {
      document.getElementById('preview-label').textContent = val || 'Ma Carte Virtuelle';
    }

    function setTheme(theme) {
      currentTheme = theme;
      const preview = document.getElementById('card-preview');
      preview.className = `card-preview-${theme} rounded-3xl p-6 text-white shadow-2xl flex flex-col justify-between min-h-[210px] relative overflow-hidden transition-all duration-300`;
    }

    function createCardSubmit() {
      alert("Félicitations ! Votre nouvelle Carte Virtuelle Visa Switch est active et prête pour vos achats en ligne !");
      if (window.switchNavigate) {
        window.switchNavigate('../achats_en_ligne_cartes_virtuelles/code.html');
      } else {
        window.location.href = '../achats_en_ligne_cartes_virtuelles/code.html';
      }
    }
  </script>

  <script src="../assets/switch.router.js"></script>
</body>
</html>
