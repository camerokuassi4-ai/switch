<!DOCTYPE html>
<html class="light" lang="fr">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Caisse Express POS - Switch Business</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link rel="stylesheet" href="../assets/switch.css">
  <script src="../assets/switch.config.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700;900&display=swap');
    body { font-family: 'Hanken Grotesk', sans-serif; min-height: max(884px, 100dvh); }
    .keypad-btn { transition: all 0.1s ease; }
    .keypad-btn:active { transform: scale(0.95); background-color: #ECE6F0; }
  </style>
</head>
<body class="bg-background text-on-background min-h-screen pb-12 flex flex-col antialiased">
  <!-- TopAppBar -->
  <header class="flex items-center justify-between px-container-margin py-stack-md w-full max-w-lg mx-auto pt-6">
    <div class="flex items-center gap-3">
      <button aria-label="Retour" class="p-2 -ml-2 rounded-full hover:bg-surface-container-high transition-colors flex items-center justify-center text-on-surface cursor-pointer">
        <span class="material-symbols-outlined">arrow_back</span>
      </button>
      <div>
        <h1 class="text-xl font-bold text-on-surface">Caisse Express</h1>
        <p class="text-xs text-on-surface-variant">Boutique Principale • Caisse #1</p>
      </div>
    </div>
    <span class="bg-green-100 text-green-800 font-bold text-xs px-3 py-1 rounded-full flex items-center gap-1.5">
      <span class="w-2 h-2 rounded-full bg-green-600 animate-pulse"></span>
      Caisse Ouverte
    </span>
  </header>

  <!-- POS Main Interface -->
  <main class="px-container-margin max-w-lg mx-auto w-full pt-2 flex flex-col gap-4 flex-1">
    <!-- Amount Display -->
    <div class="bg-surface-container-lowest rounded-3xl p-6 border border-outline-variant shadow-sm flex flex-col items-center justify-center text-center">
      <span class="text-xs text-on-surface-variant font-bold uppercase tracking-wider">Montant à Encaisser</span>
      <div class="text-4xl sm:text-5xl font-black font-mono text-primary mt-2 flex items-baseline justify-center gap-2">
        <span id="pos-amount">0</span>
        <span class="text-xl font-bold text-on-surface-variant">FCFA</span>
      </div>
    </div>

    <!-- Mode de règlement boutons -->
    <div class="grid grid-cols-3 gap-2">
      <button type="button" onclick="selectPayMode('qr')" id="mode-qr" class="py-2.5 rounded-2xl bg-primary text-on-primary font-bold text-xs flex items-center justify-center gap-1.5 shadow-sm">
        <span class="material-symbols-outlined text-base">qr_code_scanner</span>
        <span>QR Client</span>
      </button>
      <button type="button" onclick="selectPayMode('cash')" id="mode-cash" class="py-2.5 rounded-2xl bg-surface-container text-on-surface font-bold text-xs flex items-center justify-center gap-1.5">
        <span class="material-symbols-outlined text-base">payments</span>
        <span>Espèces</span>
      </button>
      <button type="button" onclick="selectPayMode('momo')" id="mode-momo" class="py-2.5 rounded-2xl bg-surface-container text-on-surface font-bold text-xs flex items-center justify-center gap-1.5">
        <span class="material-symbols-outlined text-base">smartphone</span>
        <span>Mobile Money</span>
      </button>
    </div>

    <!-- Numerical Keypad -->
    <div class="grid grid-cols-3 gap-2.5 bg-surface-container-lowest rounded-3xl p-4 border border-outline-variant shadow-sm flex-1">
      <button type="button" onclick="pressDigit('1')" class="keypad-btn h-14 sm:h-16 rounded-2xl bg-surface-container text-2xl font-bold font-mono text-on-surface flex items-center justify-center">1</button>
      <button type="button" onclick="pressDigit('2')" class="keypad-btn h-14 sm:h-16 rounded-2xl bg-surface-container text-2xl font-bold font-mono text-on-surface flex items-center justify-center">2</button>
      <button type="button" onclick="pressDigit('3')" class="keypad-btn h-14 sm:h-16 rounded-2xl bg-surface-container text-2xl font-bold font-mono text-on-surface flex items-center justify-center">3</button>
      
      <button type="button" onclick="pressDigit('4')" class="keypad-btn h-14 sm:h-16 rounded-2xl bg-surface-container text-2xl font-bold font-mono text-on-surface flex items-center justify-center">4</button>
      <button type="button" onclick="pressDigit('5')" class="keypad-btn h-14 sm:h-16 rounded-2xl bg-surface-container text-2xl font-bold font-mono text-on-surface flex items-center justify-center">5</button>
      <button type="button" onclick="pressDigit('6')" class="keypad-btn h-14 sm:h-16 rounded-2xl bg-surface-container text-2xl font-bold font-mono text-on-surface flex items-center justify-center">6</button>
      
      <button type="button" onclick="pressDigit('7')" class="keypad-btn h-14 sm:h-16 rounded-2xl bg-surface-container text-2xl font-bold font-mono text-on-surface flex items-center justify-center">7</button>
      <button type="button" onclick="pressDigit('8')" class="keypad-btn h-14 sm:h-16 rounded-2xl bg-surface-container text-2xl font-bold font-mono text-on-surface flex items-center justify-center">8</button>
      <button type="button" onclick="pressDigit('9')" class="keypad-btn h-14 sm:h-16 rounded-2xl bg-surface-container text-2xl font-bold font-mono text-on-surface flex items-center justify-center">9</button>
      
      <button type="button" onclick="clearPos()" class="keypad-btn h-14 sm:h-16 rounded-2xl bg-red-50 text-red-600 text-sm font-bold flex items-center justify-center">C</button>
      <button type="button" onclick="pressDigit('0')" class="keypad-btn h-14 sm:h-16 rounded-2xl bg-surface-container text-2xl font-bold font-mono text-on-surface flex items-center justify-center">0</button>
      <button type="button" onclick="pressDigit('00')" class="keypad-btn h-14 sm:h-16 rounded-2xl bg-surface-container text-lg font-bold font-mono text-on-surface flex items-center justify-center">00</button>
    </div>

    <!-- Validation Button -->
    <button onclick="processCharge()" class="w-full bg-primary text-on-primary font-bold py-4 rounded-full shadow-lg hover:opacity-90 active:scale-[0.98] transition-all flex items-center justify-center gap-2 text-base cursor-pointer">
      <span class="material-symbols-outlined text-xl">check_circle</span>
      <span>Valider l'encaissement</span>
    </button>
  </main>

  <!-- Modal Ticket / Encaissement Réussi -->
  <div id="receipt-modal" class="fixed inset-0 bg-black/60 z-50 backdrop-blur-sm hidden flex items-center justify-center p-4">
    <div class="bg-surface-container-lowest w-full max-w-sm rounded-3xl p-6 flex flex-col gap-4 text-center shadow-2xl animate-in fade-in zoom-in-95 duration-200">
      <div class="w-16 h-16 rounded-full bg-green-500/10 text-green-600 flex items-center justify-center mx-auto">
        <span class="material-symbols-outlined text-3xl">point_of_sale</span>
      </div>
      <div>
        <h3 class="text-xl font-bold text-on-surface">Vente Encaissée !</h3>
        <p class="text-xs text-on-surface-variant mt-1">Ticket de caisse électronique généré.</p>
      </div>

      <div class="bg-surface-container p-4 rounded-2xl border border-outline-variant text-left text-xs flex flex-col gap-2 font-mono">
        <div class="flex justify-between"><span>Montant :</span><b class="text-primary text-base" id="modal-pos-amt">0 FCFA</b></div>
        <div class="flex justify-between"><span>Mode :</span><b class="text-on-surface" id="modal-pos-mode">QR Switch</b></div>
        <div class="flex justify-between"><span>Date :</span><b class="text-on-surface">24/08/2026 22:50</b></div>
        <div class="flex justify-between"><span>Ticket N° :</span><b class="text-on-surface">#TK-88912</b></div>
      </div>

      <div class="flex gap-2 mt-2">
        <button onclick="window.switchNavigate('../recu_transaction_partage/code.html')" class="flex-1 py-3 rounded-full border border-outline-variant font-semibold text-xs hover:bg-surface-container flex items-center justify-center gap-1 cursor-pointer">
          <span class="material-symbols-outlined text-base">receipt</span>
          Reçu WhatsApp
        </button>
        <button onclick="closeReceiptModal()" class="flex-1 py-3 rounded-full bg-primary text-on-primary font-semibold text-xs hover:opacity-90 active:scale-95 transition-all shadow-md cursor-pointer">
          Nouvelle Vente
        </button>
      </div>
    </div>
  </div>

  <script>
    let posAmount = '0';
    let currentMode = 'QR Client';

    function pressDigit(d) {
      if (posAmount === '0') {
        posAmount = d;
      } else {
        if (posAmount.length < 9) posAmount += d;
      }
      updatePosDisplay();
    }

    function clearPos() {
      posAmount = '0';
      updatePosDisplay();
    }

    function updatePosDisplay() {
      const formatted = parseInt(posAmount).toLocaleString('fr-FR');
      document.getElementById('pos-amount').textContent = formatted;
    }

    function selectPayMode(mode) {
      document.getElementById('mode-qr').className = 'py-2.5 rounded-2xl bg-surface-container text-on-surface font-bold text-xs flex items-center justify-center gap-1.5';
      document.getElementById('mode-cash').className = 'py-2.5 rounded-2xl bg-surface-container text-on-surface font-bold text-xs flex items-center justify-center gap-1.5';
      document.getElementById('mode-momo').className = 'py-2.5 rounded-2xl bg-surface-container text-on-surface font-bold text-xs flex items-center justify-center gap-1.5';

      if (mode === 'qr') {
        document.getElementById('mode-qr').className = 'py-2.5 rounded-2xl bg-primary text-on-primary font-bold text-xs flex items-center justify-center gap-1.5 shadow-sm';
        currentMode = 'QR Switch';
      } else if (mode === 'cash') {
        document.getElementById('mode-cash').className = 'py-2.5 rounded-2xl bg-primary text-on-primary font-bold text-xs flex items-center justify-center gap-1.5 shadow-sm';
        currentMode = 'Espèces';
      } else {
        document.getElementById('mode-momo').className = 'py-2.5 rounded-2xl bg-primary text-on-primary font-bold text-xs flex items-center justify-center gap-1.5 shadow-sm';
        currentMode = 'Mobile Money';
      }
    }

    function processCharge() {
      if (parseInt(posAmount) <= 0) {
        alert('Veuillez saisir un montant à encaisser.');
        return;
      }
      document.getElementById('modal-pos-amt').textContent = parseInt(posAmount).toLocaleString('fr-FR') + ' FCFA';
      document.getElementById('modal-pos-mode').textContent = currentMode;
      document.getElementById('receipt-modal').classList.remove('hidden');
    }

    function closeReceiptModal() {
      document.getElementById('receipt-modal').classList.add('hidden');
      clearPos();
    }
  </script>

  <script src="../assets/switch.router.js"></script>
</body>
</html>
