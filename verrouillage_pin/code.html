<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined.fill {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        
        /* Subtle animation for PIN dots */
        @keyframes pulseDot {
            0% { transform: scale(1); opacity: 0.2; }

        }

                Mot de passe oublié ?

</main>
<script>
        // Simple script to handle visual feedback on keypad press (for demonstration)
        document.addEventListener('DOMContentLoaded', () => {
            const keypadButtons = document.querySelectorAll('.grid button');
            const dots = document.querySelectorAll('.pin-dot');
            let currentPinLength = 2; // Starting with 2 dots filled as per HTML state

            keypadButtons.forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const icon = btn.querySelector('.material-symbols-outlined');
                    
                    if (icon && icon.textContent === 'backspace') {
                        if (currentPinLength > 0) {
                            currentPinLength--;
                            dots[currentPinLength].classList.remove('active', 'bg-primary');
                            dots[currentPinLength].classList.add('bg-outline-variant');
                        }
                    } else if (icon && icon.textContent === 'fingerprint') {
                        // Biometric trigger logic would go here
                        btn.classList.add('text-primary');
                        setTimeout(() => btn.classList.remove('text-primary'), 300);
                    } else {
                        // Number pressed
                        if (currentPinLength < 4) {
                            dots[currentPinLength].classList.remove('bg-outline-variant');
                            dots[currentPinLength].classList.add('active', 'bg-primary');
                            currentPinLength++;
                            
                            // Navigate instantly when 4 digits entered
                            if (currentPinLength === 4) {
                                window.location.href = '../tableau_de_bord_mis_jour/code.html';
                            }
                        }
                    }
                });
            });
        });
    </script>
<script src="../assets/switch.forms.js"></script>
