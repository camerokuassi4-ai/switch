<!DOCTYPE html>

<html class="light" lang="fr"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Détail Transaction</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link rel="stylesheet" href="../assets/switch.css">
<script src="../assets/switch.config.js"></script>

<style>
        body { font-family: 'Hanken Grotesk', sans-serif; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        
        /* Receipt wavy edge effect */
        .receipt-edge {
            position: relative;
            background: #ffffff;
        }
        .receipt-edge::after {
            content: "";
            position: absolute;
            left: 0;
            right: 0;
            bottom: -8px;
            height: 16px;
            background-size: 16px 16px;
            background-image: radial-gradient(circle at 8px 0, transparent 8px, #ffffff 9px);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-[#F8F9FA] text-on-surface min-h-screen pb-stack-lg">
<!-- Top Navigation (Transactional, no shell navs) -->
<header class="flex justify-between items-center px-container-margin py-stack-md w-full sticky top-0 bg-[#F8F9FA]/90 backdrop-blur-md z-40">
<button aria-label="Retour" class="w-10 h-10 rounded-full bg-surface-container flex items-center justify-center text-on-surface hover:bg-surface-variant transition-colors">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md font-bold">Détail</h1>
<div class="w-10 h-10"></div> <!-- Spacer for centering -->
</header>
<main class="px-container-margin mt-stack-md max-w-md mx-auto">
<!-- Receipt Card -->
<div class="receipt-edge rounded-t-3xl rounded-b-sm shadow-ambient-1 p-card-padding mb-stack-lg relative overflow-hidden">
<!-- Amount Section -->
<div class="text-center mb-stack-lg flex flex-col items-center">
<!-- Status Badge -->
<div class="inline-flex items-center gap-2 bg-[#E8F8F0] text-[#198754] px-3 py-1.5 rounded-full mb-4">
<span class="material-symbols-outlined text-[16px]">check_circle</span>
<span class="font-label-caps text-label-caps uppercase tracking-wider">Réussi</span>
</div>
<h2 class="font-body-sm text-on-surface-variant mb-1">Montant envoyé</h2>
<div class="font-display-lg-mobile md:font-display-lg text-on-surface">
                    - 15 000 FCFA
                </div>
<div class="font-body-sm text-on-surface-variant mt-1">À Jean Dupont</div>
</div>
<!-- Divider -->
<div class="border-t border-dashed border-outline-variant/50 my-6 relative">
<!-- Cutout circles -->
<div class="absolute w-6 h-6 bg-[#F8F9FA] rounded-full -left-[36px] -top-3"></div>
<div class="absolute w-6 h-6 bg-[#F8F9FA] rounded-full -right-[36px] -top-3"></div>
</div>
<!-- Transaction Details -->
<div class="space-y-4">
<div class="flex justify-between items-center py-2">
<span class="font-body-sm text-on-surface-variant">Date et Heure</span>
<span class="font-body-sm text-on-surface font-semibold">24 Oct 2023, 14:32</span>
</div>
<div class="flex justify-between items-center py-2">
<span class="font-body-sm text-on-surface-variant">Référence</span>
<div class="flex items-center gap-2">
<span class="font-body-sm text-on-surface font-semibold">TRX-9824-MLK</span>
<button aria-label="Copier la référence" class="text-primary hover:text-primary-container transition-colors">
<span class="material-symbols-outlined text-[16px]" style="font-variation-settings: 'FILL' 0;">content_copy</span>
</button>
</div>
</div>
<div class="flex justify-between items-center py-2">
<span class="font-body-sm text-on-surface-variant">Source</span>
<div class="flex items-center gap-2">
<div class="w-6 h-6 rounded-full bg-[#FFCC00] flex items-center justify-center overflow-hidden flex-shrink-0">
<!-- Placeholder for MTN Logo -->
<span class="font-label-caps text-[8px] text-black font-bold">MTN</span>
</div>
<span class="font-body-sm text-on-surface font-semibold">MoMo Principal</span>
</div>
</div>
<div class="flex justify-between items-center py-2">
<span class="font-body-sm text-on-surface-variant">Destination</span>
<div class="flex items-center gap-2">
<div class="w-6 h-6 rounded-full bg-surface-container flex items-center justify-center overflow-hidden flex-shrink-0">
<span class="material-symbols-outlined text-[14px] text-primary">person</span>
</div>
<span class="font-body-sm text-on-surface font-semibold">Jean Dupont</span>
</div>
</div>
<div class="flex justify-between items-center py-2">
<span class="font-body-sm text-on-surface-variant">Frais de réseau</span>
<span class="font-body-sm text-on-surface font-semibold">150 FCFA</span>
</div>
</div>
<!-- Total with fees -->
<div class="mt-4 p-4 bg-surface-container-low rounded-xl flex justify-between items-center border border-outline-variant/30">
<span class="font-body-sm text-on-surface-variant">Total débité</span>
<span class="font-headline-md text-on-surface font-bold">15 150 FCFA</span>
</div>
</div>
<!-- Action Buttons -->
<div class="space-y-4 mt-8">
<button class="w-full bg-primary text-on-primary font-body-lg font-semibold py-4 rounded-xl flex items-center justify-center gap-2 shadow-ambient-1 hover:bg-primary-container transition-all active:scale-[0.98]">
<span class="material-symbols-outlined">share</span>
                Partager le reçu
            </button>
<button class="w-full bg-surface text-primary border border-outline-variant/50 font-body-lg font-semibold py-4 rounded-xl flex items-center justify-center gap-2 hover:bg-surface-container transition-all active:scale-[0.98]">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">report_problem</span>
                Signaler un problème
            </button>
</div>
</main>
<script src="../assets/switch.router.js"></script>
</body></html>
