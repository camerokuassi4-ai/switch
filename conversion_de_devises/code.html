<!DOCTYPE html>
<html class="light" lang="fr">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Convertisseur de Devises - Switch Bénin</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link rel="stylesheet" href="../assets/switch.css">
  <script src="../assets/switch.config.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800;900&display=swap');
    body { font-family: 'Hanken Grotesk', sans-serif; min-height: max(884px, 100dvh); background-color: #F8F9FD; color: #1C1A24; }
    .shadow-level-1 { box-shadow: 0 10px 20px rgba(0, 0, 0, 0.04); }
  </style>
</head>
<body class="bg-[#F8F9FD] text-on-surface antialiased flex flex-col min-h-screen pb-24">
  
  <!-- Top App Bar -->
  <header class="w-full max-w-md mx-auto px-container-margin pt-5 pb-3 flex items-center justify-between z-30 sticky top-0 bg-[#F8F9FD]/90 backdrop-blur-md">
    <button aria-label="Retour" onclick="window.history.back()" class="w-10 h-10 rounded-full bg-white border border-outline-variant/40 shadow-sm flex items-center justify-center text-on-surface hover:bg-surface-container transition-colors cursor-pointer">
      <span class="material-symbols-outlined text-xl">arrow_back</span>
    </button>
    <div class="text-center">
      <h1 class="text-base sm:text-lg font-black text-on-surface">Convertisseur de Devises</h1>
      <p class="text-[11px] text-on-surface-variant font-medium">Taux Officiels BCEAO en Direct</p>
    </div>
    <div class="w-10"></div>
  </header>

  <!-- Main Content Canvas -->
  <main class="flex-1 px-container-margin pb-stack-lg flex flex-col gap-4 max-w-md mx-auto w-full pt-1">
    
    <!-- Conversion Form Area -->
    <div class="bg-white rounded-3xl p-5 shadow-sm border border-outline-variant/40 relative">
      
      <!-- Source Currency Input -->
      <div class="mb-4 relative">
        <div class="flex justify-between items-center mb-1.5">
          <label class="text-xs font-bold text-on-surface-variant uppercase">Vous convertissez</label>
          <span class="text-xs font-mono font-bold text-primary" id="disp-source-bal">Solde: 125 000 FCFA</span>
        </div>
        <div class="flex items-center justify-between border border-outline-variant rounded-2xl p-3 bg-surface-container-low focus-within:border-primary focus-within:bg-white transition-all">
          <input id="source-amt" class="w-full bg-transparent border-none p-0 text-2xl font-black font-mono text-on-surface focus:ring-0 outline-none" placeholder="0" type="number" value="150000" oninput="calculateRate()"/>
          <div class="flex items-center gap-1.5 bg-surface-container px-3 py-1.5 rounded-xl font-bold text-xs text-on-surface shrink-0">
            <span>🇧🇯</span>
            <span>FCFA (XOF)</span>
          </div>
        </div>
      </div>

      <!-- Swap Icon -->
      <div class="flex justify-center my-1">
        <div class="w-10 h-10 rounded-full bg-primary/10 text-primary border border-primary/20 flex items-center justify-center shadow-xs">
          <span class="material-symbols-outlined text-lg" style="font-variation-settings: 'FILL' 1;">currency_exchange</span>
        </div>
      </div>

      <!-- Destination Currency Input -->
      <div class="mb-4 relative">
        <label class="text-xs font-bold text-on-surface-variant uppercase block mb-1.5">Montant Converti Estimé</label>
        <div class="flex items-center justify-between border border-outline-variant rounded-2xl p-3 bg-surface-container-low">
          <input id="dest-amt" class="w-full bg-transparent border-none p-0 text-2xl font-black font-mono text-primary focus:ring-0 outline-none" placeholder="0.00" readonly="" type="text" value="228.67"/>
          <select id="dest-curr" onchange="calculateRate()" class="bg-surface-container border-none text-xs font-bold text-on-surface rounded-xl px-3 py-2 cursor-pointer focus:ring-primary">
            <option value="EUR" selected>🇪🇺 EUR (€)</option>
            <option value="USD">🇺🇸 USD ($)</option>
            <option value="NGN">🇳🇬 NGN (₦)</option>
            <option value="CAD">🇨🇦 CAD ($)</option>
          </select>
        </div>
      </div>

      <!-- Exchange Rate Info -->
      <div class="flex items-center justify-between bg-surface-container/60 rounded-2xl p-3 text-xs text-on-surface-variant">
        <div class="flex items-center gap-1.5">
          <span class="material-symbols-outlined text-primary text-base">trending_up</span>
          <span class="font-semibold">Taux appliqué :</span>
        </div>
        <div class="font-bold text-on-surface font-mono" id="rate-label">1 EUR = 655.957 FCFA</div>
      </div>
    </div>

    <!-- Summary Box -->
    <div class="bg-white rounded-3xl p-5 shadow-sm border border-outline-variant/40 flex flex-col gap-2.5 text-xs">
      <div class="flex justify-between items-center text-on-surface-variant">
        <span>Frais de change Switch :</span>
        <span class="text-emerald-700 font-bold">0.00 FCFA (0% Gratuit)</span>
      </div>
      <div class="flex justify-between items-center text-on-surface-variant">
        <span>Délai d'exécution :</span>
        <span class="text-on-surface font-semibold">Instantané</span>
      </div>
      <div class="h-px w-full bg-outline-variant/40 my-1"></div>
      <div class="flex justify-between items-center text-sm font-bold">
        <span>Total débité :</span>
        <span class="font-mono text-base font-black text-primary" id="total-debited">150 000 FCFA</span>
      </div>
    </div>

    <!-- Action Button -->
    <button onclick="confirmConversion()" class="w-full bg-primary text-white font-bold py-4 rounded-full shadow-lg hover:opacity-90 active:scale-[0.98] transition-all flex items-center justify-center gap-2 mt-1 cursor-pointer">
      <span>Valider la Conversion</span>
      <span class="material-symbols-outlined text-xl">arrow_forward</span>
    </button>
  </main>

  <script>
    const rates = {
      EUR: { rate: 655.957, label: "1 EUR = 655.957 FCFA" },
      USD: { rate: 602.50, label: "1 USD = 602.50 FCFA" },
      NGN: { rate: 0.42, label: "1 FCFA = 2.38 NGN" },
      CAD: { rate: 440.20, label: "1 CAD = 440.20 FCFA" }
    };

    document.addEventListener('DOMContentLoaded', () => {
      if (window.SwitchEngine) {
        const bal = window.SwitchEngine.getMainBalance();
        document.getElementById('disp-source-bal').textContent = 'Solde: ' + bal.toLocaleString('fr-FR') + ' FCFA';
      }
      calculateRate();
    });

    function calculateRate() {
      const srcAmt = parseFloat(document.getElementById('source-amt').value || '0');
      const curr = document.getElementById('dest-curr').value;
      const rObj = rates[curr] || rates.EUR;
      
      let converted = 0;
      if (curr === 'NGN') {
        converted = srcAmt / rObj.rate;
      } else {
        converted = srcAmt / rObj.rate;
      }

      document.getElementById('dest-amt').value = converted.toLocaleString('fr-FR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      document.getElementById('rate-label').textContent = rObj.label;
      document.getElementById('total-debited').textContent = Math.round(srcAmt).toLocaleString('fr-FR') + ' FCFA';
    }

    function confirmConversion() {
      const srcAmt = parseFloat(document.getElementById('source-amt').value || '0');
      const curr = document.getElementById('dest-curr').value;
      const destAmt = document.getElementById('dest-amt').value;

      if (srcAmt <= 0) {
        alert("Veuillez renseigner un montant à convertir.");
        return;
      }

      alert(`✅ Conversion de ${srcAmt.toLocaleString('fr-FR')} FCFA en ${destAmt} ${curr} effectuée avec succès au taux officiel BCEAO !`);
      if (window.switchNavigate) {
        window.switchNavigate('../tableau_de_bord_mis_jour/code.html');
      } else {
        window.location.href = '../tableau_de_bord_mis_jour/code.html';
      }
    }
  </script>

  <script src="../assets/switch.router.js"></script>
</body>
</html>
