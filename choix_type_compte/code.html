<!DOCTYPE html>

<html class="light" lang="fr">

<head>
        <meta charset="utf-8" />
        <meta content="width=device-width, initial-scale=1.0" name="viewport" />
        <title>Switch - Choisissez votre profil</title>
        <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
        <link rel="stylesheet" href="../assets/switch.css">
        <script src="../assets/switch.config.js"></script>
        <script id="tailwind-config">
                tailwind.config = {
                        darkMode: "class",
                        theme: {
                                extend: {
                                        "colors": {
                                                "otp-border": "#c9c4d7",
                                                "on-secondary": "#ffffff",
                                                "surface-variant": "#e6e0ee",
                                                "primary-fixed-dim": "#cabeff",
                                                "surface-container-highest": "#e6e0ee",
                                                "primary-fixed": "#e6deff",
                                                "on-surface": "#1c1a24",
                                                "inverse-primary": "#cabeff",
                                                "secondary-fixed": "#e5e2e1",
                                                "surface-container": "#f1ebf9",
                                                "on-tertiary": "#ffffff",
                                                "on-primary-fixed": "#1c0062",
                                                "primary-container": "#7758f6",
                                                "surface-agent": "#fdf8ff",
                                                "on-primary": "#ffffff",
                                                "surface": "#fdf8ff",
                                                "surface-bright": "#fdf8ff",
                                                "on-tertiary-fixed-variant": "#6e3900",
                                                "on-error-container": "#93000a",
                                                "surface-container-high": "#ebe6f3",
                                                "tertiary-fixed": "#ffdcc3",
                                                "inverse-on-surface": "#f4eefc",
                                                "on-error": "#ffffff",
                                                "background": "#fdf8ff",
                                                "on-secondary-fixed-variant": "#474647",
                                                "surface-container-low": "#f7f1ff",
                                                "inverse-surface": "#312f39",
                                                "secondary-container": "#e2dfdf",
                                                "tertiary": "#8d4b00",
                                                "outline-variant": "#c9c4d7",
                                                "outline": "#797586",
                                                "tertiary-container": "#b15f00",
                                                "surface-container-lowest": "#ffffff",
                                                "on-primary-fixed-variant": "#481ac7",
                                                "on-background": "#1c1a24",
                                                "on-tertiary-container": "#fffbff",
                                                "surface-tint": "#613ede",
                                                "secondary": "#5f5e5e",
                                                "on-surface-variant": "#484555",
                                                "secondary-fixed-dim": "#c8c6c6",
                                                "on-primary-container": "#fffbff",
                                                "commission-accent": "#f59e0b",
                                                "liquidity-low": "#ef4444",
                                                "liquidity-high": "#22c55e",
                                                "tertiary-fixed-dim": "#ffb77d",
                                                "surface-dim": "#ddd8e5",
                                                "on-tertiary-fixed": "#2f1500",
                                                "primary": "#5e3bdc",
                                                "on-secondary-fixed": "#1c1b1c",
                                                "error": "#ba1a1a",
                                                "error-container": "#ffdad6",
                                                "on-secondary-container": "#636262"
                                        },
                                        "borderRadius": {
                                                "DEFAULT": "0.25rem",
                                                "lg": "0.5rem",
                                                "xl": "0.75rem",
                                                "full": "9999px",
                                                "3xl": "1.5rem"
                                        },
                                        "spacing": {
                                                "card-padding": "24px",
                                                "stack-sm": "8px",
                                                "container-margin": "20px",
                                                "gutter": "16px",
                                                "stack-lg": "32px",
                                                "otp-gap": "8px",
                                                "stack-md": "16px"
                                        },
                                        "fontFamily": {
                                                "display-lg": ["Hanken Grotesk"],
                                                "body-lg": ["Hanken Grotesk"],
                                                "headline-sm": ["Hanken Grotesk"],
                                                "label-caps": ["Hanken Grotesk"],
                                                "headline-md": ["Hanken Grotesk"],
                                                "otp-display": ["Hanken Grotesk"],
                                                "display-lg-mobile": ["Hanken Grotesk"],
                                                "body-sm": ["Hanken Grotesk"]
                                        },
                                        "fontSize": {
                                                "display-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                                                "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                                                "headline-sm": ["18px", { "lineHeight": "24px", "fontWeight": "600" }],
                                                "label-caps": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600" }],
                                                "headline-md": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                                                "otp-display": ["24px", { "lineHeight": "32px", "fontWeight": "700" }],
                                                "display-lg-mobile": ["26px", { "lineHeight": "32px", "fontWeight": "700" }],
                                                "body-sm": ["14px", { "lineHeight": "20px", "fontWeight": "400" }]
                                        }
                                },
                        }
                }
        </script>
        <style>
                body {
                        font-family: 'Hanken Grotesk', sans-serif;
                }

                .role-card-input:checked+div {
                        border-color: #5e3bdc;
                        background-color: #f1ebf9;
                }

                .role-card-input:checked+div .radio-inner {
                        opacity: 1;
                        transform: scale(1);
                }

                .role-card-input:checked+div .icon-container {
                        background-color: #5e3bdc;
                        color: white;
                }
        </style>
</head>

<body class="bg-background min-h-screen flex flex-col overflow-x-hidden w-full antialiased text-on-background relative">
        <header class="px-container-margin py-stack-md flex flex-col gap-stack-sm pt-8">
                <button onclick="window.location.href='../accueil_splash_mis_jour/code.html'"
                        class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-container-high transition-colors -ml-2 mb-2 text-on-surface">
                        <span class="material-symbols-outlined">arrow_back</span>
                </button>
                <h1 class="font-display-lg-mobile text-display-lg-mobile text-on-background">Choisissez votre profil
                </h1>
                <p class="font-body-lg text-body-lg text-on-surface-variant">Comment souhaitez-vous utiliser Switch au
                        quotidien ?</p>
        </header>
        <main class="flex-1 px-container-margin py-stack-md flex flex-col gap-gutter overflow-y-auto pb-32">
                <label class="relative cursor-pointer group">
                        <input checked="" class="peer sr-only role-card-input" name="account_role" type="radio"
                                value="particulier" />
                        <div
                                class="p-card-padding rounded-3xl bg-surface-container-low border-2 border-transparent transition-all duration-200 flex items-start gap-gutter shadow-sm hover:shadow-md">
                                <div
                                        class="icon-container w-12 h-12 rounded-xl flex items-center justify-center bg-white text-primary transition-colors shrink-0 shadow-sm">
                                        <span class="material-symbols-outlined"
                                                style="font-variation-settings: 'FILL' 1;">person</span>
                                </div>
                                <div class="flex-1">
                                        <h3 class="font-headline-sm text-headline-sm text-on-surface mb-1">Particulier
                                        </h3>
                                        <p class="font-body-sm text-body-sm text-on-surface-variant">Envoyez, recevez,
                                                épargnez et gérez vos tontines</p>
                                </div>
                                <div
                                        class="w-6 h-6 rounded-full border-2 border-outline-variant flex items-center justify-center shrink-0 mt-1 transition-colors peer-checked:border-primary">
                                        <div
                                                class="radio-inner w-3 h-3 bg-primary rounded-full opacity-0 scale-0 transition-all duration-200">
                                        </div>
                                </div>
                        </div>
                </label>
                <label class="relative cursor-pointer group">
                        <input class="peer sr-only role-card-input" name="account_role" type="radio" value="agent" />
                        <div
                                class="p-card-padding rounded-3xl bg-surface-container-low border-2 border-transparent transition-all duration-200 flex items-start gap-gutter shadow-sm hover:shadow-md">
                                <div
                                        class="icon-container w-12 h-12 rounded-xl flex items-center justify-center bg-white text-primary transition-colors shrink-0 shadow-sm">
                                        <span class="material-symbols-outlined"
                                                style="font-variation-settings: 'FILL' 1;">storefront</span>
                                </div>
                                <div class="flex-1">
                                        <h3 class="font-headline-sm text-headline-sm text-on-surface mb-1">Agent Switch
                                        </h3>
                                        <p class="font-body-sm text-body-sm text-on-surface-variant">Effectuez des
                                                dépôts, retraits et gagnez des commissions</p>
                                </div>
                                <div
                                        class="w-6 h-6 rounded-full border-2 border-outline-variant flex items-center justify-center shrink-0 mt-1 transition-colors">
                                        <div
                                                class="radio-inner w-3 h-3 bg-primary rounded-full opacity-0 scale-0 transition-all duration-200">
                                        </div>
                                </div>
                        </div>
                </label>
                <label class="relative cursor-pointer group">
                        <input class="peer sr-only role-card-input" name="account_role" type="radio" value="marchand" />
                        <div
                                class="p-card-padding rounded-3xl bg-surface-container-low border-2 border-transparent transition-all duration-200 flex items-start gap-gutter shadow-sm hover:shadow-md">
                                <div
                                        class="icon-container w-12 h-12 rounded-xl flex items-center justify-center bg-white text-primary transition-colors shrink-0 shadow-sm">
                                        <span class="material-symbols-outlined"
                                                style="font-variation-settings: 'FILL' 1;">shopping_bag</span>
                                </div>
                                <div class="flex-1">
                                        <h3 class="font-headline-sm text-headline-sm text-on-surface mb-1">Marchand</h3>
                                        <p class="font-body-sm text-body-sm text-on-surface-variant">Acceptez les
                                                paiements QR et encaissez vos clients</p>
                                </div>
                                <div
                                        class="w-6 h-6 rounded-full border-2 border-outline-variant flex items-center justify-center shrink-0 mt-1 transition-colors">
                                        <div
                                                class="radio-inner w-3 h-3 bg-primary rounded-full opacity-0 scale-0 transition-all duration-200">
                                        </div>
                                </div>
                        </div>
                </label>
        </main>
        <div
                class="fixed bottom-0 left-0 right-0 p-container-margin bg-gradient-to-t from-background via-background to-transparent pb-8 pt-12">
                <button class="w-full bg-primary text-on-primary rounded-full py-4 px-6 flex items-center justify-between shadow-lg active:scale-95 transition-transform"
                        onclick="submitRole()">
                        <span class="font-headline-sm text-headline-sm ml-4">Continuer</span>
                        <span
                                class="material-symbols-outlined w-8 h-8 flex items-center justify-center rounded-full bg-white/20">arrow_forward</span>
                </button>
        </div>
        <script>
                function submitRole() {
                        const selectedRole = document.querySelector('input[name="account_role"]:checked').value;
                        if (selectedRole === 'particulier') {
                                window.location.href = '../inscription/code.html';
                        } else if (selectedRole === 'agent') {
                                window.location.href = '../inscription_agent_switch/code.html';
                        } else if (selectedRole === 'marchand') {
                                window.location.href = '../inscription_marchand/code.html';
                        }
                }
        </script>
        <script src="../assets/switch.router.js"></script>
</body>

</html>
