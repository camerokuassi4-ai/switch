name: Déploiement GitHub Pages — Switch Bénin

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Cloner le dépôt GitHub
        uses: actions/checkout@v4

      - name: 🐍 Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: ⚙️ Préparer dist/
        run: |
          python scripts/prepare_landing_page_dist.py

      - name: 🌐 Configurer GitHub Pages
        uses: actions/configure-pages@v5

      - name: 📤 Uploader l'artefact Pages (dist)
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist'

      - name: 🚀 Déployer sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
