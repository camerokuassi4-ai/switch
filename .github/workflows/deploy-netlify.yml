name: Déploiement Automatique Netlify — Switch Bénin

on:
  push:
    branches:
      - main
      - release/beta-public-v2.1.0
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build & Déploiement Netlify
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Cloner le dépôt GitHub
        uses: actions/checkout@v4

      - name: 🐍 Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: ⚙️ Préparer et valider le bundle de production 'dist/'
        run: |
          python scripts/prepare_landing_page_dist.py
          ls -la dist/

      - name: 🚀 Déclencher le Build Hook Netlify (Option A - si configuré)
        if: env.NETLIFY_BUILD_HOOK != ''
        env:
          NETLIFY_BUILD_HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
        run: |
          echo "Déclenchement du build hook Netlify..."
          curl -X POST -d '{}' "$NETLIFY_BUILD_HOOK"
          echo "✅ Signal de build Netlify envoyé avec succès !"

      - name: 🌐 Déploiement direct via Netlify CLI (Option A bis - si secrets définis)
        if: env.NETLIFY_AUTH_TOKEN != '' && env.NETLIFY_SITE_ID != ''
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          npx --yes netlify-cli deploy --dir=dist --prod --site=$NETLIFY_SITE_ID --auth=$NETLIFY_AUTH_TOKEN
          echo "✅ Déploiement direct Netlify CLI terminé avec succès !"

      - name: 📋 Rapport de statut
        run: |
          echo "===================================================="
          echo "🎉 DÉPLOIEMENT GITHUB ACTIONS TERMINÉ AVEC SUCCÈS"
          echo "Dossier 'dist/' prêt et synchronisé pour Netlify."
          echo "L'intégration native Netlify Git déploie automatiquement."
          echo "===================================================="
