<!DOCTYPE html>
<html class="light" lang="fr">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Accueil - Switch</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link rel="stylesheet" href="../assets/switch.css">
  <script src="../assets/switch.config.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700;800;900&display=swap');
    body {
      font-family: 'Hanken Grotesk', sans-serif;
      min-height: max(884px, 100dvh);
      background-color: #F8F9FD;
      color: #1C1A24;
      -webkit-font-smoothing: antialiased;
    }
  </style>
</head>
<body class="bg-background text-on-background font-body-lg min-h-screen flex flex-col justify-between overflow-hidden relative selection:bg-primary selection:text-white">

  <!-- Original Background Image -->
  <img src="../assets/images/img_002.jpg" alt="Background" class="absolute inset-0 w-full h-full object-cover z-0 pointer-events-none"/>

  <!-- Main Container : 3 blocs répartis avec un espace vertical harmonieux -->
  <main class="flex-grow flex flex-col justify-between items-center relative w-full h-full px-container-margin pt-12 pb-10 z-10 max-w-md mx-auto min-h-screen">

    <!-- 1. Original Logo Box (En haut) -->
    <div class="flex flex-col items-center justify-start w-full pt-4">
      <div class="bg-white rounded-[28px] p-4 shadow-xl flex items-center justify-center w-24 h-24 border border-outline-variant/30">
        <img alt="Logo Switch" class="w-full h-full object-contain" src="../assets/images/img_003.jpg"/>
      </div>
    </div>

    <!-- 2. Original Text Content (Centré) -->
    <div class="flex flex-col items-center text-center space-y-3 w-full px-4 my-auto">
      <h1 class="text-3xl md:text-4xl font-extrabold text-black leading-tight tracking-tight">
        Vos transferts,<br/><span class="text-[#5e3bdc]">simplifiés</span>
      </h1>
      <p class="text-black font-semibold text-sm md:text-base max-w-xs mx-auto leading-relaxed">
        La façon la plus rapide et sécurisée de gérer votre argent au Bénin et au-delà.
      </p>
    </div>

    <!-- 3. Bottom CTA Actions (En bas) -->
    <div class="w-full pb-4">
      <button onclick="startNewAccount()" class="w-full bg-[#5e3bdc] text-white py-4 px-6 rounded-full font-bold text-base shadow-[0_10px_20px_rgba(94,59,220,0.35)] hover:scale-[0.99] active:scale-95 transition-all duration-200 flex items-center justify-center gap-2 cursor-pointer">
        <span>Commencer</span>
        <span class="material-symbols-outlined text-xl">arrow_forward</span>
      </button>

      <div class="mt-4 text-center">
        <p class="text-sm text-black font-semibold">
          Vous avez déjà un compte ?
          <button onclick="goToLogin()" class="text-[#5e3bdc] font-bold hover:underline ml-1 cursor-pointer">
            Se connecter
          </button>
        </p>
      </div>
    </div>

  </main>

  <script>
    function startNewAccount() {
      localStorage.setItem('switch_kyc_level', '1');
      if (window.switchNavigate) {
        window.switchNavigate('../choix_type_compte/code.html');
      } else {
        window.location.href = '../choix_type_compte/code.html';
      }
    }

    function goToLogin() {
      if (window.switchNavigate) {
        window.switchNavigate('../connexion/code.html');
      } else {
        window.location.href = '../connexion/code.html';
      }
    }
  </script>

  <script src="../assets/switch.router.js"></script>
</body>
</html>
