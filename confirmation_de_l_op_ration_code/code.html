<!DOCTYPE html>

<html class="light" lang="fr"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Validation de l'opération - Espace Agent</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link rel="stylesheet" href="../assets/switch.css">
<script src="../assets/switch.config.js"></script>

<style>
        body { font-family: 'Hanken Grotesk', sans-serif; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined.fill-icon {
            font-variation-settings: 'FILL' 1;
        }
        
        /* OTP specific animations */
        @keyframes pulse-border {
            0% { border-color: rgba(94, 59, 220, 0.5); box-shadow: 0 0 0 0 rgba(94, 59, 220, 0.4); }
            70% { border-color: rgba(94, 59, 220, 1); box-shadow: 0 0 0 6px rgba(94, 59, 220, 0); }
            100% { border-color: rgba(94, 59, 220, 0.5); box-shadow: 0 0 0 0 rgba(94, 59, 220, 0); }
        }
        
        .otp-box {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 48px;
            height: 56px;
            border: 2px solid #c9c4d7; /* outline-variant */
            border-radius: 0.5rem;
            background-color: #ffffff;
            color: #1c1a24; /* on-surface */
            font-family: 'Hanken Grotesk';
            font-size: 24px;
            font-weight: 700;
        }
        
        .otp-box.active {
            border-color: #5e3bdc; /* primary */
            animation: pulse-border 2s infinite;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface min-h-screen flex flex-col items-center pb-24">
<!-- TopAppBar -->
<header class="w-full top-0 sticky z-40 bg-surface dark:bg-surface-dim flex items-center justify-between px-gutter py-4 max-w-7xl mx-auto border-b border-surface-variant">
<div class="flex items-center gap-3">
<button class="p-2 -ml-2 rounded-full hover:bg-surface-container transition-colors text-on-surface">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md font-bold text-primary dark:text-primary-fixed-dim">Validation</h1>
</div>
<div>
<button class="p-2 rounded-full hover:bg-surface-container transition-colors text-on-surface">
<span class="material-symbols-outlined">help_outline</span>
</button>
</div>
</header>
<!-- Main Canvas -->
<main class="w-full max-w-md mx-auto px-gutter mt-stack-lg flex flex-col items-center">
<!-- Intent Headline -->
<div class="text-center mb-stack-lg w-full">
<h2 class="font-display-lg-mobile text-display-lg-mobile md:font-display-lg md:text-display-lg text-on-surface mb-stack-sm">Validation de l'opération</h2>
<p class="font-body-lg text-body-lg text-on-surface-variant">Montrez ce code à l'agent pour valider votre dépôt/retrait</p>
</div>
<!-- Validation Card (High Contrast) -->
<div class="w-full bg-surface-container-lowest rounded-xl p-card-padding shadow-lg shadow-black/5 mb-stack-lg relative overflow-hidden border border-surface-variant">
<!-- Subtle background accent -->
<div class="absolute top-0 right-0 w-32 h-32 bg-primary/5 rounded-full blur-2xl -mr-16 -mt-16"></div>
<!-- Code Display -->
<div class="flex flex-col items-center justify-center py-stack-md relative z-10">
<div class="flex gap-otp-gap mb-stack-md">
<div class="otp-box active">4</div>
<div class="otp-box">5</div>
<div class="otp-box">8</div>
<div class="w-2"></div> <!-- Space between groups -->
<div class="otp-box">9</div>
<div class="otp-box">1</div>
<div class="otp-box">2</div>
</div>
<div class="flex items-center gap-2 text-primary bg-primary-container/10 px-4 py-2 rounded-full mt-stack-sm">
<span class="material-symbols-outlined fill-icon text-[20px]">timer</span>
<span class="font-headline-sm text-headline-sm">04:59</span>
</div>
</div>
<div class="w-full h-px bg-surface-variant my-stack-md"></div>
<!-- QR Code Variant Hint -->
<div class="flex items-center justify-between p-3 bg-surface-container-low rounded-lg cursor-pointer hover:bg-surface-container transition-colors group">
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-full bg-primary/10 flex items-center justify-center text-primary group-hover:bg-primary group-hover:text-on-primary transition-colors">
<span class="material-symbols-outlined">qr_code_scanner</span>
</div>
<div>
<p class="font-headline-sm text-headline-sm text-on-surface">Prêt à scanner</p>
<p class="font-body-sm text-body-sm text-on-surface-variant">Afficher le QR code</p>
</div>
</div>
<span class="material-symbols-outlined text-outline">chevron_right</span>
</div>
</div>
<!-- Transaction Details Bento -->
<div class="w-full bg-surface-container-lowest rounded-xl p-card-padding shadow-sm border border-surface-variant mb-stack-lg">
<h3 class="font-label-caps text-label-caps text-outline uppercase tracking-wider mb-stack-md">Détails de l'opération</h3>
<div class="flex justify-between items-center mb-stack-sm">
<span class="font-body-lg text-body-lg text-on-surface-variant">Type</span>
<span class="font-headline-sm text-headline-sm text-on-surface flex items-center gap-2">
                    Retrait
                    <span class="material-symbols-outlined text-primary text-[18px]">arrow_downward</span>
</span>
</div>
<div class="flex justify-between items-center mb-stack-sm">
<span class="font-body-lg text-body-lg text-on-surface-variant">Montant</span>
<span class="font-headline-md text-headline-md text-on-surface">25 000 FCFA</span>
</div>
<div class="flex justify-between items-center">
<span class="font-body-lg text-body-lg text-on-surface-variant">Frais Agent</span>
<span class="font-headline-sm text-headline-sm text-commission-accent flex items-center gap-1">
                    250 FCFA
                    <span class="material-symbols-outlined text-[16px]">percent</span>
</span>
</div>
</div>
<!-- Action Button -->
<button class="w-full bg-primary text-on-primary rounded-full py-4 px-6 font-headline-sm text-headline-sm hover:bg-primary/90 transition-colors shadow-md active:scale-[0.98]">
            Annuler l'opération
        </button>
</main>
<!-- Suppressed BottomNavBar due to Contextual State (Linear/Transactional task requiring a Back/Cancel action) -->
<script src="../assets/switch.router.js"></script>
</body></html>
