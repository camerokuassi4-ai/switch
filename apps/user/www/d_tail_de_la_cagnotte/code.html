<!DOCTYPE html>

<html lang="fr"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
<title>Cagnotte Detail</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link rel="stylesheet" href="../assets/switch.css">
<script src="../assets/switch.config.js"></script>

<style>
        body {
            background-color: #F8F9FA; /* Level 0 */
        }
        .fluid-gradient {
            background: linear-gradient(135deg, #7B5CFA 0%, #a894fc 100%);
            /* Simplified fluid silk */
        }
        .soft-shadow {
            box-shadow: 0 10px 20px -4px rgba(0,0,0,0.04); /* Level 1 */
        }
        .nav-shadow {
            box-shadow: 0 15px 30px -4px rgba(0,0,0,0.15); /* Level 2 */
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="text-on-surface antialiased min-h-screen flex flex-col relative pb-32">
<!-- TopAppBar -->
<header class="bg-transparent text-primary flex justify-between items-center px-container-margin py-stack-md w-full sticky top-0 z-10 flat no shadows backdrop-blur-md">
<button class="w-10 h-10 flex items-center justify-center rounded-full bg-surface-container-low hover:bg-surface-container-high transition-colors active:scale-95 text-on-surface-variant">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md text-on-surface font-bold text-center flex-1">Cagnotte Anniversaire</h1>
<button class="w-10 h-10 flex items-center justify-center rounded-full bg-surface-container-low hover:bg-surface-container-high transition-colors active:scale-95 text-on-surface-variant">
<span class="material-symbols-outlined" data-icon="more_vert">more_vert</span>
</button>
</header>
<main class="flex-1 px-container-margin pb-stack-lg flex flex-col gap-stack-lg max-w-md mx-auto w-full">
<!-- Hero Section / Balance Card -->
<section class="bg-surface rounded-3xl p-card-padding soft-shadow relative overflow-hidden flex flex-col gap-stack-md aspect-[1.58/1]">
<div class="absolute inset-0 fluid-gradient opacity-10"></div>
<div class="relative z-10 flex flex-col h-full justify-between">
<div class="flex justify-between items-start">
<div>
<p class="font-body-sm text-body-sm text-on-surface-variant mb-1">Montant collecté</p>
<h2 class="font-display-lg-mobile text-display-lg-mobile text-primary font-bold">125 000 FCFA</h2>
</div>
<div class="bg-primary-container text-on-primary-container px-3 py-1 rounded-full flex items-center gap-1">
<span class="material-symbols-outlined text-[16px]">lock_open</span>
<span class="font-label-caps text-label-caps">Active</span>
</div>
</div>
<div class="flex flex-col gap-2">
<div class="flex justify-between font-body-sm text-body-sm">
<span class="text-on-surface-variant">Objectif: 200 000 FCFA</span>
<span class="font-bold text-primary">62%</span>
</div>
<!-- Progress Bar -->
<div class="w-full bg-surface-container-highest rounded-full h-2.5 overflow-hidden">
<div class="bg-primary h-2.5 rounded-full" style="width: 62%"></div>
</div>
<p class="font-body-sm text-body-sm text-on-surface-variant mt-2 text-right">Ferme dans 14 jours</p>
</div>
</div>
</section>
<!-- Contributors Section -->
<section class="flex flex-col gap-stack-md">
<h3 class="font-headline-md text-headline-md text-on-surface">Contributeurs (12)</h3>
<div class="flex flex-col gap-stack-sm">
<!-- Contributor 1 -->
<div class="bg-surface rounded-2xl p-4 soft-shadow flex items-center gap-4">
<img class="w-12 h-12 rounded-full object-cover border-2 border-surface-container" data-alt="A modern, high-quality, professional headshot avatar of a West African woman smiling warmly, set against a soft, bright studio background. The lighting is clean and flattering, suitable for a sleek fintech application in a light-mode setting. Colors are natural with subtle warm tones, avoiding harsh shadows to maintain a welcoming, premium corporate aesthetic." src="../assets/images/img_012.jpg"/>
<div class="flex-1">
<h4 class="font-body-lg text-body-lg font-bold text-on-surface">Aminata D.</h4>
<p class="font-body-sm text-body-sm text-on-surface-variant">Il y a 2 heures</p>
</div>
<span class="font-body-lg text-body-lg font-bold text-primary">+ 25 000 F</span>
</div>
<!-- Contributor 2 -->
<div class="bg-surface rounded-2xl p-4 soft-shadow flex items-center gap-4">
<img class="w-12 h-12 rounded-full object-cover border-2 border-surface-container" data-alt="A modern, high-quality, professional headshot avatar of a West African man with short hair and a neat beard, looking confident and approachable. The background is a clean, subtle gradient suitable for a modern fintech UI. Lighting is soft and bright, emphasizing a premium, trustworthy light-mode design language with neutral tones and sharp details." src="../assets/images/img_013.jpg"/>
<div class="flex-1">
<h4 class="font-body-lg text-body-lg font-bold text-on-surface">Komi A.</h4>
<p class="font-body-sm text-body-sm text-on-surface-variant">Hier</p>
</div>
<span class="font-body-lg text-body-lg font-bold text-primary">+ 10 000 F</span>
</div>
<!-- Contributor 3 -->
<div class="bg-surface rounded-2xl p-4 soft-shadow flex items-center gap-4">
<div class="w-12 h-12 rounded-full bg-surface-container-high flex items-center justify-center border-2 border-surface-container text-on-surface-variant font-bold">
                        AN
                    </div>
<div class="flex-1">
<h4 class="font-body-lg text-body-lg font-bold text-on-surface">Anonyme</h4>
<p class="font-body-sm text-body-sm text-on-surface-variant">25 Oct 2023</p>
</div>
<span class="font-body-lg text-body-lg font-bold text-primary">+ 5 000 F</span>
</div>
<button class="mt-2 text-primary font-body-sm text-body-sm font-bold text-center hover:underline">Voir tous les contributeurs</button>
</div>
</section>
</main>
<!-- Bottom Action Buttons (Contextual FAB Replacement for Transactional/Detail View) -->
<div class="fixed bottom-0 left-0 w-full bg-surface/90 backdrop-blur-md p-container-margin border-t border-surface-container-highest z-50 flex gap-gutter">
<button id="btn-share-cagnotte"
    onclick="(async()=>{ const url=window.location.href; const txt='Participe à ma cagnotte Anniversaire Switch ! '+url; if(navigator.share){await navigator.share({title:'Cagnotte Anniversaire',text:txt,url})}else{await navigator.clipboard.writeText(txt); const b=document.getElementById('btn-share-cagnotte'); const orig=b.innerHTML; b.innerHTML='<span class=\'material-symbols-outlined\'>check</span> Lien copié !'; setTimeout(()=>b.innerHTML=orig,2000)} })()"
    class="flex-1 bg-surface border border-outline-variant text-primary rounded-full py-3 px-6 flex items-center justify-center gap-2 hover:bg-surface-container-low transition-colors font-body-lg text-body-lg font-bold active:scale-95">
  <span class="material-symbols-outlined">share</span>
  Partager
</button>
<button onclick="window.location.href='../confirmation_de_succ_s/code.html'"
    class="flex-1 bg-[#7B5CFA] text-white rounded-full py-3 px-6 flex items-center justify-center gap-2 hover:opacity-90 transition-opacity shadow-lg shadow-[#7B5CFA]/30 font-body-lg text-body-lg font-bold active:scale-95">
  <span class="material-symbols-outlined text-white">volunteer_activism</span>
  Contribuer
</button>
</div>
<script src="../assets/switch.router.js"></script>
</body></html>
