</div>

</div>
</div>
<!-- Messaging -->
<div class="text-center max-w-xs">
<h2 id="empty-state-notifications-title" class="font-headline-md text-headline-md text-on-surface mb-stack-sm">Aucune notification pour le moment</h2>
<p class="font-body-lg text-body-lg text-on-surface-variant">Les notifications liées à vos transactions et à votre activité apparaîtront ici.</p>
</div>

<script src="../assets/switch.config.js"></script>
<script src="../assets/switch.api.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    const prof = window.SwitchAPI ? window.SwitchAPI.getProfile() : {
      first_name: '',
      full_name: localStorage.getItem('switch_user_fullname') || ''
    };
    const name = prof.first_name || (prof.full_name ? prof.full_name.split(' ')[0] : '');
    const titleEl = document.getElementById('user-greeting-title');
    if (titleEl) titleEl.textContent = name ? `Bonjour, ${name}` : 'Bonjour';
    const avatarImg = document.getElementById('user-avatar-img');
    const initialsEl = document.getElementById('user-avatar-initials');
    if (prof.avatar_url && !prof.avatar_url.includes('img_032.jpg')) {
      avatarImg.src = prof.avatar_url;
      avatarImg.classList.remove('hidden');
      if (initialsEl) initialsEl.classList.add('hidden');
    } else if (name) {
      if (initialsEl) initialsEl.textContent = name.slice(0, 2).toUpperCase();
    }
  });
</script>
