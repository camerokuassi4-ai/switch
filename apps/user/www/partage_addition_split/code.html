<!DOCTYPE html>
<html class="light" lang="fr">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
  <title>Diviser la Note - Switch Split Bill</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link rel="stylesheet" href="../assets/switch.css">
  <script src="../assets/switch.config.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700;900&display=swap');
    body { font-family: 'Hanken Grotesk', sans-serif; min-height: max(884px, 100dvh); }
    .soft-shadow { box-shadow: 0px 10px 25px rgba(0, 0, 0, 0.05); }
  </style>
</head>
<body class="bg-background text-on-background min-h-screen pb-32 flex flex-col antialiased">
  <!-- TopAppBar -->
  <header class="flex items-center justify-between px-container-margin py-stack-md w-full max-w-xl mx-auto pt-6">
    <div class="flex items-center gap-3">
      <button aria-label="Retour" onclick="window.history.back()" class="p-2 -ml-2 rounded-full hover:bg-surface-container-high transition-colors flex items-center justify-center text-on-surface cursor-pointer">
        <span class="material-symbols-outlined">arrow_back</span>
      </button>
      <div>
        <h1 class="text-xl font-bold text-on-surface">Diviser la Note</h1>
        <p class="text-xs text-on-surface-variant">Partage d'addition & frais entre amis</p>
      </div>
    </div>
    <div class="w-10 h-10 rounded-full bg-primary/10 text-primary flex items-center justify-center font-bold">
      <span class="material-symbols-outlined text-2xl" style="font-variation-settings: 'FILL' 1;">pie_chart</span>
    </div>
  </header>

  <!-- Main Content -->
  <main class="px-container-margin max-w-xl mx-auto w-full pt-2 flex flex-col gap-6">
    <!-- Form Box -->
    <div class="bg-surface-container-lowest rounded-3xl p-6 soft-shadow border border-outline-variant flex flex-col gap-5">
      <!-- Motif de la dépense -->
      <div class="flex flex-col gap-1.5">
        <label class="text-xs font-bold text-on-surface-variant uppercase">Motif / Lieu</label>
        <input type="text" id="split-title" value="Dîner Restaurant L'Atelier Haie Vive" class="w-full bg-surface-container border border-outline-variant rounded-2xl px-4 py-3.5 text-sm font-semibold focus:outline-none focus:border-primary"/>
      </div>

      <!-- Montant total de la facture -->
      <div class="flex flex-col gap-1.5">
        <label class="text-xs font-bold text-on-surface-variant uppercase">Montant total de l'addition</label>
        <div class="relative flex items-center">
          <input type="number" id="split-total" value="30000" min="1000" step="500" class="w-full bg-surface-container border border-outline-variant rounded-2xl pl-4 pr-16 py-3.5 text-2xl font-black font-mono focus:outline-none focus:border-primary" oninput="calculateSplit()"/>
          <span class="absolute right-4 font-bold text-sm text-on-surface-variant">FCFA</span>
        </div>
      </div>

      <!-- Participants Selector (Adele + 3 amis) -->
      <div class="flex flex-col gap-3">
        <div class="flex justify-between items-center">
          <label class="text-xs font-bold text-on-surface-variant uppercase">Participants (<span id="people-count">4 personnes</span>)</label>
          <button type="button" onclick="addFriendPrompt()" class="text-xs text-primary font-bold hover:underline flex items-center gap-1 cursor-pointer">
            <span class="material-symbols-outlined text-sm">person_add</span>
            Ajouter un ami
          </button>
        </div>

        <div class="grid grid-cols-4 gap-2 text-center" id="friends-grid">
          <!-- Moi (Adele) -->
          <div class="p-2.5 rounded-2xl bg-primary/10 border-2 border-primary flex flex-col items-center gap-1">
            <div class="w-10 h-10 rounded-full overflow-hidden border border-primary">
              <img src="../assets/images/img_046.jpg" class="w-full h-full object-cover" alt="Illustration Switch"/>
            </div>
            <span class="text-[11px] font-bold text-primary">Moi</span>
          </div>

          <!-- Koffi -->
          <div class="p-2.5 rounded-2xl bg-surface-container border border-outline-variant flex flex-col items-center gap-1">
            <div class="w-10 h-10 rounded-full overflow-hidden">
              <img src="../assets/images/img_053.jpg" class="w-full h-full object-cover" alt="Illustration Switch"/>
            </div>
            <span class="text-[11px] font-bold text-on-surface">Koffi</span>
          </div>

          <!-- Marie -->
          <div class="p-2.5 rounded-2xl bg-surface-container border border-outline-variant flex flex-col items-center gap-1">
            <div class="w-10 h-10 rounded-full overflow-hidden bg-primary-container text-primary flex items-center justify-center font-bold text-xs">
              MD
            </div>
            <span class="text-[11px] font-bold text-on-surface">Marie</span>
          </div>

          <!-- Eric -->
          <div class="p-2.5 rounded-2xl bg-surface-container border border-outline-variant flex flex-col items-center gap-1">
            <div class="w-10 h-10 rounded-full overflow-hidden">
              <img src="../assets/images/img_043.jpg" class="w-full h-full object-cover" alt="Illustration Switch"/>
            </div>
            <span class="text-[11px] font-bold text-on-surface">Eric</span>
          </div>
        </div>
      </div>

      <!-- Result Banner: Part par personne -->
      <div class="bg-primary text-on-primary rounded-2xl p-5 flex items-center justify-between shadow-md">
        <div>
          <span class="text-xs text-primary-fixed-dim font-bold uppercase tracking-wider">Part individuelle</span>
          <h3 class="text-2xl sm:text-3xl font-black font-mono mt-0.5" id="split-per-person">7 500 FCFA</h3>
        </div>
        <div class="text-right text-xs text-primary-fixed-dim">
          <p>4 parts égales</p>
          <p>Frais : 0 FCFA</p>
        </div>
      </div>

      <!-- Submit / Share Button -->
      <button onclick="requestSplitPayments()" class="w-full bg-[#25D366] text-white font-bold py-4 rounded-full shadow-lg hover:opacity-90 active:scale-[0.98] transition-all flex items-center justify-center gap-2 text-base cursor-pointer">
        <span class="material-symbols-outlined text-xl">chat</span>
        <span>Envoyer les demandes sur WhatsApp</span>
      </button>
    </div>
  </main>

  <script>
    let numPeople = 4;
    function calculateSplit() {
      const total = parseInt(document.getElementById('split-total').value || 0);
      const perPerson = Math.round(total / numPeople);
      document.getElementById('split-per-person').textContent = perPerson.toLocaleString('fr-FR') + ' FCFA';
    }

    function addFriendPrompt() {
      const name = prompt("Nom de l'ami à ajouter :");
      if (name) {
        numPeople++;
        document.getElementById('people-count').textContent = numPeople + ' personnes';
        calculateSplit();
        alert(name + " a été ajouté(e) au partage !");
      }
    }

    function requestSplitPayments() {
      const title = document.getElementById('split-title').value;
      const perPerson = document.getElementById('split-per-person').textContent;
      const msg = encodeURIComponent(
        "🍕 *PARTAGE D'ADDITION SWITCH BÉNIN*\n" +
        "━━━━━━━━━━━━━━━━━━━━\n" +
        "📍 *" + title + "*\n" +
        "💰 *Ta part :* " + perPerson + "\n\n" +
        "👉 Règle directement en 1 clic sur Switch : https://pay.switch.bj/split/dinner-at-atelier"
      );
      window.open("https://wa.me/?text=" + msg, "_blank");
    }
  </script>

  <script src="../assets/switch.router.js"></script>
</body>
</html>
